name: GOLD HUNTER AI Compiler

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      # 1. Download repository files
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Verify source file
      - name: Verify EA source
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "GoldHunterAI_V3_4.mq5"

          if (!(Test-Path $source -PathType Leaf)) {
            throw "GoldHunterAI_V3_4.mq5 was not found in the repository root."
          }

          if ((Get-Item $source).Length -eq 0) {
            throw "The EA source file is empty."
          }

          Write-Host "EA source verified: $source"
          Write-Host "Source size: $((Get-Item $source).Length) bytes"

          "EA_SOURCE=$source" >> $env:GITHUB_ENV

      # 3. Download the official MetaTrader installer
      - name: Download MetaTrader 5
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"

          $url = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer `
            -TimeoutSec 180

          if (!(Test-Path $installer -PathType Leaf)) {
            throw "The MetaTrader installer download failed."
          }

          if ((Get-Item $installer).Length -lt 100000) {
            throw "The downloaded installer is unexpectedly small."
          }

          Write-Host "Installer downloaded successfully."
          Write-Host "Installer size: $((Get-Item $installer).Length) bytes"

      # 4. Install MetaTrader 5
      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"
          $installDir = "C:\MT5"

          New-Item `
            -ItemType Directory `
            -Path $installDir `
            -Force |
            Out-Null

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList @("/auto", "/path:$installDir") `
            -Wait `
            -PassThru

          Write-Host "Installer exit code: $($process.ExitCode)"

          $editor = Get-ChildItem `
            -Path $installDir `
            -Filter "metaeditor64.exe" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          $terminal = Get-ChildItem `
            -Path $installDir `
            -Filter "terminal64.exe" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (!$editor) {
            throw "MetaEditor64.exe was not found. The installation is incomplete."
          }

          if (!$terminal) {
            throw "terminal64.exe was not found. The installation is incomplete."
          }

          Write-Host "MetaEditor: $($editor.FullName)"
          Write-Host "Terminal: $($terminal.FullName)"

          "METAEDITOR_PATH=$($editor.FullName)" >> $env:GITHUB_ENV
          "TERMINAL_PATH=$($terminal.FullName)" >> $env:GITHUB_ENV

      # 5. Initialize MetaTrader before searching for library files
      - name: Initialize MetaTrader terminal
        shell: pwsh
        run: |
          $terminal = $env:TERMINAL_PATH

          if (!(Test-Path $terminal -PathType Leaf)) {
            throw "The MetaTrader terminal executable is missing."
          }

          $terminalDir = Split-Path $terminal -Parent

          Write-Host "Starting terminal in portable mode."
          Write-Host "Terminal directory: $terminalDir"

          $process = Start-Process `
            -FilePath $terminal `
            -ArgumentList "/portable" `
            -WorkingDirectory $terminalDir `
            -PassThru

          Write-Host "Terminal process ID: $($process.Id)"

          Start-Sleep -Seconds 45

          $running = Get-
