name: GOLD HUNTER AI V4.11 Compiler

on:
workflow_dispatch:
push:
branches:
- main
- goldhunter-v4-safety-upgrade
paths:
- 'GoldHunterAI_V4_11.mq5'
- '.github/workflows/main.yml'
- 'Include/'
- 'Libraries/'

permissions:
contents: read

jobs:
compile:
name: Compile GoldHunterAI V4.11
runs-on: windows-latest
timeout-minutes: 30

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Verify source file
    shell: pwsh
    run: |
      $ErrorActionPreference = "Stop"
      $source = Join-Path $env:GITHUB_WORKSPACE "GoldHunterAI_V4_11.mq5"

      if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
          throw "GoldHunterAI_V4_11.mq5 was not found."
      }

      New-Item -ItemType Directory -Path "build-output" -Force | Out-Null

      @(
          "Source: $source"
          "SHA256: $((Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash)"
      ) | Out-File "build-output/source-diagnostics.txt" -Encoding utf8

  - name: Download and verify official MT5 installer
    shell: pwsh
    run: |
      $ErrorActionPreference = "Stop"
      $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"
      $url = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"

      Invoke-WebRequest -Uri $url -OutFile $installer

      if ((Get-Item -LiteralPath $installer).Length -lt 1MB) {
          throw "MT5 installer is unexpectedly small."
      }

      $signature = Get-AuthenticodeSignature -FilePath $installer

      "Installer signature: $($signature.Status)" |
          Out-File "build-output/installer-diagnostics.txt" -Encoding utf8

      if ($signature.Status -ne "Valid") {
          throw "Installer signature is not valid."
      }

  - name: Install MetaTrader 5
    shell: pwsh
    run: |
      $ErrorActionPreference = "Stop"
      $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"

      $process = Start-Process -FilePath $installer `
          -ArgumentList "/auto" -Wait -PassThru

      Write-Host "Installer exit code: $($process.ExitCode)"

      $editorCandidates = @(
          "C:\MT5\MetaEditor64.exe",
          "C:\Program Files\MetaTrader 5\MetaEditor64.exe",
          "C:\Program Files (x86)\MetaTrader 5\MetaEditor64.exe"
      )

      $terminalCandidates = @(
          "C:\MT5\terminal64.exe",
          "C:\Program Files\MetaTrader 5\terminal64.exe",
          "C:\Program Files (x86)\MetaTrader 5\terminal64.exe"
      )

      $editor = $editorCandidates |
          Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } |
          Select-Object -First 1

      $terminal = $terminalCandidates |
          Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } |
          Select-Object -First 1

      if (-not $editor) {
          throw "MetaEditor64.exe was not found."
      }

      if (-not $terminal) {
          throw "terminal64.exe was not found."
      }

      "METAEDITOR_PATH=$editor" |
          Out-File $env:GITHUB_ENV -Append -Encoding utf8

      "MT5_TERMINAL_PATH=$terminal" |
          Out-File $env:GITHUB_ENV -Append -Encoding utf8

  - name: Initialize terminal and synchronize official MQL5 Include library
    shell: pwsh
    run: |
      $ErrorActionPreference = "Stop"

      $terminal = $env:MT5_TERMINAL_PATH
      $installDir = Split-Path -Parent $terminal

      if (-not (Test-Path -LiteralPath $terminal -PathType Leaf)) {
          throw "MT5 terminal executable was not found: $terminal"
      }

      # Initialize the terminal in portable mode.
      $process = Start-Process -FilePath $terminal `
          -ArgumentList "/portable" -PassThru

      Start-Sleep -Seconds 20

      if (-not $process.HasExited) {
          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
      }

      # Portable terminal data is expected beside the installation.
      $destinationInclude = Join-Path $installDir "MQL5\Include"

      # Search for an Include directory containing the official Trade.mqh.
      $sourceCandidates = @(
          (Join-Path $installDir "MQL5\Include"),
          (Join-Path $env:APPDATA "MetaQuotes\Terminal"),
          (Join-Path $env:LOCALAPPDATA "MetaQuotes\Terminal")
      )

      $sourceInclude = $null

      foreach ($candidateRoot in $sourceCandidates) {
          if (-not (Test-Path -LiteralPath $candidateRoot -PathType Container)) {
              continue
          }

          if ((Split-Path $candidateRoot -Leaf) -eq "Include") {
              $possibleTrade = Join-Path $candidateRoot "Trade\Trade.mqh"

              if (Test-Path -LiteralPath $possibleTrade -PathType Leaf) {
                  $sourceInclude = $candidateRoot
                  break
              }
          }
          else {
              $found = Get-ChildItem -LiteralPath $candidateRoot `
                  -Filter "Trade.mqh" -File -Recurse `
                  -ErrorAction SilentlyContinue |
                  Where-Object {
                      $_.FullName -match '\\MQL5\\Include\\Trade\\Trade\.mqh$'
                  } |
                  Select-Object -First 1

              if ($found) {
                  $sourceInclude = Split-Path -Parent (
                      Split-Path -Parent $found.FullName
                  )
                  break
              }
          }
      }

      if (-not $sourceInclude) {
          throw "Could not locate MQL5\Include containing Trade\Trade.mqh."
      }

      $sourceTrade = Join-Path $sourceInclude "Trade\Trade.mqh"

      if (-not (Test-Path -LiteralPath $sourceTrade -PathType Leaf)) {
          throw "Source Trade.mqh is missing: $sourceTrade"
      }

      New-Item -ItemType Directory -Path $destinationInclude -Force | Out-Null

      $sourceHash = (Get-FileHash -LiteralPath $sourceTrade -Algorithm SHA256).Hash

      @(
          "Terminal executable: $terminal"
          "Installation directory: $installDir"
          "Source Include directory: $sourceInclude"
          "Destination Include directory: $destinationInclude"
          "Source Trade.mqh SHA256: $sourceHash"
      ) | Out-File "build-output/library-sync-diagnostics.txt" -Encoding utf8

      # Copy the entire Include tree, including dependent standard-library files.
      $robocopyLog = Join-Path $env:GITHUB_WORKSPACE "build-output\include-copy.log"

      & robocopy $sourceInclude $destinationInclude /E /COPY:DAT /R:2 /W:1 /NFL /NDL /NP "/LOG:$robocopyLog"
      $copyExitCode = $LASTEXITCODE

      # Robocopy exit codes below 8 are nonfatal.
      if ($copyExitCode -ge 8) {
          throw "Include library copy failed. Robocopy exit code: $copyExitCode"
      }

      $destinationTrade = Join-Path $destinationInclude "Trade\Trade.mqh"

      if (-not (Test-Path -LiteralPath $destinationTrade -PathType Leaf)) {
          throw "Trade.mqh is missing after synchronization: $destinationTrade"
      }

      $destinationHash = (Get-FileHash -LiteralPath $destinationTrade -Algorithm SHA256).Hash

      if ($sourceHash -ne $destinationHash) {
          throw "Source and destination Trade.mqh SHA256 hashes do not match."
      }

      @(
          "Robocopy exit code: $copyExitCode"
          "Destination Trade.mqh: $destinationTrade"
          "Destination Trade.mqh size: $((Get-Item -LiteralPath $destinationTrade).Length) bytes"
          "Destination Trade.mqh SHA256: $destinationHash"
          "Source and destination hashes match: True"
          "Trade.mqh include directives:"
          (Get-Content -LiteralPath $destinationTrade |
              Select-String -Pattern '^\s*#include' |
              ForEach-Object { $_.Line })
      ) | Out-File "build-output/library-sync-verification.txt" -Encoding utf8

      Write-Host "Official Include library synchronized and verified."
      Write-Host "Source: $sourceInclude"
      Write-Host "Destination: $destinationInclude"
      Write-Host "Trade.mqh SHA256 match: True"

  - name: Compile GoldHunterAI V4.11
    shell: pwsh
    run: |
      $ErrorActionPreference = "Stop"
      $source = Join-Path $env:GITHUB_WORKSPACE "GoldHunterAI_V4_11.mq5"
      $editor = $env:METAEDITOR_PATH
      $log = Join-Path $env:GITHUB_WORKSPACE "build-output\GoldHunterAI_V4_11_compile.log"
      $output = Join-Path $env:GITHUB_WORKSPACE "GoldHunterAI_V4_11.ex5"

      if (Test-Path -LiteralPath $output) {
          Remove-Item -LiteralPath $output -Force
      }

      $arguments = "/compile:`"$source`" /log:`"$log`""

      $process = Start-Process -FilePath $editor `
          -ArgumentList $arguments -Wait -PassThru

      Write-Host "MetaEditor exit code: $($process.ExitCode)"

      if (-not (Test-Path -LiteralPath $log -PathType Leaf)) {
          throw "MetaEditor did not create a compile log."
      }

      Get-Content -LiteralPath $log

      $logText = Get-Content -LiteralPath $log -Raw

      $result = [regex]::Match(
          $logText,
          'Result:\s*(\d+)\s+errors?,\s*(\d+)\s+warnings?',
          [System.Text.RegularExpressions.RegexOptions]::IgnoreCase
      )

      if (-not $result.Success) {
          throw "Could not find the compiler's final Result line."
      }

      $errors = [int]$result.Groups[1].Value
      $warnings = [int]$result.Groups[2].Value

      if ($errors -ne 0) {
          throw "Compilation failed: $errors error(s), $warnings warning(s)."
      }

      if (-not (Test-Path -LiteralPath $output -PathType Leaf)) {
          throw "No EX5 file was created."
      }

      $size = (Get-Item -LiteralPath $output).Length

      if ($size -le 0) {
          throw "The EX5 file is empty."
      }

      Copy-Item -LiteralPath $output `
          -Destination "build-output\GoldHunterAI_V4_11.ex5" -Force

      @(
          "Compiler errors: $errors"
          "Compiler warnings: $warnings"
          "EX5 size: $size bytes"
      ) | Out-File "build-output/build-summary.txt" -Encoding utf8

  - name: Upload build diagnostics and compiled file
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: GOLD-HUNTER-AI-V4-11-Build-Results
      path: build-output/
      if-no-files-found: warn
