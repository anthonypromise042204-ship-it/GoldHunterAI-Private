name: GOLD HUNTER AI V4 Compiler

on:
  workflow_dispatch:
  push:
    paths:
      - 'GoldHunterAI_V4.mq5'
      - '.github/workflows/main.yml'
      - '.github/workflows/gold-hunter-v4.yml'

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create build report directory
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Path "$env:GITHUB_WORKSPACE\build-output" `
            -Force | Out-Null

      - name: Verify EA source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = "$env:GITHUB_WORKSPACE\GoldHunterAI_V4.mq5"

          if (!(Test-Path $source -PathType Leaf)) {
            throw 'GoldHunterAI_V4.mq5 was not found.'
          }

          Write-Host "Source: $source"
          Write-Host "Size: $((Get-Item $source).Length) bytes"
          Write-Host "Line 8: $((Get-Content $source)[7])"

      - name: Download MetaTrader installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = "$env:RUNNER_TEMP\mt5setup.exe"

          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $installer `
            -TimeoutSec 240

          if (!(Test-Path $installer -PathType Leaf)) {
            throw 'MetaTrader installer download failed.'
          }

          if ((Get-Item $installer).Length -lt 1MB) {
            throw 'Installer is unexpectedly small.'
          }

          Write-Host "Installer downloaded successfully."

      - name: Install and locate MetaEditor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = "$env:RUNNER_TEMP\mt5setup.exe"
          $installPath = 'C:\Program Files\MetaTrader 5'
          $report = "$env:GITHUB_WORKSPACE\build-output\environment-diagnostics.txt"

          New-Item -ItemType Directory -Path $installPath -Force |
            Out-Null

          Write-Host "Installer: $installer"
          Write-Host "Requested installation path: $installPath"
          Write-Host "Installer size: $((Get-Item $installer).Length) bytes"

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList @('/auto', "/path:$installPath") `
            -Wait `
            -PassThru

          Write-Host "Installer exit code: $($process.ExitCode)"

          Start-Sleep -Seconds 10

          $searchPaths = @(
            $installPath,
            'C:\Program Files\MetaTrader 5',
            'C:\Program Files (x86)\MetaTrader 5',
            "$env:APPDATA\MetaQuotes\Terminal"
          )

          $editor = $null

          foreach ($path in $searchPaths) {
            if (Test-Path $path -PathType Container) {
              Write-Host "Checking: $path"

              $editor = Get-ChildItem `
                -Path $path `
                -Filter 'MetaEditor64.exe' `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($editor) {
                break
              }
            }
          }

          if (!$editor) {
            @(
              "Installer exit code: $($process.ExitCode)"
              "Requested path: $installPath"
              "Installer size: $((Get-Item $installer).Length)"
              "MetaEditor64.exe found: False"
              "PowerShell version: $($PSVersionTable.PSVersion)"
            ) | Set-Content $report

            Write-Host 'MetaEditor was not found.'
            Write-Host 'Installation diagnostics:'
            Get-ChildItem `
              -Path 'C:\Program Files','C:\Program Files (x86)' `
              -Directory `
              -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName |
              Write-Host

            throw 'MetaEditor installation or discovery failed.'
          }

          $root = $editor.DirectoryName

          "METAEDITOR_PATH=$($editor.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "MT5_ROOT=$root" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          @(
            "Installer exit code: $($process.ExitCode)"
            "MetaEditor: $($editor.FullName)"
            "MetaTrader root: $root"
            "Trade.mqh exists: $(Test-Path "$root\MQL5\Include\Trade\Trade.mqh")"
          ) | Set-Content $report

          Write-Host "MetaEditor found: $($editor.FullName)"
          Write-Host "MetaTrader root: $root"

      - name: Find and prepare standard library
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $root = $env:MT5_ROOT
          $targetInclude = "$root\MQL5\Include"
          $targetTrade = "$targetInclude\Trade\Trade.mqh"
          $report = "$env:GITHUB_WORKSPACE\build-output\environment-diagnostics.txt"

          $searchRoots = @(
            "$root\MQL5",
            "$env:APPDATA\MetaQuotes\Terminal",
            "$env:LOCALAPPDATA\MetaQuotes\Terminal"
          ) | Where-Object {
            $_ -and (Test-Path $_ -PathType Container)
          } | Select-Object -Unique

          Add-Content $report ''
          Add-Content $report '--- Standard library search ---'

          Write-Host "Expected library: $targetTrade"

          if (!(Test-Path $targetTrade -PathType Leaf)) {
            $sourceInclude = $null

            foreach ($searchRoot in $searchRoots) {
              Write-Host "Searching: $searchRoot"
              Add-Content $report "Searching: $searchRoot"

              $found = Get-ChildItem `
                -Path $searchRoot `
                -Filter 'Trade.mqh' `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue

              foreach ($item in $found) {
                Add-Content $report "Found candidate: $($item.FullName)"

                $candidate = Split-Path `
                  (Split-Path $item.FullName -Parent) -Parent

                if (
                  (Split-Path $candidate -Leaf) -eq 'Include' -and
                  (Test-Path "$candidate\Trade\Trade.mqh" -PathType Leaf)
                ) {
                  $sourceInclude = $candidate
                  break
                }
              }

              if ($sourceInclude) {
                break
              }
            }

            if (!$sourceInclude) {
              Add-Content $report 'RESULT: Standard library not found.'
              throw 'Trade.mqh was not found. See environment-diagnostics.txt in the build artifact.'
            }

            Write-Host "Library source: $sourceInclude"

            New-Item `
              -ItemType Directory `
              -Path $targetInclude `
              -Force | Out-Null

            Copy-Item `
              -Path "$sourceInclude\*" `
              -Destination $targetInclude `
              -Recurse `
              -Force
          }

          if (!(Test-Path $targetTrade -PathType Leaf)) {
            Add-Content $report 'RESULT: Trade.mqh remains missing.'
            throw "Trade.mqh is missing: $targetTrade"
          }

          Add-Content $report "RESULT: Trade.mqh found at $targetTrade"
          Add-Content $report "File size: $((Get-Item $targetTrade).Length)"

          Write-Host 'Standard library check passed.'

      - name: Compile V4
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = "$env:GITHUB_WORKSPACE\GoldHunterAI_V4.mq5"
          $experts = "$env:MT5_ROOT\MQL5\Experts"
          $expertSource = "$experts\GoldHunterAI_V4.mq5"
          $log = "$env:RUNNER_TEMP\GoldHunterAI_V4_compile.log"
          $out = "$env:GITHUB_WORKSPACE\build-output"

          New-Item -ItemType Directory -Path $experts -Force |
            Out-Null

          Copy-Item $source $expertSource -Force

          Write-Host "Compile source: $expertSource"
          Write-Host "Line 8: $((Get-Content $expertSource)[7])"
          Write-Host "SHA256: $((Get-FileHash $expertSource -Algorithm SHA256).Hash)"

          $ex5 = "$experts\GoldHunterAI_V4.ex5"

          if (Test-Path $ex5) {
            Remove-Item $ex5 -Force
          }

          if (Test-Path $log) {
            Remove-Item $log -Force
          }

          $arguments = "/compile:`"$expertSource`" /log:`"$log`""

          $process = Start-Process `
            -FilePath $env:METAEDITOR_PATH `
            -ArgumentList $arguments `
            -Wait `
            -PassThru

          if (!(Test-Path $log -PathType Leaf)) {
            throw "Compiler log was not produced. Exit code: $($process.ExitCode)"
          }

          $text = Get-Content $log -Raw
          Write-Host $text

          Copy-Item `
            $log `
            "$out\GoldHunterAI_V4_compile.log" `
            -Force

          $errors = [regex]::Match(
            $text,
            '(?im)\b(\d+)\s+errors?\b'
          )

          if (!$errors.Success) {
            throw 'Could not determine compiler error count.'
          }

          if ([int]$errors.Groups[1].Value -gt 0) {
            throw "Compilation failed with $($errors.Groups[1].Value) error(s)."
          }

          if (!(Test-Path $ex5 -PathType Leaf)) {
            throw 'Compiler did not produce GoldHunterAI_V4.ex5.'
          }

          if ((Get-Item $ex5).Length -eq 0) {
            throw 'The generated EX5 file is empty.'
          }

          Copy-Item $ex5 "$out\GoldHunterAI_V4.ex5" -Force

          Write-Host 'Compilation passed and EX5 was produced.'

      - name: Upload diagnostic report and build results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GOLD-HUNTER-AI-V4-Build-Results
          path: build-output/
          if-no-files-found: warn
          retention-days: 14
