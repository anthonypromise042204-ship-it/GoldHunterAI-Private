name: GOLD HUNTER AI V4 Compiler

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Compile GoldHunterAI V4
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate EA source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter 'GoldHunterAI_V4.mq5' `
            -File `
            -Recurse |
            Select-Object -First 1

          if (-not $source) {
            throw 'GoldHunterAI_V4.mq5 was not found in the repository.'
          }

          "EA_SOURCE=$($source.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "EA source: $($source.FullName)"

      - name: Locate or install MetaEditor
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $editor = @(
            'C:\MT5\metaeditor64.exe',
            'C:\Program Files\MetaTrader 5\metaeditor64.exe',
            'C:\Program Files\MetaTrader 5\MetaEditor64.exe'
          ) | Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $editor) {
            $editor = Get-ChildItem `
              -Path 'C:\' `
              -Filter 'metaeditor64.exe' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName -First 1
          }

          if (-not $editor) {
            throw 'MetaEditor was not found. Install MetaTrader 5 before compiling.'
          }

          $editorDir = Split-Path $editor -Parent

          "METAEDITOR=$editor" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          "MT5_INSTALL=$editorDir" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "MetaEditor: $editor"
          Write-Host "Installation directory: $editorDir"

      - name: Prepare terminal data directory and MQL5 includes
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $terminalRoot = Join-Path $env:APPDATA 'MetaQuotes\Terminal'
          New-Item -ItemType Directory -Force -Path $terminalRoot | Out-Null

          # First use existing terminal data directories, if available.
          $terminalDirs = @(
            Get-ChildItem -Path $terminalRoot -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match '^[A-Fa-f0-9]{32}$' }
          )

          # A fresh runner may not have initialized a terminal yet.
          # Create a valid 32-character terminal directory rather than failing.
          if ($terminalDirs.Count -eq 0) {
            $fallbackHash = 'A1B2C3D4E5F60718293A4B5C6D7E8F90'
            $fallbackPath = Join-Path $terminalRoot $fallbackHash
            New-Item -ItemType Directory -Force -Path $fallbackPath | Out-Null
            $terminalDirs = @(Get-Item $fallbackPath)
            Write-Host "Created fallback terminal data directory: $fallbackPath"
          }

          # Ensure the standard include directory also exists beside MetaEditor.
          $installInclude = Join-Path $env:MT5_INSTALL 'MQL5\Include'
          New-Item -ItemType Directory -Force -Path $installInclude | Out-Null

          $includeRepo = Join-Path $env:RUNNER_TEMP 'mt5-library'

          if (-not (Test-Path $includeRepo)) {
            git clone --depth 1 https://github.com/vmlellis/mt5-docker.git $includeRepo
            if ($LASTEXITCODE -ne 0) {
              throw 'Could not download the MQL5 include library.'
            }
          }

          $tradeFiles = Get-ChildItem `
            -Path $includeRepo `
            -Filter 'Trade.mqh' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue

          if (-not $tradeFiles) {
            throw 'Trade.mqh was not found in the downloaded include library.'
          }

          $libraryInclude = $tradeFiles[0].Directory.Parent.FullName
          Write-Host "Detected include source: $libraryInclude"

          # Copy the downloaded standard library when its Include folder is available.
          $includeFolder = Get-ChildItem `
            -Path $includeRepo `
            -Directory `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -eq 'Include' } |
            Select-Object -First 1

          if ($includeFolder) {
            Copy-Item `
              -Path (Join-Path $includeFolder.FullName '*') `
              -Destination $installInclude `
              -Recurse -Force
          }
          else {
            # Copy the Trade folder into a standard Include directory.
            $tradeFolder = Get-ChildItem `
              -Path $includeRepo `
              -Directory `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -eq 'Trade' } |
              Select-Object -First 1

            if (-not $tradeFolder) {
              throw 'Neither an Include folder nor a Trade folder was found.'
            }

            Copy-Item -Path $tradeFolder.FullName `
              -Destination $installInclude `
              -Recurse -Force
          }

          # Install Include files into every terminal-specific data directory.
          foreach ($terminalDir in $terminalDirs) {
            $destination = Join-Path $terminalDir.FullName 'MQL5\Include'
            New-Item -ItemType Directory -Force -Path $destination | Out-Null

            if (Test-Path $installInclude) {
              Copy-Item `
                -Path (Join-Path $installInclude '*') `
                -Destination $destination `
                -Recurse -Force
            }

            Write-Host "Prepared include directory: $destination"
          }

          $tradeInclude = Join-Path $installInclude 'Trade\Trade.mqh'
          if (-not (Test-Path $tradeInclude)) {
            throw "Required include file is missing: $tradeInclude"
          }

          "TERMINAL_DATA_ROOT=$terminalRoot" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          "INCLUDE_PATH=$installInclude" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host 'Include preparation completed.'

      - name: Prepare EA for compilation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $expertsDir = Join-Path $env:MT5_INSTALL 'MQL5\Experts'
          New-Item -ItemType Directory -Force -Path $expertsDir | Out-Null

          $destination = Join-Path $expertsDir 'GoldHunterAI_V4.mq5'
          Copy-Item -Path $env:EA_SOURCE -Destination $destination -Force

          "EA_COMPILE_PATH=$destination" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Compilation source: $destination"

      - name: Compile EA
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $log = Join-Path $env:GITHUB_WORKSPACE 'compile.log'
          $compiled = [System.IO.Path]::ChangeExtension(
            $env:EA_COMPILE_PATH, '.ex5'
          )

          Remove-Item $log -Force -ErrorAction SilentlyContinue
          Remove-Item $compiled -Force -ErrorAction SilentlyContinue

          $arguments = @(
            "/compile:$($env:EA_COMPILE_PATH)"
            "/log:$log"
          )

          Write-Host "Running: $env:METAEDITOR"
          Write-Host "Source: $env:EA_COMPILE_PATH"

          $process = Start-Process `
            -FilePath $env:METAEDITOR `
            -ArgumentList $arguments `
            -Wait `
            -PassThru

          Write-Host "MetaEditor exit code: $($process.ExitCode)"

          if (Test-Path $log) {
            Get-Content $log
          }
          else {
            Write-Warning 'MetaEditor did not create compile.log.'
          }

          if (-not (Test-Path $log)) {
            throw 'Compilation log is missing.'
          }

          $logText = Get-Content $log -Raw

          if ($logText -match '(?i)\b[1-9]\d*\s+errors?\b') {
            throw 'MetaEditor reported compilation errors. See compile.log.'
          }

          if (-not (Test-Path $compiled)) {
            throw 'The EX5 output was not created. See compile.log for details.'
          }

          if ($logText -notmatch '(?i)0\s+errors?') {
            Write-Warning 'An EX5 file exists, but the log did not explicitly confirm zero errors.'
          }

          Write-Host "Compiled output: $compiled"

      - name: Upload compile results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GoldHunterAI-V4-compile-results
          path: |
            compile.log
            **/GoldHunterAI_V4.ex5
          if-no-files-found: warn
