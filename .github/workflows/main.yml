name: GOLD HUNTER AI Compiler

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 25

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify EA source
        run: |
          $ErrorActionPreference = "Stop"

          $source = Join-Path $env:GITHUB_WORKSPACE "GoldHunterAI_V3_4.mq5"

          if (!(Test-Path $source -PathType Leaf)) {
            throw "GoldHunterAI_V3_4.mq5 was not found in the repository root."
          }

          if ((Get-Item $source).Length -eq 0) {
            throw "The EA source file is empty."
          }

          "EA_SOURCE=$source" >> $env:GITHUB_ENV

          Write-Host "EA source verified: $source"
          Write-Host "Source size: $((Get-Item $source).Length) bytes"

      - name: Download MetaTrader 5 installer
        run: |
          $ErrorActionPreference = "Stop"

          $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"

          $url = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer `
            -TimeoutSec 180

          if (!(Test-Path $installer -PathType Leaf)) {
            throw "MetaTrader installer download failed."
          }

          if ((Get-Item $installer).Length -lt 100000) {
            throw "The downloaded installer is unexpectedly small."
          }

          "MT5_INSTALLER=$installer" >> $env:GITHUB_ENV

          Write-Host "MetaTrader installer downloaded successfully."

      - name: Install MetaTrader 5
        run: |
          $ErrorActionPreference = "Stop"

          $installDir = Join-Path $env:RUNNER_TEMP "MT5"

          New-Item `
            -ItemType Directory `
            -Path $installDir `
            -Force | Out-Null

          $process = Start-Process `
            -FilePath $env:MT5_INSTALLER `
            -ArgumentList @("/auto", "/path:$installDir") `
            -Wait `
            -PassThru

          Write-Host "Installer exit code: $($process.ExitCode)"

          $editor = Get-ChildItem `
            -Path $installDir `
            -Filter "metaeditor64.exe" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          $terminal = Get-ChildItem `
            -Path $installDir `
            -Filter "terminal64.exe" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (!$editor) {
            throw "MetaEditor64.exe was not found after installation."
          }

          if (!$terminal) {
            throw "terminal64.exe was not found after installation."
          }

          "METAEDITOR_PATH=$($editor.FullName)" >> $env:GITHUB_ENV
          "TERMINAL_PATH=$($terminal.FullName)" >> $env:GITHUB_ENV
          "MT5_INSTALL_DIR=$installDir" >> $env:GITHUB_ENV

          Write-Host "MetaEditor: $($editor.FullName)"
          Write-Host "Terminal: $($terminal.FullName)"

      - name: Initialize MetaTrader and locate standard library
        run: |
          $ErrorActionPreference = "Stop"

          $terminal = $env:TERMINAL_PATH
          $installDir = $env:MT5_INSTALL_DIR

          if (!(Test-Path $terminal -PathType Leaf)) {
            throw "The MetaTrader terminal executable is missing."
          }

          Write-Host "Starting MetaTrader in portable mode."

          $terminalProcess = Start-Process `
            -FilePath $terminal `
            -ArgumentList "/portable" `
            -WorkingDirectory $installDir `
            -PassThru

          Start-Sleep -Seconds 15

          $searchRoots = @(
            $installDir,
            (Join-Path $env:APPDATA "MetaQuotes\Terminal"),
            (Join-Path $env:LOCALAPPDATA "Programs"),
            (Join-Path $env:APPDATA "MetaQuotes")
          ) | Where-Object {
            $_ -and (Test-Path $_ -PathType Container)
          } | Select-Object -Unique

          $tradeLibrary = $null

          foreach ($root in $searchRoots) {
            Write-Host "Searching: $root"

            $found = Get-ChildItem `
              -Path $root `
              -Filter "Trade.mqh" `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.FullName -match '[\\/]MQL5[\\/]Include[\\/]Trade[\\/]Trade\.mqh$'
              } |
              Select-Object -First 1

            if ($found) {
              $tradeLibrary = $found
              break
            }
          }

          if (!$tradeLibrary) {
            if (!$terminalProcess.HasExited) {
              Stop-Process `
                -Id $terminalProcess.Id `
                -Force `
                -ErrorAction SilentlyContinue
            }

            throw "Trade.mqh was not found. The workflow cannot safely compile the EA without the standard MQL5 trading library."
          }

          $tradeDir = Split-Path $tradeLibrary.FullName -Parent
          $includeDir = Split-Path $tradeDir -Parent
          $mql5Dir = Split-Path $includeDir -Parent
          $expertsDir = Join-Path $mql5Dir "Experts"

          if (!(Test-Path (Join-Path $includeDir "Trade\Trade.mqh") -PathType Leaf)) {
            throw "The discovered trading library path failed validation."
          }

          New-Item `
            -ItemType Directory `
            -Path $expertsDir `
            -Force | Out-Null

          $compileSource = Join-Path $expertsDir "GoldHunterAI_V3_4.mq5"
          $compileLog = Join-Path $env:RUNNER_TEMP "GoldHunterAI_compile.log"

          Copy-Item `
            -Path $env:EA_SOURCE `
            -Destination $compileSource `
            -Force

          if (!(Test-Path $compileSource -PathType Leaf)) {
            throw "Failed to copy the EA source into the Experts directory."
          }

          "MQL5_DIR=$mql5Dir" >> $env:GITHUB_ENV
          "EXPERT_DIR=$expertsDir" >> $env:GITHUB_ENV
          "COMPILE_SOURCE=$compileSource" >> $env:GITHUB_ENV
          "COMPILE_LOG=$compileLog" >> $env:GITHUB_ENV

          Write-Host "Trading library: $($tradeLibrary.FullName)"
          Write-Host "MQL5 directory: $mql5Dir"
          Write-Host "Experts directory: $expertsDir"
          Write-Host "EA source: $compileSource"

          if (!$terminalProcess.HasExited) {
            Stop-Process `
              -Id $terminalProcess.Id `
              -Force `
              -ErrorAction SilentlyContinue
          }

      - name: Compile GOLD HUNTER AI
        run: |
          $ErrorActionPreference = "Stop"

          $editor = $env:METAEDITOR_PATH
          $source = $env:COMPILE_SOURCE
          $log = $env:COMPILE_LOG
          $expertsDir = $env:EXPERT_DIR

          if (!(Test-Path $editor -PathType Leaf)) {
            throw "MetaEditor executable is missing."
          }

          if (!(Test-Path $source -PathType Leaf)) {
            throw "EA source is missing."
          }

          $tradeInclude = Join-Path `
            $env:MQL5_DIR `
            "Include\Trade\Trade.mqh"

          if (!(Test-Path $tradeInclude -PathType Leaf)) {
            throw "Trade.mqh is missing from the discovered MQL5 directory."
          }

          $ex5 = Join-Path $expertsDir "GoldHunterAI_V3_4.ex5"

          Remove-Item $log -Force -ErrorAction SilentlyContinue
          Remove-Item $ex5 -Force -ErrorAction SilentlyContinue

          Write-Host "Starting MetaEditor compilation."
          Write-Host "Source: $source"
          Write-Host "Library: $tradeInclude"

          $arguments = "/compile:`"$source`" /log:`"$log`""

          $process = Start-Process `
            -FilePath $editor `
            -ArgumentList $arguments `
            -Wait `
            -PassThru

          Write-Host "MetaEditor exit code: $($process.ExitCode)"

          Start-Sleep -Seconds 3

          if (!(Test-Path $log -PathType Leaf)) {
            throw "MetaEditor did not create a compiler log."
          }

          $logText = Get-Content $log -Raw

          Write-Host "========== COMPILER LOG =========="
          Write-Host $logText
          Write-Host "=================================="

          if ($logText -match '(?i)Result:\s*[1-9]\d*\s+errors?') {
            throw "Compilation failed. Review the compiler log."
          }

          if ($logText -match '(?i)\b[1-9]\d*\s+errors?\b') {
            throw "Compiler reported one or more errors."
          }

          if ($logText -notmatch '(?i)Result:\s*0\s+errors?') {
            throw "The compiler log does not explicitly confirm zero errors."
          }

          if (!(Test-Path $ex5 -PathType Leaf)) {
            throw "The compiler did not produce GoldHunterAI_V3_4.ex5."
          }

          if ((Get-Item $ex5).Length -eq 0) {
            throw "The generated EX5 file is empty."
          }

          Write-Host "COMPILATION SUCCESSFUL"
          Write-Host "EX5: $ex5"
          Write-Host "EX5 size: $((Get-Item $ex5).Length) bytes"

      - name: Collect build logs and EA
        if: always()
        run: |
          $ErrorActionPreference = "Continue"

          $outputDir = Join-Path $env:RUNNER_TEMP "build-output"

          New-Item `
            -ItemType Directory `
            -Path $outputDir `
            -Force | Out-Null

          if ($env:COMPILE_LOG -and
              (Test-Path $env:COMPILE_LOG -PathType Leaf)) {

            Copy-Item `
              $env:COMPILE_LOG `
              (Join-Path $outputDir "GoldHunterAI_compile.log") `
              -Force
          }

          if ($env:EXPERT_DIR) {
            $ex5 = Join-Path $env:EXPERT_DIR "GoldHunterAI_V3_4.ex5"

            if (Test-Path $ex5 -PathType Leaf) {
              Copy-Item `
                $ex5 `
                (Join-Path $outputDir "GoldHunterAI_V3_4.ex5") `
                -Force
            }
          }

          if (!(Get-ChildItem $outputDir -File -ErrorAction SilentlyContinue)) {
            "No compiler output was produced. Review the failed workflow step." |
              Set-Content (Join-Path $outputDir "build-status.txt")
          }

          Write-Host "Build output: $outputDir"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GOLD-HUNTER-AI-V3-4-Build
          path: ${{ runner.temp }}\build-output\*
          if-no-files-found: warn
          retention-days: 14
