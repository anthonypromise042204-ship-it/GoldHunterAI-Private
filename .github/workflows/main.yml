name: GOLD HUNTER AI V4 Compiler

on:
  push:
    branches: [main, master]
    paths:
      - '**.mq5'
      - '**.mqh'
      - '.github/workflows/main.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Compile GoldHunterAI V4
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate EA source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $ea = Get-ChildItem $env:GITHUB_WORKSPACE `
            -Filter 'GoldHunterAI_V4.mq5' -File -Recurse |
            Where-Object { $_.FullName -notmatch '\\\.git\\' } |
            Select-Object -First 1

          if (-not $ea) {
            throw 'GoldHunterAI_V4.mq5 was not found in the repository.'
          }

          "EA_SOURCE=$($ea.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "EA source: $($ea.FullName)"

      - name: Install or locate MetaEditor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $editor = $null

          foreach ($root in @(
            'C:\MT5',
            'C:\Program Files\MetaTrader 5',
            'C:\Program Files (x86)\MetaTrader 5'
          )) {
            foreach ($name in @('metaeditor64.exe', 'metaeditor.exe')) {
              $candidate = Join-Path $root $name
              if (Test-Path $candidate) {
                $editor = $candidate
                break
              }
            }
            if ($editor) { break }
          }

          if (-not $editor) {
            $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

            Invoke-WebRequest `
              'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
              -OutFile $installer

            $proc = Start-Process `
              -FilePath $installer `
              -ArgumentList @('/auto', '/path:C:\MT5') `
              -Wait -PassThru

            Write-Host "Installer exit code: $($proc.ExitCode)"

            foreach ($name in @('metaeditor64.exe', 'metaeditor.exe')) {
              $candidate = Join-Path 'C:\MT5' $name
              if (Test-Path $candidate) {
                $editor = $candidate
                break
              }
            }
          }

          if (-not $editor) {
            throw 'MetaEditor could not be located or installed.'
          }

          "METAEDITOR_PATH=$editor" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "MT5_ROOT=$(Split-Path $editor -Parent)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "MetaEditor: $editor"

      - name: Prepare terminal and Standard Library
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $terminalRoot = Join-Path `
            $env:APPDATA `
            'MetaQuotes\Terminal'

          New-Item -ItemType Directory `
            -Path $terminalRoot -Force | Out-Null

          # Find the terminal data directory used by this runner.
          $terminal = Get-ChildItem $terminalRoot -Directory |
            Where-Object {
              Test-Path (Join-Path $_.FullName 'MQL5')
            } |
            Select-Object -First 1

          if (-not $terminal) {
            $terminal = Get-ChildItem $terminalRoot -Directory |
              Select-Object -First 1
          }

          if (-not $terminal) {
            throw 'No MetaTrader terminal data directory was found.'
          }

          $dataMql5 = Join-Path $terminal.FullName 'MQL5'
          $include = Join-Path $dataMql5 'Include'
          $experts = Join-Path $dataMql5 'Experts'

          New-Item -ItemType Directory -Path $include -Force |
            Out-Null
          New-Item -ItemType Directory -Path $experts -Force |
            Out-Null

          # Obtain the fallback include tree.
          $mirror = Join-Path $env:RUNNER_TEMP 'mt5-docker'

          git clone --depth 1 `
            https://github.com/vmlellis/mt5-docker.git `
            $mirror

          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to download the fallback include library.'
          }

          $trade = Get-ChildItem $mirror `
            -Filter 'Trade.mqh' -File -Recurse |
            Select-Object -First 1

          if (-not $trade) {
            throw 'Trade.mqh was not found in the downloaded library.'
          }

          $sourceInclude = $trade.Directory.Parent.FullName

          if (-not (Test-Path (Join-Path $sourceInclude 'Object.mqh'))) {
            throw 'The downloaded Include tree is incomplete.'
          }

          Copy-Item `
            -Path (Join-Path $sourceInclude '*') `
            -Destination $include `
            -Recurse -Force

          $installedTrade = Join-Path $include 'Trade\Trade.mqh'

          if (-not (Test-Path $installedTrade)) {
            throw "Trade.mqh installation failed: $installedTrade"
          }

          # Copy the EA and its sibling MQL source files.
          Copy-Item -LiteralPath $env:EA_SOURCE `
            -Destination (Join-Path $experts 'GoldHunterAI_V4.mq5') `
            -Force

          $sourceDir = Split-Path $env:EA_SOURCE -Parent

          Get-ChildItem $sourceDir -File |
            Where-Object { $_.Extension -in '.mqh', '.mq5' } |
            ForEach-Object {
              Copy-Item $_.FullName -Destination $experts -Force
            }

          "EA_COMPILE_SOURCE=$(Join-Path $experts 'GoldHunterAI_V4.mq5')" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "MT5_DATA_ROOT=$($terminal.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Terminal data directory: $($terminal.FullName)"
          Write-Host "Include folder: $include"
          Write-Host "Trade header: $installedTrade"
          Write-Host "EA compile path: $(Join-Path $experts 'GoldHunterAI_V4.mq5')"

      - name: Compile GoldHunterAI V4
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = $env:EA_COMPILE_SOURCE
          $log = Join-Path $env:GITHUB_WORKSPACE 'compile.log'

          if (-not (Test-Path $source)) {
            throw "EA file is missing: $source"
          }

          if (-not (Test-Path (Join-Path $env:MT5_DATA_ROOT 'MQL5\Include\Trade\Trade.mqh'))) {
            throw 'Trade.mqh is missing from the terminal data Include folder.'
          }

          $proc = Start-Process `
            -FilePath $env:METAEDITOR_PATH `
            -ArgumentList @("/compile:$source", "/log:$log") `
            -Wait -PassThru

          Write-Host "MetaEditor exit code: $($proc.ExitCode)"

          Start-Sleep -Seconds 2

          if (Test-Path $log) {
            Get-Content $log
          } else {
            throw 'MetaEditor did not create compile.log.'
          }

          $output = [System.IO.Path]::ChangeExtension($source, '.ex5')

          if (Select-String -Path $log -Pattern '\berrors?\s*:\s*[1-9]\b' -Quiet) {
            throw 'Compiler log reports errors.'
          }

          if (-not (Test-Path $output)) {
            throw 'No EX5 output was created.'
          }

          Write-Host "Compilation output: $output"

      - name: Upload compiler results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GoldHunterAI-V4-compile-results
          if-no-files-found: warn
          path: |
            compile.log
            C:/MT5/MQL5/Experts/GoldHunterAI_V4.ex5
            C:/Users/runneradmin/AppData/Roaming/MetaQuotes/Terminal/**/MQL5/Experts/GoldHunterAI_V4.ex5
