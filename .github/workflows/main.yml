name: GOLD HUNTER AI V4 Compiler

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Compile GoldHunterAI V4
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and install official MetaTrader 5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $installDir = 'C:\MT5'
          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          $downloadUrl = 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe'

          New-Item -ItemType Directory -Force -Path $installDir | Out-Null

          Write-Host 'Downloading the official MetaTrader 5 installer...'
          Invoke-WebRequest -Uri $downloadUrl -OutFile $installer -TimeoutSec 180

          if (-not (Test-Path $installer)) {
            throw 'MetaTrader 5 installer download failed.'
          }

          Write-Host 'Starting unattended MetaTrader 5 installation...'
          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList @('/auto', "/path:$installDir") `
            -Wait `
            -PassThru

          Write-Host "Installer exit code: $($process.ExitCode)"

          # Installation may finish successfully even if the bootstrapper
          # returns a nonzero status. Verify the actual compiler below.
          $editorCandidates = @(
            (Join-Path $installDir 'metaeditor64.exe'),
            (Join-Path $installDir 'MetaEditor64.exe'),
            'C:\Program Files\MetaTrader 5\metaeditor64.exe'
          )

          $editor = $editorCandidates |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $editor) {
            $editor = Get-ChildItem `
              -Path $installDir `
              -Filter 'metaeditor64.exe' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName -First 1
          }

          if (-not $editor) {
            throw 'MetaTrader installation did not produce metaeditor64.exe. Check installer logs and network access.'
          }

          $actualInstallDir = Split-Path $editor -Parent

          "METAEDITOR=$editor" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "MT5_INSTALL=$actualInstallDir" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "MetaEditor installed at: $editor"
          Write-Host "Platform directory: $actualInstallDir"

      - name: Locate EA source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter 'GoldHunterAI_V4.mq5' `
            -File `
            -Recurse |
            Select-Object -First 1

          if (-not $source) {
            throw 'GoldHunterAI_V4.mq5 was not found in the repository.'
          }

          "EA_SOURCE=$($source.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "EA source: $($source.FullName)"

      - name: Prepare portable MQL5 workspace
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $mqlRoot = Join-Path $env:MT5_INSTALL 'MQL5'
          $expertsDir = Join-Path $mqlRoot 'Experts'
          $includeDir = Join-Path $mqlRoot 'Include'

          New-Item -ItemType Directory -Force -Path $expertsDir | Out-Null
          New-Item -ItemType Directory -Force -Path $includeDir | Out-Null

          # Copy the EA into the platform's MQL5 tree.
          $eaDestination = Join-Path $expertsDir 'GoldHunterAI_V4.mq5'
          Copy-Item -Path $env:EA_SOURCE -Destination $eaDestination -Force

          # Preserve the repository's own MQL5 source/include files where
          # possible, so custom project dependencies are available.
          $repoFiles = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -File `
            -Recurse

          foreach ($file in $repoFiles) {
            $relative = $file.FullName.Substring(
              $env:GITHUB_WORKSPACE.TrimEnd('\').Length
            ).TrimStart('\')

            if ($relative -match '^(Include|Libraries)\\') {
              $destination = Join-Path $mqlRoot $relative
              $parent = Split-Path $destination -Parent
              New-Item -ItemType Directory -Force -Path $parent | Out-Null
              Copy-Item -Path $file.FullName -Destination $destination -Force
            }
          }

          # Confirm the official installation's standard Trade library exists.
          $tradeInclude = Join-Path $includeDir 'Trade\Trade.mqh'

          if (-not (Test-Path $tradeInclude)) {
            Write-Host 'Trade.mqh is not yet present in the installation tree.'
            Write-Host 'Checking MetaTrader terminal data directories...'

            $terminalRoot = Join-Path $env:APPDATA 'MetaQuotes\Terminal'

            if (Test-Path $terminalRoot) {
              $found = Get-ChildItem `
                -Path $terminalRoot `
                -Filter 'Trade.mqh' `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($found) {
                Copy-Item -Path $found.FullName -Destination $tradeInclude -Force
                Write-Host "Copied standard library from $($found.FullName)"
              }
            }
          }

          if (-not (Test-Path $tradeInclude)) {
            throw 'Trade.mqh is missing. The standard MQL5 library was not installed.'
          }

          "EA_COMPILE_PATH=$eaDestination" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "EA ready: $eaDestination"
          Write-Host "Standard library: $tradeInclude"

      - name: Compile GoldHunterAI V4
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $log = Join-Path $env:GITHUB_WORKSPACE 'compile.log'
          $compiled = [System.IO.Path]::ChangeExtension(
            $env:EA_COMPILE_PATH, '.ex5'
          )

          Remove-Item $log -Force -ErrorAction SilentlyContinue
          Remove-Item $compiled -Force -ErrorAction SilentlyContinue

          Write-Host "MetaEditor: $env:METAEDITOR"
          Write-Host "Source: $env:EA_COMPILE_PATH"

          $arguments = @(
            '/portable'
            "/compile:$($env:EA_COMPILE_PATH)"
            "/log:$log"
          )

          $process = Start-Process `
            -FilePath $env:METAEDITOR `
            -ArgumentList $arguments `
            -WorkingDirectory $env:MT5_INSTALL `
            -Wait `
            -PassThru

          Write-Host "MetaEditor exit code: $($process.ExitCode)"

          if (Test-Path $log) {
            Get-Content $log
          }
          else {
            throw 'MetaEditor did not produce compile.log.'
          }

          $logText = Get-Content $log -Raw

          if ($logText -match '(?i)\b[1-9]\d*\s+errors?\b') {
            throw 'Compilation failed. Review compile.log for the source errors.'
          }

          if (-not (Test-Path $compiled)) {
            throw 'The EX5 output was not created. Review compile.log.'
          }

          if ($logText -notmatch '(?i)0\s+errors?') {
            throw 'The compile log does not explicitly confirm zero errors. Review compile.log.'
          }

          Write-Host 'Compilation completed with zero reported errors.'
          Write-Host "EX5 output: $compiled"

      - name: Upload compiler logs and output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GoldHunterAI-V4-compile-results
          path: |
            compile.log
            C:/MT5/MQL5/Experts/GoldHunterAI_V4.ex5
          if-no-files-found: warn
