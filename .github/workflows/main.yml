name: GOLD HUNTER AI V4.11 Compiler

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - goldhunter-v4-safety-upgrade
    paths:
      - 'GoldHunterAI_V4_11.mq5'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  compile:
    name: Compile GoldHunterAI V4.11
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source file
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'GoldHunterAI_V4_11.mq5'
          if (-not (Test-Path $source)) {
            Write-Error "GoldHunterAI_V4_11.mq5 was not found."
            exit 1
          }
          Write-Host "Source file found: $source"
          Get-FileHash $source -Algorithm SHA256

      - name: Download MetaTrader 5 installer
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          $url = 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe'
          Invoke-WebRequest -Uri $url -OutFile $installer
          if ((Get-Item $installer).Length -lt 1000000) {
            throw "The MetaTrader 5 installer download is unexpectedly small."
          }
          $signature = Get-AuthenticodeSignature $installer
          Write-Host "Installer signature status: $($signature.Status)"
          if ($signature.Status -ne 'Valid') {
            throw "The installer signature is not valid."
          }

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          $installDir = 'C:\MT5'
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null
          $process = Start-Process -FilePath $installer -ArgumentList "/auto" -Wait -PassThru
          Write-Host "Installer exit code: $($process.ExitCode)"
          Start-Sleep -Seconds 10

          $editors = @(
            'C:\MT5\MetaEditor64.exe',
            'C:\Program Files\MetaTrader 5\MetaEditor64.exe',
            'C:\Program Files (x86)\MetaTrader 5\MetaEditor64.exe'
          )

          $editorPath = $null
          foreach ($candidate in $editors) {
            if (Test-Path $candidate) {
              $editorPath = $candidate
              break
            }
          }

          if (-not $editorPath) {
            $editor = Get-ChildItem 'C:\Program Files','C:\Program Files (x86)','C:\MT5' `
              -Filter 'MetaEditor64.exe' -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($editor) {
              $editorPath = $editor.FullName
            }
          }

          if (-not $editorPath) {
            throw "MetaEditor64.exe was not found after installation."
          }

          "METAEDITOR_PATH=$editorPath" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "MetaEditor found: $editorPath"

      - name: Locate Trade.mqh
        shell: pwsh
        run: |
          $roots = @(
            'C:\MT5',
            'C:\Program Files\MetaTrader 5',
            'C:\Program Files (x86)\MetaTrader 5',
            "$env:APPDATA\MetaQuotes\Terminal"
          )

          $tradeFile = $null
          foreach ($root in $roots) {
            if (Test-Path $root) {
              $match = Get-ChildItem $root -Filter 'Trade.mqh' -Recurse `
                -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($match) {
                $tradeFile = $match.FullName
                break
              }
            }
          }

          if (-not $tradeFile) {
            throw "Trade.mqh was not found. Check the runner's MetaTrader installation."
          }

          $includeDir = Split-Path (Split-Path $tradeFile -Parent) -Parent
          "MT5_INCLUDE=$includeDir" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Trade.mqh found: $tradeFile"
          Write-Host "Include directory: $includeDir"

      - name: Compile GoldHunterAI V4.11
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'GoldHunterAI_V4_11.mq5'
          $outputDir = Join-Path $env:GITHUB_WORKSPACE 'build-output'
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null

          $log = Join-Path $outputDir 'GoldHunterAI_V4_11_compile.log'
          $ex5 = Join-Path $env:GITHUB_WORKSPACE 'GoldHunterAI_V4_11.ex5'

          if (Test-Path $ex5) {
            Remove-Item $ex5 -Force
          }

          $arguments = "/compile:`"$source`" /include:`"$env:MT5_INCLUDE`" /log:`"$log`""
          Write-Host "Running MetaEditor with arguments: $arguments"

          $process = Start-Process -FilePath $env:METAEDITOR_PATH `
            -ArgumentList $arguments -Wait -PassThru
          Write-Host "MetaEditor exit code: $($process.ExitCode)"

          if (Test-Path $log) {
            Get-Content $log
            Copy-Item $log $outputDir -Force -ErrorAction SilentlyContinue
          } else {
            Write-Warning "MetaEditor did not create a compile log at the expected path."
          }

          if (-not (Test-Path $ex5) -or (Get-Item $ex5).Length -eq 0) {
            throw "Compilation did not produce a nonempty GoldHunterAI_V4_11.ex5 file."
          }

          Write-Host "Nonempty EX5 output found."
          Get-Item $ex5 | Select-Object FullName, Length

          Copy-Item $ex5 $outputDir -Force

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GoldHunterAI-V4.11-Build-Results
          path: build-output/
          if-no-files-found: warn
