name: Compile GOLD HUNTER AI

"on":
  push:
    paths:
      - 'GoldHunterAI_V3_4.mq5'
      - '.github/workflows/main.yml'
  workflow_dispatch:

permissions:
contents: read

jobs:
compile:
name: Compile EA with MetaEditor
runs-on: windows-latest
timeout-minutes: 20

steps:
  - name: Download Repository
    uses: actions/checkout@v4

  - name: Verify Source File
    shell: pwsh
    run: |
      $source = "$env:GITHUB_WORKSPACE\GoldHunterAI_V3_4.mq5"

      if (-not (Test-Path $source)) {
        throw "GoldHunterAI_V3_4.mq5 was not found in the repository root."
      }

      Write-Host "Source file found: $source"

  - name: Install MetaTrader 5
    shell: pwsh
    run: |
      $ErrorActionPreference = "Stop"

      $installer = "$env:TEMP\mt5setup.exe"
      $installPath = "C:\MT5"

      New-Item -ItemType Directory -Path $installPath -Force | Out-Null

      Invoke-WebRequest `
        -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" `
        -OutFile $installer

      $process = Start-Process `
        -FilePath $installer `
        -ArgumentList "/auto", "/path:$installPath" `
        -PassThru -Wait

      Write-Host "Installer exit code: $($process.ExitCode)"

      $editor = Get-ChildItem `
        -Path $installPath `
        -Filter "metaeditor64.exe" `
        -Recurse -ErrorAction SilentlyContinue |
        Select-Object -First 1

      if (-not $editor) {
        throw "MetaEditor was not found after installation."
      }

      $terminal = Get-ChildItem `
        -Path $installPath `
        -Filter "terminal64.exe" `
        -Recurse -ErrorAction SilentlyContinue |
        Select-Object -First 1

      if (-not $terminal) {
        throw "MT5 terminal64.exe was not found."
      }

      $platformPath = $terminal.DirectoryName
      $mqlPath = Join-Path $platformPath "MQL5"
      $includePath = Join-Path $mqlPath "Include"

      if (-not (Test-Path "$includePath\Trade\Trade.mqh")) {
        throw "The standard Trade.mqh library is missing."
      }

      "MT5_EDITOR=$($editor.FullName)" |
        Out-File $env:GITHUB_ENV -Append

      "MT5_MQL_PATH=$mqlPath" |
        Out-File $env:GITHUB_ENV -Append

      Write-Host "MetaEditor: $($editor.FullName)"
      Write-Host "MQL5 folder: $mqlPath"
      Write-Host "Standard trading library verified."

  - name: Prepare EA for Compilation
    shell: pwsh
    run: |
      $ErrorActionPreference = "Stop"

      $source = "$env:GITHUB_WORKSPACE\GoldHunterAI_V3_4.mq5"
      $experts = Join-Path $env:MT5_MQL_PATH "Experts"

      New-Item -ItemType Directory -Path $experts -Force | Out-Null

      $destination = Join-Path $experts "GoldHunterAI_V3_4.mq5"

      Copy-Item -Path $source -Destination $destination -Force

      if (-not (Test-Path $destination)) {
        throw "Could not prepare the EA source file."
      }

      Write-Host "Prepared source: $destination"

  - name: Compile GOLD HUNTER AI
    shell: pwsh
    run: |
      $ErrorActionPreference = "Stop"

      $source = Join-Path $env:MT5_MQL_PATH "Experts\GoldHunterAI_V3_4.mq5"
      $output = Join-Path $env:MT5_MQL_PATH "Experts\GoldHunterAI_V3_4.ex5"
      $log = Join-Path $env:GITHUB_WORKSPACE "compile.log"

      Remove-Item $output, $log -Force -ErrorAction SilentlyContinue

      $arguments = @(
        "/compile:$source"
        "/include:$env:MT5_MQL_PATH"
        "/log"
      )

      Write-Host "Starting MetaEditor compiler..."

      $process = Start-Process `
        -FilePath $env:MT5_EDITOR `
        -ArgumentList $arguments `
        -PassThru -Wait

      Write-Host "MetaEditor exit code: $($process.ExitCode)"

      if (Test-Path $log) {
        Get-Content $log -Encoding Unicode |
          ForEach-Object { Write-Host $_ }
      } else {
        Write-Host "Workspace log not found; checking the source directory."

        $sourceLog = Join-Path `
          (Split-Path $source -Parent) `
          "GoldHunterAI_V3_4.log"

        if (Test-Path $sourceLog) {
          Copy-Item $sourceLog $log -Force
          Get-Content $log -Encoding Unicode |
            ForEach-Object { Write-Host $_ }
        }
      }

      $sourceLog = Join-Path `
        (Split-Path $source -Parent) `
        "GoldHunterAI_V3_4.log"

      if (-not (Test-Path $log) -and (Test-Path $sourceLog)) {
        Copy-Item $sourceLog $log -Force
      }

      if (-not (Test-Path $output)) {
        throw "Compilation did not produce GoldHunterAI_V3_4.ex5. Inspect compile.log."
      }

      if (-not (Test-Path $log)) {
        throw "The EX5 file exists, but the compilation log is missing. Verify the compiler result."
      }

      $logText = Get-Content $log -Raw -Encoding Unicode

      if ($logText -match '\d+\s+error[s]?,\s*[1-9]\d*\s+warning[s]?') {
        throw "Compilation reported errors or warnings. Inspect compile.log."
      }

      if ($logText -match '\b[1-9]\d*\s+error[s]?\b') {
        throw "Compilation reported errors. Inspect compile.log."
      }

      if ($logText -notmatch '0\s+error[s]?') {
        Write-Host "Could not confirm a clean compilation from the log."
        Write-Host "Review compile.log before using the EA."
        throw "Compilation success could not be verified."
      }

      Write-Host "SUCCESS: EX5 file exists and the log reports zero errors."

  - name: Collect Build Files
    if: always()
    shell: pwsh
    run: |
      $destination = "$env:GITHUB_WORKSPACE\build-output"

      New-Item -ItemType Directory -Path $destination -Force | Out-Null

      $files = @(
        "$env:GITHUB_WORKSPACE\compile.log",
        "$env:MT5_MQL_PATH\Experts\GoldHunterAI_V3_4.log",
        "$env:MT5_MQL_PATH\Experts\GoldHunterAI_V3_4.ex5"
      )

      foreach ($file in $files) {
        if ($file -and (Test-Path $file)) {
          Copy-Item $file $destination -Force
          Write-Host "Collected: $file"
        }
      }

  - name: Upload Compilation Results
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: GoldHunterAI-Compilation-Results
      path: build-output/*
      if-no-files-found: warn
      retention-days: 7
