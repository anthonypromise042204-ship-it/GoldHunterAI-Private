
name: GOLD HUNTER AI V3.4 Compiler

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - goldhunter-v4-safety-upgrade
    paths:
      - 'GoldHunterAI_V3_4.mq5'
      - '.github/workflows/main.yml'
      - 'Include/**'
      - 'Libraries/**'

permissions:
  contents: read

jobs:
  compile:
    name: Compile GoldHunterAI V3.4
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare build directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $buildDir = Join-Path $env:GITHUB_WORKSPACE 'build-output'
          New-Item -ItemType Directory -Path $buildDir -Force | Out-Null
          "BUILD_OUTPUT=$buildDir" >> $env:GITHUB_ENV

      - name: Verify V3.4 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'GoldHunterAI_V3_4.mq5'

          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
            throw 'GoldHunterAI_V3_4.mq5 was not found.'
          }

          $version = Select-String -LiteralPath $source `
            -Pattern '^\s*#property\s+version\s+"3\.40"\s*$' `
            -ErrorAction SilentlyContinue

          if (-not $version) {
            throw 'Expected source version 3.40 was not found.'
          }

          $hash = Get-FileHash -LiteralPath $source -Algorithm SHA256

          @(
            "Source: $source"
            "SHA256: $($hash.Hash)"
            "Version: 3.40"
          ) | Set-Content (Join-Path $env:BUILD_OUTPUT 'source-diagnostics.txt')

          "EA_SOURCE=$source" >> $env:GITHUB_ENV
          Write-Host "Verified source SHA256: $($hash.Hash)"

      - name: Download MetaTrader 5 installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $installer

          if ((Get-Item -LiteralPath $installer).Length -lt 1MB) {
            throw 'MetaTrader installer is unexpectedly small.'
          }

          $signature = Get-AuthenticodeSignature -FilePath $installer

          if ($signature.Status -ne 'Valid') {
            throw "Installer signature is not valid: $($signature.Status)"
          }

          "MT5_INSTALLER=$installer" >> $env:GITHUB_ENV
          Write-Host "Installer signature: $($signature.Status)"

      - name: Install and locate MetaEditor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installDir = 'C:\MT5'
          New-Item -ItemType Directory -Path $installDir -Force | Out-Null

          $process = Start-Process `
            -FilePath $env:MT5_INSTALLER `
            -ArgumentList @('/auto', "/path:$installDir") `
            -PassThru -Wait

          Write-Host "Installer exit code: $($process.ExitCode)"

          $editor = $null
          foreach ($root in @(
            'C:\MT5',
            'C:\Program Files\MetaTrader 5',
            'C:\Program Files (x86)\MetaTrader 5'
          )) {
            $candidate = Join-Path $root 'MetaEditor64.exe'
            if (Test-Path -LiteralPath $candidate -PathType Leaf) {
              $editor = $candidate
              break
            }
          }

          if (-not $editor) {
            throw 'MetaEditor64.exe was not found.'
          }

          "METAEDITOR_PATH=$editor" >> $env:GITHUB_ENV
          "MT5_ROOT=$(Split-Path -Parent $editor)" >> $env:GITHUB_ENV

          @(
            "MetaEditor: $editor"
            "MetaEditor version: $((Get-Item $editor).VersionInfo.ProductVersion)"
            "Installer exit code: $($process.ExitCode)"
          ) | Set-Content (Join-Path $env:BUILD_OUTPUT 'installation-diagnostics.txt')

      - name: Provision and validate MQL5 Include library
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Pinned third-party mirror; this is not an official MetaQuotes package.
          $commit = 'd913f3880a6120e7f8d276b97e819c3e7d97e95b'
          $zip = Join-Path $env:RUNNER_TEMP 'mql5-include.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'mql5-include-extracted'
          $include = Join-Path $env:RUNNER_TEMP 'mql5-build-root\MQL5\Include'

          $uri = "https://github.com/gsemet/mt5-include/archive/$commit.zip"
          Invoke-WebRequest -Uri $uri -OutFile $zip

          if ((Get-Item -LiteralPath $zip).Length -lt 10000) {
            throw 'The MQL5 Include archive is unexpectedly small.'
          }

          if (Test-Path -LiteralPath $extract) {
            Remove-Item -LiteralPath $extract -Recurse -Force
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force

          $trade = Get-ChildItem -LiteralPath $extract `
            -Filter 'Trade.mqh' -File -Recurse |
            Select-Object -First 1

          if (-not $trade) {
            throw 'Trade.mqh was not found in the downloaded archive.'
          }

          $sourceInclude = $trade.Directory.Parent.FullName

          $required = @(
            'Object.mqh',
            'Trade\Trade.mqh',
            'Trade\PositionInfo.mqh',
            'Trade\SymbolInfo.mqh',
            'Trade\AccountInfo.mqh',
            'Trade\OrderInfo.mqh',
            'Trade\HistoryOrderInfo.mqh',
            'Trade\DealInfo.mqh'
          )

          foreach ($relative in $required) {
            $file = Join-Path $sourceInclude $relative
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Required Include file missing from mirror: $relative"
            }
          }

          $tradeText = Get-Content `
            -LiteralPath (Join-Path $sourceInclude 'Trade\Trade.mqh') -Raw

          if ($tradeText -notmatch 'SetTypeFillingBySymbol') {
            throw 'Mirror compatibility check failed: SetTypeFillingBySymbol missing.'
          }

          New-Item -ItemType Directory -Path $include -Force | Out-Null
          Copy-Item -Path (Join-Path $sourceInclude '*') `
            -Destination $include -Recurse -Force

          "MQL5_INCLUDE=$include" >> $env:GITHUB_ENV
          "MQL5_DATA_ROOT=$(Join-Path $env:RUNNER_TEMP 'mql5-build-root')" >> $env:GITHUB_ENV

          @(
            "Source URL: $uri"
            "Pinned commit: $commit"
            'Source type: Third-party mirror; not official MetaQuotes distribution'
            "Include destination: $include"
            'Required header checks: passed'
            'SetTypeFillingBySymbol check: passed'
          ) | Set-Content (Join-Path $env:BUILD_OUTPUT 'include-diagnostics.txt')

          Write-Host "Validated third-party Include library: $include"

      - name: Prepare compilation environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $expertDir = Join-Path $env:MQL5_DATA_ROOT 'MQL5\Experts'
          New-Item -ItemType Directory -Path $expertDir -Force | Out-Null

          $target = Join-Path $expertDir 'GoldHunterAI_V3_4.mq5'
          $ex5 = Join-Path $expertDir 'GoldHunterAI_V3_4.ex5'

          Copy-Item -LiteralPath $env:EA_SOURCE -Destination $target -Force

          if (Test-Path -LiteralPath $ex5) {
            Remove-Item -LiteralPath $ex5 -Force
          }

          if (-not (Test-Path -LiteralPath (Join-Path $env:MQL5_INCLUDE 'Trade\Trade.mqh'))) {
            throw 'Trade.mqh is missing from the selected Include directory.'
          }

          "EA_TARGET=$target" >> $env:GITHUB_ENV
          "EA_EX5=$ex5" >> $env:GITHUB_ENV

          Write-Host "EA target: $target"
          Write-Host "Include root: $env:MQL5_INCLUDE"

      - name: Compile GoldHunterAI V3.4
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compileLog = Join-Path $env:BUILD_OUTPUT 'GoldHunterAI_V3_4_compile.log'

          $process = Start-Process `
            -FilePath $env:METAEDITOR_PATH `
            -ArgumentList @(
              "/compile:$($env:EA_TARGET)",
              "/log:$compileLog"
            ) `
            -PassThru -Wait

          Start-Sleep -Seconds 2
          Write-Host "MetaEditor exit code: $($process.ExitCode)"

          if (-not (Test-Path -LiteralPath $compileLog -PathType Leaf)) {
            throw 'MetaEditor did not create a compilation log.'
          }

          $logText = Get-Content -LiteralPath $compileLog -Raw
          Get-Content -LiteralPath $compileLog

          $errorsMatch = [regex]::Match($logText, '(?im)\b(\d+)\s+errors?\b')
          if (-not $errorsMatch.Success) {
            throw 'Could not determine compiler error count from the log.'
          }

          $errorCount = [int]$errorsMatch.Groups[1].Value
          if ($errorCount -ne 0) {
            throw "Compilation failed with $errorCount error(s)."
          }

          if (-not (Test-Path -LiteralPath $env:EA_EX5 -PathType Leaf)) {
            throw 'No EX5 file was produced.'
          }

          $ex5Info = Get-Item -LiteralPath $env:EA_EX5
          if ($ex5Info.Length -le 0) {
            throw 'The generated EX5 file is empty.'
          }

          @(
            "Compiler errors: $errorCount"
            "MetaEditor exit code: $($process.ExitCode)"
            "EX5 file: $($ex5Info.FullName)"
            "EX5 size: $($ex5Info.Length) bytes"
          ) | Set-Content (Join-Path $env:BUILD_OUTPUT 'compile-summary.txt')

      - name: Collect build results
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $resultDir = $env:BUILD_OUTPUT

          if (-not (Test-Path -LiteralPath $resultDir)) {
            New-Item -ItemType Directory -Path $resultDir -Force | Out-Null
          }

          if ($env:EA_EX5 -and (Test-Path -LiteralPath $env:EA_EX5 -PathType Leaf)) {
            Copy-Item -LiteralPath $env:EA_EX5 `
              -Destination (Join-Path $resultDir 'GoldHunterAI_V3_4.ex5') -Force
          }

          Get-ChildItem -LiteralPath $resultDir -Force |
            Select-Object Name, Length |
            Format-Table -AutoSize

      - name: Upload build results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GoldHunterAI-V3.4-build-results
          path: build-output/
          if-no-files-found: warn
          retention-days: 14
