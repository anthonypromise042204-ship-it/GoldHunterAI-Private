name: GOLD HUNTER AI V4 Compiler

on:
  workflow_dispatch:
  push:
    paths:
      - 'GoldHunterAI_V4.mq5'
      - '.github/workflows/gold-hunter-v4.yml'

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'GoldHunterAI_V4.mq5'

          if (!(Test-Path $source -PathType Leaf)) {
            throw 'V4 source is missing'
          }

          Write-Host 'V4 source file found.'

      - name: Download MetaTrader installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $installer `
            -TimeoutSec 180

          if (!(Test-Path $installer -PathType Leaf)) {
            throw 'MetaTrader installer download failed'
          }

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

          Start-Process `
            -FilePath $installer `
            -ArgumentList '/auto' `
            -Wait

          $searchRoots = @(
            'C:\Program Files',
            'C:\Program Files (x86)',
            $env:LOCALAPPDATA,
            $env:APPDATA
          ) | Where-Object {
            $_ -and (Test-Path $_)
          } | Select-Object -Unique

          $editor = Get-ChildItem `
            -Path $searchRoots `
            -Filter 'metaeditor64.exe' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (!$editor) {
            throw 'MetaEditor executable not found after installation'
          }

          "METAEDITOR_PATH=$($editor.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "MetaEditor found: $($editor.FullName)"

      - name: Compile V4
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Join-Path $env:GITHUB_WORKSPACE 'GoldHunterAI_V4.mq5'
          $log = Join-Path $env:RUNNER_TEMP 'GoldHunterAI_V4_compile.log'
          $out = Join-Path $env:GITHUB_WORKSPACE 'build-output'

          if (!(Test-Path $source -PathType Leaf)) {
            throw "V4 source file not found"
          }

          if (!(Test-Path $env:METAEDITOR_PATH -PathType Leaf)) {
            throw "MetaEditor executable not found"
          }

          $searchRoots = @(
            'C:\Program Files',
            'C:\Program Files (x86)',
            $env:LOCALAPPDATA,
            $env:APPDATA
          )

          $trade = Get-ChildItem -Path $searchRoots -Filter 'Trade.mqh' -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\MQL5\\Include\\Trade\\Trade\.mqh$' } |
            Select-Object -First 1

          if (!$trade) {
            throw "Trade.mqh library not found"
          }

          $mql5Root = Split-Path (Split-Path (Split-Path $trade.FullName -Parent) -Parent) -Parent
          $experts = Join-Path $mql5Root 'Experts'

          New-Item -ItemType Directory -Path $experts -Force | Out-Null
          New-Item -ItemType Directory -Path $out -Force | Out-Null

          $expertSource = Join-Path $experts 'GoldHunterAI_V4.mq5'
          Copy-Item -Path $source -Destination $expertSource -Force

          $arguments = "/compile:$expertSource /log:$log"

          $process = Start-Process -FilePath $env:METAEDITOR_PATH -ArgumentList $arguments -Wait -PassThru

          if (!(Test-Path $log -PathType Leaf)) {
            throw "Compiler log was not created. Exit code: $($process.ExitCode)"
          }

          $logText = Get-Content $log -Raw
          Write-Host $logText

          $logCopy = Join-Path $out 'GoldHunterAI_V4_compile.log'
          Copy-Item -Path $log -Destination $logCopy -Force

          if ($logText -match '(?im)\b[1-9]\d*\s+errors?\b') {
            throw "Compiler reported errors"
          }

          $ex5 = Join-Path $experts 'GoldHunterAI_V4.ex5'

          if (!(Test-Path $ex5 -PathType Leaf)) {
            throw "Compiled EX5 file was not created"
          }

          $ex5Copy = Join-Path $out 'GoldHunterAI_V4.ex5'
          Copy-Item -Path $ex5 -Destination $ex5Copy -Force

          Write-Host "Compilation output files created."
