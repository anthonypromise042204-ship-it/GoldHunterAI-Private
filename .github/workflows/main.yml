name: GOLD HUNTER AI Compiler

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify EA source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $source = Join-Path $env:GITHUB_WORKSPACE "GoldHunterAI V3_4.mq5"

          if (!(Test-Path $source -PathType Leaf)) {
            throw "EA source file not found: $source"
          }

          if ((Get-Item $source).Length -eq 0) {
            throw "EA source file is empty."
          }

          Write-Host "EA source found: $source"
          Write-Host "Source size: $((Get-Item $source).Length) bytes"

      - name: Download MetaTrader installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"
          $url = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"

          Invoke-WebRequest -Uri $url -OutFile $installer -TimeoutSec 180

          if (!(Test-Path $installer -PathType Leaf)) {
            throw "MetaTrader installer download failed."
          }

          Write-Host "Installer downloaded."

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"

          Start-Process -FilePath $installer -ArgumentList "/auto" -Wait

          $editor = Get-ChildItem -Path "C:\Program Files" -Filter "metaeditor64.exe" -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (!$editor) {
            $editor = Get-ChildItem -Path $env:LOCALAPPDATA -Filter "metaeditor64.exe" -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }

          if (!$editor) {
            throw "MetaEditor was not found. Installation may have failed."
          }

          "METAEDITOR_PATH=$($editor.FullName)" >> $env:GITHUB_ENV
          Write-Host "MetaEditor found: $($editor.FullName)"

      - name: Compile EA
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $source = Join-Path $env:GITHUB_WORKSPACE "GoldHunterAI V3_4.mq5"
          $editor = $env:METAEDITOR_PATH
          $log = Join-Path $env:RUNNER_TEMP "GoldHunterAI_compile.log"

          $outputDir = Join-Path $env:GITHUB_WORKSPACE "build-output"
          New-Item -ItemType Directory -Path $outputDir -Force | Out-Null

          $arguments = "/compile:`"$source`" /log:`"$log`""
          $process = Start-Process -FilePath $editor -ArgumentList $arguments -Wait -PassThru

          Start-Sleep -Seconds 3

          if (Test-Path $log) {
            Get-Content $log
            Copy-Item $log (Join-Path $outputDir "GoldHunterAI_compile.log") -Force
          } else {
            throw "MetaEditor did not produce a compiler log."
          }

          $compiled = Join-Path (Split-Path $source) "GoldHunterAI V3_4.ex5"

          if (Test-Path $compiled -PathType Leaf) {
            Copy-Item $compiled (Join-Path $outputDir "GoldHunterAI V3_4.ex5") -Force
          }

          if ((Get-Content $log -Raw) -match '\b[1-9]\d*\s+errors?\b') {
            throw "Compilation reported errors. Review the compiler log."
          }

          if (!(Test-Path (Join-Path $outputDir "GoldHunterAI V3_4.ex5"))) {
            throw "No compiled EX5 file was produced. Review the compiler log."
          }

          Write-Host "Compilation produced an EX5 file."

      - name: Upload build results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GOLD-HUNTER-AI-Build-Results
          path: build-output/
          if-no-files-found: warn
          retention-days: 14
