name: GOLD HUNTER AI V4 Compiler

on:
  workflow_dispatch:
  push:
    paths:
      - "GoldHunterAI_V4.mq5"
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  compile:
    name: Compile GoldHunterAI V4
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify EA source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'GoldHunterAI_V4.mq5'
          $out = Join-Path $env:GITHUB_WORKSPACE 'build-output'

          New-Item -ItemType Directory -Path $out -Force | Out-Null

          if (!(Test-Path -LiteralPath $source -PathType Leaf)) {
            throw 'GoldHunterAI_V4.mq5 is missing from the repository root.'
          }

          $hash = (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash
          @(
            "Source: $source"
            "SHA256: $hash"
            "Commit: $env:GITHUB_SHA"
          ) | Set-Content (Join-Path $out 'environment-diagnostics.txt')

          Write-Host "Source verified: $source"

      - name: Download MetaTrader 5 installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $installer `
            -TimeoutSec 240

          $signature = Get-AuthenticodeSignature -FilePath $installer

          if ($signature.Status -ne 'Valid') {
            throw "Installer signature validation failed: $($signature.Status)"
          }

          "MT5_INSTALLER=$installer" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install MT5 and locate MetaEditor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installPath = 'C:\MT5'

          New-Item -ItemType Directory -Path $installPath -Force | Out-Null

          $process = Start-Process `
            -FilePath $env:MT5_INSTALLER `
            -ArgumentList @('/auto', "/path:$installPath") `
            -Wait `
            -PassThru

          Write-Host "Installer exit code: $($process.ExitCode)"

          $editor = Join-Path $installPath 'MetaEditor64.exe'
          $terminal = Join-Path $installPath 'terminal64.exe'

          if (!(Test-Path -LiteralPath $editor -PathType Leaf)) {
            throw "MetaEditor was not installed at $editor"
          }

          if (!(Test-Path -LiteralPath $terminal -PathType Leaf)) {
            throw "Terminal was not installed at $terminal"
          }

          "METAEDITOR_PATH=$editor" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          "MT5_ROOT=$installPath" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Prepare MQL5 Standard Library
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $include = Join-Path $env:MT5_ROOT 'MQL5\Include'
          $trade = Join-Path $include 'Trade\Trade.mqh'
          $mirror = Join-Path $env:RUNNER_TEMP 'mt5-library-mirror'

          if (!(Test-Path -LiteralPath $trade -PathType Leaf)) {
            Write-Host 'Trade.mqh is missing. Retrieving MQL5 library files.'

            git clone --depth 1 https://github.com/vmlellis/mt5-docker.git $mirror

            if ($LASTEXITCODE -ne 0) {
              throw 'Unable to retrieve the library repository.'
            }

            $mirrorInclude = Join-Path $mirror 'MetaTrader 5\MQL5\Include'
            $mirrorTrade = Join-Path $mirrorInclude 'Trade\Trade.mqh'

            if (!(Test-Path -LiteralPath $mirrorTrade -PathType Leaf)) {
              Get-ChildItem -Path $mirror -Filter 'Trade.mqh' -File -Recurse -ErrorAction SilentlyContinue |
                Select-Object -First 10 -ExpandProperty FullName

              throw 'Trade.mqh was not found in the downloaded repository.'
            }

            New-Item -ItemType Directory -Path $include -Force | Out-Null

            Copy-Item `
              -Path (Join-Path $mirrorInclude '*') `
              -Destination $include `
              -Recurse `
              -Force
          }

          if (!(Test-Path -LiteralPath $trade -PathType Leaf)) {
            throw 'Trade.mqh remains missing after library preparation.'
          }

          Write-Host "Standard Library ready: $trade"

      - name: Prepare EA source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Join-Path $env:GITHUB_WORKSPACE 'GoldHunterAI_V4.mq5'
          $experts = Join-Path $env:MT5_ROOT 'MQL5\Experts'
          $destination = Join-Path $experts 'GoldHunterAI_V4.mq5'

          New-Item -ItemType Directory -Path $experts -Force | Out-Null
          Copy-Item -LiteralPath $source -Destination $destination -Force

          "EA_SOURCE=$destination" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          "EA_EXPERTS=$experts" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compile GoldHunterAI V4
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $out = Join-Path $env:GITHUB_WORKSPACE 'build-output'
          $source = $env:EA_SOURCE
          $log = Join-Path $out 'GoldHunterAI_V4_compile.log'
          $ex5 = Join-Path $env:EA_EXPERTS 'GoldHunterAI_V4.ex5'

          Remove-Item -LiteralPath $ex5 -Force -ErrorAction SilentlyContinue

          $arguments = "/compile:$source /log:$log"

          $compiler = Start-Process `
            -FilePath $env:METAEDITOR_PATH `
            -ArgumentList $arguments `
            -Wait `
            -PassThru

          Start-Sleep -Seconds 2

          if (!(Test-Path -LiteralPath $log -PathType Leaf)) {
            throw "Compiler log was not created. Exit code: $($compiler.ExitCode)"
          }

          $logText = Get-Content -LiteralPath $log -Raw
          Write-Host $logText

          $errors = [regex]::Match($logText, '(?im)\b(\d+)\s+errors?\b')

          if (!$errors.Success) {
            throw 'Could not verify the compiler error count.'
          }

          if ([int]$errors.Groups[1].Value -gt 0) {
            throw "Compilation failed with $($errors.Groups[1].Value) error(s)."
          }

          if (!(Test-Path -LiteralPath $ex5 -PathType Leaf)) {
            throw 'The EX5 output file was not generated.'
          }

          if ((Get-Item -LiteralPath $ex5).Length -eq 0) {
            throw 'The generated EX5 file is empty.'
          }

          Copy-Item `
            -LiteralPath $ex5 `
            -Destination (Join-Path $out 'GoldHunterAI_V4.ex5') `
            -Force

          Write-Host 'Compilation output validated successfully.'

      - name: Upload compilation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GOLD-HUNTER-AI-V4-Build-Results
          path: build-output/
          if-no-files-found: warn
          retention-days: 14
