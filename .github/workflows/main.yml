name: GOLD HUNTER AI V4 Compiler

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Compile GoldHunterAI V4
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find EA source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $ea = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter 'GoldHunterAI_V4.mq5' `
            -File `
            -Recurse |
            Select-Object -First 1

          if (-not $ea) {
            throw 'GoldHunterAI_V4.mq5 was not found in the repository.'
          }

          "EA_SOURCE=$($ea.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Found EA: $($ea.FullName)"

      - name: Install MetaTrader 5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $installDir = 'C:\MT5'
          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          $url = 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe'

          New-Item -ItemType Directory -Force -Path $installDir | Out-Null

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer `
            -TimeoutSec 180

          if (-not (Test-Path $installer)) {
            throw 'MetaTrader 5 installer download failed.'
          }

          $setup = Start-Process `
            -FilePath $installer `
            -ArgumentList @('/auto', "/path:$installDir") `
            -Wait `
            -PassThru

          Write-Host "Installer exit code: $($setup.ExitCode)"

          $editor = $null

          for ($attempt = 0; $attempt -lt 12; $attempt++) {
            $editor = Get-ChildItem `
              -Path $installDir `
              -Filter 'metaeditor64.exe' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName -First 1

            if ($editor) {
              break
            }

            Start-Sleep -Seconds 5
          }

          if (-not $editor) {
            throw 'MetaEditor was not installed.'
          }

          $editorDir = Split-Path $editor -Parent

          "METAEDITOR=$editor" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "MT5_INSTALL=$editorDir" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "MetaEditor: $editor"

      - name: Download MQL5 standard include library
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $repoDir = Join-Path $env:RUNNER_TEMP 'mt5-docker-library'
          $includeSource = Join-Path $repoDir 'MetaTrader 5\MQL5\Include'
          $includeTarget = Join-Path $env:MT5_INSTALL 'MQL5\Include'

          if (Test-Path $repoDir) {
            Remove-Item $repoDir -Recurse -Force
          }

          git clone --depth 1 `
            https://github.com/vmlellis/mt5-docker.git `
            $repoDir

          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to download the MQL5 library repository.'
          }

          if (-not (Test-Path $includeSource)) {
            throw "Standard library directory not found: $includeSource"
          }

          $required = @(
            'Object.mqh',
            'Trade\Trade.mqh',
            'Trade\SymbolInfo.mqh',
            'Trade\OrderInfo.mqh',
            'Trade\HistoryOrderInfo.mqh',
            'Trade\PositionInfo.mqh',
            'Trade\DealInfo.mqh'
          )

          foreach ($relative in $required) {
            if (-not (Test-Path (Join-Path $includeSource $relative))) {
              throw "Downloaded library is missing: $relative"
            }
          }

          New-Item -ItemType Directory -Force -Path $includeTarget | Out-Null

          Copy-Item `
            -Path (Join-Path $includeSource '*') `
            -Destination $includeTarget `
            -Recurse -Force

          foreach ($relative in $required) {
            if (-not (Test-Path (Join-Path $includeTarget $relative))) {
              throw "Library copy failed: $relative"
            }
          }

          Write-Host 'MQL5 standard library installed.'

      - name: Patch Trade IsStopped compatibility
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $tradeFile = Join-Path `
            $env:MT5_INSTALL `
            'MQL5\Include\Trade\Trade.mqh'

          if (-not (Test-Path $tradeFile)) {
            throw "Trade.mqh not found: $tradeFile"
          }

          $content = [System.IO.File]::ReadAllText($tradeFile)

          # Change only bare IsStopped() calls to the global ::IsStopped().
          # Do not change CTrade::IsStopped(string) declarations or calls.
          $pattern = '(?<![:\w])IsStopped\s*\(\s*\)'
          $patched = [regex]::Replace(
            $content,
            $pattern,
            '::IsStopped()'
          )

          if ($patched -eq $content) {
            if ($content -match '::IsStopped\s*\(\s*\)') {
              Write-Host 'Trade.mqh already contains the global IsStopped call.'
            }
            else {
              throw 'No bare IsStopped() call was patched. Inspect the library version.'
            }
          }
          else {
            [System.IO.File]::WriteAllText(
              $tradeFile,
              $patched,
              [System.Text.UTF8Encoding]::new($false)
            )
            Write-Host 'Patched bare IsStopped() call to ::IsStopped().'
          }

          $verified = [System.IO.File]::ReadAllText($tradeFile)

          if ($verified -notmatch '::IsStopped\s*\(\s*\)') {
            throw 'Patch verification failed: ::IsStopped() was not found.'
          }

          Write-Host 'Compatibility patch verified.'

      - name: Prepare EA and project include files
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $mqlRoot = Join-Path $env:MT5_INSTALL 'MQL5'
          $expertsDir = Join-Path $mqlRoot 'Experts'
          $includeDir = Join-Path $mqlRoot 'Include'

          New-Item -ItemType Directory -Force -Path $expertsDir | Out-Null

          $eaTarget = Join-Path $expertsDir 'GoldHunterAI_V4.mq5'
          Copy-Item -Path $env:EA_SOURCE -Destination $eaTarget -Force

          $projectInclude = Join-Path $env:GITHUB_WORKSPACE 'Include'

          if (Test-Path $projectInclude) {
            Copy-Item `
              -Path (Join-Path $projectInclude '*') `
              -Destination $includeDir `
              -Recurse -Force
          }

          $projectFiles = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -File `
            -Recurse

          foreach ($file in $projectFiles) {
            $relative = $file.FullName.Substring(
              $env:GITHUB_WORKSPACE.TrimEnd('\').Length
            ).TrimStart('\')

            if ($relative -match '^Libraries\\') {
              $target = Join-Path $mqlRoot $relative
              New-Item -ItemType Directory `
                -Force `
                -Path (Split-Path $target -Parent) | Out-Null
              Copy-Item -Path $file.FullName -Destination $target -Force
            }
          }

          "EA_COMPILE_PATH=$eaTarget" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "EA prepared: $eaTarget"

      - name: Compile EA
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $log = Join-Path $env:GITHUB_WORKSPACE 'compile.log'
          $output = [System.IO.Path]::ChangeExtension(
            $env:EA_COMPILE_PATH, '.ex5'
          )

          Remove-Item $log -Force -ErrorAction SilentlyContinue
          Remove-Item $output -Force -ErrorAction SilentlyContinue

          if (-not (Test-Path $env:METAEDITOR)) {
            throw 'MetaEditor executable is missing.'
          }

          if (-not (Test-Path (Join-Path $env:MT5_INSTALL 'MQL5\Include\Trade\Trade.mqh'))) {
            throw 'Trade.mqh is missing immediately before compilation.'
          }

          $arguments = @(
            '/portable'
            "/compile:$($env:EA_COMPILE_PATH)"
            "/log:$log"
          )

          $process = Start-Process `
            -FilePath $env:METAEDITOR `
            -ArgumentList $arguments `
            -WorkingDirectory $env:MT5_INSTALL `
            -Wait `
            -PassThru

          Write-Host "MetaEditor exit code: $($process.ExitCode)"

          if (-not (Test-Path $log)) {
            throw 'MetaEditor did not create compile.log.'
          }

          $content = Get-Content $log -Raw
          Get-Content $log

          if ($content -match '(?i)\b[1-9]\d*\s+errors?\b') {
            throw 'Compilation reported errors. Review compile.log.'
          }

          if (-not (Test-Path $output)) {
            throw 'Compiled EX5 output was not created.'
          }

          if ($content -notmatch '(?i)0\s+errors?') {
            throw 'Compile log does not confirm zero errors.'
          }

          Write-Host 'Build verified: zero errors and EX5 output exists.'

      - name: Stage and upload compile results
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $artifactDir = Join-Path $env:GITHUB_WORKSPACE 'build-artifacts'
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null

          $log = Join-Path $env:GITHUB_WORKSPACE 'compile.log'
          if (Test-Path $log) {
            Copy-Item $log (Join-Path $artifactDir 'compile.log') -Force
          }

          $ex5 = 'C:\MT5\MQL5\Experts\GoldHunterAI_V4.ex5'
          if (Test-Path $ex5) {
            Copy-Item $ex5 (Join-Path $artifactDir 'GoldHunterAI_V4.ex5') -Force
            Write-Host 'Compiled EX5 copied to build-artifacts.'
          }
          else {
            Write-Warning 'EX5 file was not found; uploading available logs only.'
          }

      - name: Upload compile results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GoldHunterAI-V4-compile-results
          path: build-artifacts/*
          if-no-files-found: warn
