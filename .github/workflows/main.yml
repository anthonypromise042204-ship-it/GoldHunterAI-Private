name: GOLD HUNTER AI V4 Compiler

on:
  workflow_dispatch:
  push:
    paths:
      - 'GoldHunterAI_V4.mq5'
      - '.github/workflows/gold-hunter-v4.yml'

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'GoldHunterAI_V4.mq5'

          if (!(Test-Path -LiteralPath $source -PathType Leaf)) {
            throw 'GoldHunterAI_V4.mq5 source is missing.'
          }

          $text = Get-Content -LiteralPath $source -Raw

          if ($text -notmatch '#include\s*[<"]Trade[/\\]Trade\.mqh[>"]') {
            throw 'Expected Trade/Trade.mqh include was not found.'
          }

          Write-Host 'Source file and include verified.'

      - name: Download MetaTrader installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $installer `
            -TimeoutSec 180

          if (!(Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw 'MetaTrader installer download failed.'
          }

          if ((Get-Item -LiteralPath $installer).Length -lt 100000) {
            throw 'Downloaded installer is unexpectedly small.'
          }

          Write-Host 'MetaTrader installer downloaded.'

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

          Write-Host 'Launching MetaTrader installer.'

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList '/auto' `
            -Wait `
            -PassThru

          Write-Host "Installer exit code: $($process.ExitCode)"

          $roots = @(
            'C:\MT5',
            'C:\Program Files\MetaTrader 5',
            'C:\Program Files (x86)\MetaTrader 5',
            'C:\Program Files',
            'C:\Program Files (x86)',
            $env:APPDATA,
            $env:LOCALAPPDATA
          ) | Where-Object {
            $_ -and (Test-Path -LiteralPath $_)
          } | Select-Object -Unique

          $editor = $null

          foreach ($root in $roots) {
            Write-Host "Searching for MetaEditor under $root"

            $candidate = Get-ChildItem `
              -LiteralPath $root `
              -Filter 'metaeditor64.exe' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($candidate) {
              $editor = $candidate
              break
            }
          }

          if (!$editor) {
            throw 'MetaEditor64.exe was not found. Check the installer and installation paths.'
          }

          $mt5Root = $editor.DirectoryName

          "METAEDITOR_PATH=$($editor.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "MT5_ROOT=$mt5Root" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "MetaEditor found: $($editor.FullName)"
          Write-Host "MetaTrader installation directory: $mt5Root"

      - name: Locate standard library
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $roots = @(
            $env:MT5_ROOT,
            'C:\MT5',
            'C:\Program Files\MetaTrader 5',
            'C:\Program Files (x86)\MetaTrader 5',
            "$env:APPDATA\MetaQuotes\Terminal",
            "$env:LOCALAPPDATA\Programs"
          ) | Where-Object {
            $_ -and (Test-Path -LiteralPath $_)
          } | Select-Object -Unique

          $tradeFile = $null

          foreach ($root in $roots) {
            Write-Host "Searching for Trade.mqh under $root"

            $candidate = Get-ChildItem `
              -LiteralPath $root `
              -Filter 'Trade.mqh' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.FullName -match '[\\/]MQL5[\\/]Include[\\/]Trade[\\/]Trade\.mqh$'
              } |
              Select-Object -First 1

            if ($candidate) {
              $tradeFile = $candidate
              break
            }
          }

          if (!$tradeFile) {
            throw 'Trade.mqh was not found. The MQL5 standard library must be located or provisioned before compilation.'
          }

          $includeRoot = $tradeFile.FullName -replace '[\\/]Trade[\\/]Trade\.mqh$', ''

          Write-Host "Trade.mqh found: $($tradeFile.FullName)"
          Write-Host "Include root: $includeRoot"

          "MT5_INCLUDE_ROOT=$includeRoot" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compile V4
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Join-Path $env:GITHUB_WORKSPACE 'GoldHunterAI_V4.mq5'
          $experts = Join-Path $env:MT5_ROOT 'MQL5\Experts'
          $expertSource = Join-Path $experts 'GoldHunterAI_V4.mq5'
          $log = Join-Path $env:RUNNER_TEMP 'GoldHunterAI_V4_compile.log'
          $out = Join-Path $env:GITHUB_WORKSPACE 'build-output'

          New-Item -ItemType Directory -Path $experts -Force |
            Out-Null

          New-Item -ItemType Directory -Path $out -Force |
            Out-Null

          Copy-Item -LiteralPath $source -Destination $expertSource -Force

          $arguments = @(
            "/compile:$expertSource"
            "/include:$env:MT5_INCLUDE_ROOT"
            "/log:$log"
          )

          $process = Start-Process `
            -FilePath $env:METAEDITOR_PATH `
            -ArgumentList $arguments `
            -Wait `
            -PassThru

          Start-Sleep -Seconds 2

          if (!(Test-Path -LiteralPath $log -PathType Leaf)) {
            throw "Compiler log was not created. MetaEditor exit code: $($process.ExitCode)"
          }

          $logText = Get-Content -LiteralPath $log -Raw
          Write-Host $logText

          Copy-Item -LiteralPath $log `
            -Destination (Join-Path $out 'GoldHunterAI_V4_compile.log') -Force

          if ($logText -match '(?im)\b\d+\s+errors?\b') {
            throw 'Compiler reported errors. Review the uploaded compile log.'
          }

          $ex5 = Join-Path $experts 'GoldHunterAI_V4.ex5'

          if (!(Test-Path -LiteralPath $ex5 -PathType Leaf)) {
            throw 'GoldHunterAI_V4.ex5 was not produced.'
          }

          Copy-Item -LiteralPath $ex5 `
            -Destination (Join-Path $out 'GoldHunterAI_V4.ex5') -Force

          Write-Host 'EX5 file produced.'

      - name: Upload build results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GOLD-HUNTER-AI-V4-Build-Results
          path: build-output/
          if-no-files-found: warn
          retention-days: 14
