name: Compile GOLD HUNTER AI

on:
  push:
    paths:
      - 'GoldHunterAI_V3_4.mq5'
      - '.github/workflows/main.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Install and Compile EA
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Download Repository
        uses: actions/checkout@v4

      - name: Verify EA Source
        shell: pwsh
        run: |
          if (-not (Test-Path "GoldHunterAI_V3_4.mq5")) {
            Write-Error "GoldHunterAI_V3_4.mq5 was not found in the repository root."
            exit 1
          }

          Write-Host "EA source file found."

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installer = "$env:TEMP\mt5setup.exe"
          $installPath = "C:\MT5"

          New-Item -ItemType Directory `
            -Path $installPath -Force | Out-Null

          Invoke-WebRequest `
            -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" `
            -OutFile $installer

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList "/auto", "/path:$installPath" `
            -PassThru -Wait

          Start-Sleep -Seconds 10

          $editor = Get-ChildItem `
            -Path $installPath `
            -Filter "metaeditor64.exe" `
            -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $editor) {
            Write-Host "Installer exit code: $($process.ExitCode)"
            Write-Error "MetaEditor was not found in C:\MT5."
            exit 1
          }

          "MT5_EDITOR=$($editor.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "MetaEditor found: $($editor.FullName)"

      - name: Initialize MT5 Standard Library
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $terminal = Get-ChildItem `
            -Path "C:\MT5" `
            -Filter "terminal64.exe" `
            -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $terminal) {
            Write-Error "MetaTrader terminal64.exe was not found."
            exit 1
          }

          Write-Host "Starting terminal to initialize platform files."

          $process = Start-Process `
            -FilePath $terminal.FullName `
            -ArgumentList "/portable" `
            -PassThru

          Start-Sleep -Seconds 60

          if (-not $process.HasExited) {
            Stop-Process -Id $process.Id -Force `
              -ErrorAction SilentlyContinue
          }

          $tradeFile = Get-ChildItem `
            -Path "C:\MT5" `
            -Filter "Trade.mqh" `
            -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $tradeFile) {
            Write-Host "Trade.mqh was not found in C:\MT5."
            Write-Host "The compilation action will attempt platform initialization."
          } else {
            Write-Host "Trade.mqh found: $($tradeFile.FullName)"
          }

      - name: Compile GOLD HUNTER AI
        uses: FX31337/MQL-Compile-Action@v2
        with:
          path: 'GoldHunterAI_V3_4.mq5'
          mt-path: 'C:\MT5'
          init-platform: true
          log-file: 'compile.log'
          verbose: true

      - name: Upload Compiled EA and Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GoldHunterAI-Build-Files
          path: |
            **/GoldHunterAI_V3_4.ex5
            **/compile.log
            **/GoldHunterAI_V3_4.log
          if-no-files-found: warn
          retention-days: 7
