name: GOLD HUNTER AI Compiler

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify EA source
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "GoldHunterAI_V3_4.mq5"

          if (!(Test-Path $source)) {
            throw "GoldHunterAI_V3_4.mq5 was not found in the repository root."
          }

          "EA_SOURCE=$source" >> $env:GITHUB_ENV
          Write-Host "Source found: $source"

      - name: Download MetaTrader 5 installer
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"

          Invoke-WebRequest `
            -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" `
            -OutFile $installer

          if (!(Test-Path $installer)) {
            throw "MetaTrader installer download failed."
          }

          Write-Host "Installer downloaded."
      - name: Install and inspect MetaTrader 5
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"
          $installDir = "C:\MT5"

          Write-Host "Installer exists: $(Test-Path $installer)"
          Write-Host "Starting MT5 installer..."

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList @("/auto", "/path:$installDir") `
            -Wait `
            -PassThru

          Write-Host "Installer exit code: $($process.ExitCode)"

          Write-Host "Searching common installation locations..."

          $roots = @(
            "C:\MT5",
            "$env:ProgramFiles\MetaTrader 5",
            "${env:ProgramFiles(x86)}\MetaTrader 5",
            "$env:APPDATA\MetaQuotes\Terminal"
          )

          foreach ($root in $roots) {
            if (Test-Path $root) {
              Write-Host "Found directory: $root"

              Get-ChildItem `
                -Path $root `
                -Filter "Trade.mqh" `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 5 -ExpandProperty FullName

              Get-ChildItem `
                -Path $root `
                -Filter "metaeditor64.exe" `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 5 -ExpandProperty FullName
            }
          }

          $editor = Get-ChildItem `
            -Path "C:\MT5" `
            -Filter "metaeditor64.exe" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (!$editor) {
            throw "MetaEditor was not found under C:\MT5."
          }

          "METAEDITOR_PATH=$($editor.FullName)" >> $env:GITHUB_ENV
          Write-Host "MetaEditor selected: $($editor.FullName)"

      - name: Compile GOLD HUNTER AI V3.4
        shell: pwsh
        run: |
          $source = $env:EA_SOURCE
          $editor = $env:METAEDITOR_PATH
          $log = Join-Path $env:GITHUB_WORKSPACE "GoldHunterAI_V3_4.log"

          Remove-Item $log -Force -ErrorAction SilentlyContinue

          Write-Host "Source: $source"
          Write-Host "MetaEditor: $editor"
          Write-Host "Compilation log: $log"

          $arguments = "/compile:`"$source`" /log"

          $process = Start-Process `
            -FilePath $editor `
            -ArgumentList $arguments `
            -Wait `
            -PassThru

          Write-Host "MetaEditor exit code: $($process.ExitCode)"

          Start-Sleep -Seconds 2

          Write-Host "Searching for generated EX5 files..."

          $files = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter "*.ex5" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue

          if ($files) {
            foreach ($file in $files) {
              Write-Host "EX5 found: $($file.FullName)"
            }
          }
          else {
            Write-Host "No EX5 file found in the workspace."
          }

          $logFiles = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter "GoldHunterAI_V3_4.log" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue

          if ($logFiles) {
            foreach ($logFile in $logFiles) {
              Write-Host "----- COMPILER LOG: $($logFile.FullName) -----"
              Get-Content $logFile.FullName
              Write-Host "----- END COMPILER LOG -----"
            }
          }
          else {
            Write-Host "Compiler log was not found in the workspace."
          }

          if (!$files) {
            throw "No EX5 output found. Review the compiler log above."
          }

      - name: Upload compilation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GOLD-HUNTER-AI-V3-4-Diagnostics
          path: |
            GoldHunterAI_V3_4.mq5
            GoldHunterAI_V3_4.log
            GoldHunterAI_V3_4.ex5
            **/GoldHunterAI_V3_4.log
            **/*.ex5
          if-no-files-found: warn
          retention-days: 7
