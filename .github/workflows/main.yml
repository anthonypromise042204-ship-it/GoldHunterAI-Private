name: GOLD HUNTER AI V4 Compiler

on:
  workflow_dispatch:
  push:
    paths:
      - 'GoldHunterAI_V4.mq5'
      - '.github/workflows/gold-hunter-v4.yml'

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'GoldHunterAI_V4.mq5'

          if (!(Test-Path $source -PathType Leaf)) {
            throw 'GoldHunterAI_V4.mq5 source is missing. Add the EA source to the repository root.'
          }

          Write-Host "Source verified: $source"
          Write-Host "Source size: $((Get-Item $source).Length) bytes"

      - name: Download MetaTrader installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $installer `
            -TimeoutSec 240

          if (!(Test-Path $installer -PathType Leaf) -or (Get-Item $installer).Length -lt 1MB) {
            throw 'MetaTrader installer download failed or returned an unexpectedly small file.'
          }
      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

          $install = Start-Process `
            -FilePath $installer `
            -ArgumentList '/auto' `
            -Wait `
            -PassThru

          Write-Host "Installer exit code: $($install.ExitCode)"

          $roots = @(
            'C:\Program Files',
            'C:\Program Files (x86)',
            $env:LOCALAPPDATA,
            $env:APPDATA
          ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique

          $editor = Get-ChildItem `
            -Path $roots `
            -Filter 'metaeditor64.exe' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (!$editor) {
            throw 'MetaEditor executable not found after installation.'
          }

          "METAEDITOR_PATH=$($editor.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "MT5_ROOT=$($editor.DirectoryName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "MetaEditor found: $($editor.FullName)"
          Write-Host "MetaTrader root: $($editor.DirectoryName)"
          Write-Host "Checking for the standard MQL5 Trade library..."

          $possibleTradePaths = @(
            (Join-Path $editor.DirectoryName 'MQL5\Include\Trade\Trade.mqh'),
            (Join-Path $env:APPDATA 'MetaQuotes\Terminal')
          )

          foreach ($path in $possibleTradePaths) {
            if (Test-Path $path) {
              Write-Host "Found path: $path"
            } else {
              Write-Host "Not found: $path"
            }
          }

      - name: Prepare MQL5 standard library
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $include = Join-Path $env:MT5_ROOT 'MQL5\Include'
          $trade = Join-Path $include 'Trade\Trade.mqh'

          if (Test-Path $trade -PathType Leaf) {
            Write-Host "Found Trade.mqh: $trade"
          }
          else {
            Write-Host "Trade.mqh is missing. Searching the installed MetaTrader directories."

            $searchRoots = @(
              (Join-Path $env:APPDATA 'MetaQuotes\Terminal'),
              $env:MT5_ROOT
            ) | Where-Object { $_ -and (Test-Path $_) }

            $found = $null

            foreach ($root in $searchRoots) {
              $candidate = Get-ChildItem -Path $root `
                -Filter 'Trade.mqh' -File -Recurse `
                -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match '[\\/]MQL5[\\/]Include[\\/]Trade[\\/]Trade\.mqh$' } |
                Select-Object -First 1

              if ($candidate) {
                $found = $candidate.FullName
                break
              }
            }

            if ($found) {
              Write-Host "Found standard library file: $found"
              New-Item -ItemType Directory -Path (Split-Path $trade) -Force | Out-Null
              Copy-Item -LiteralPath $found -Destination $trade -Force
            }
            else {
              throw "Trade.mqh was not found in the installed MetaTrader directories. Check the MT5 installation and library paths."
            }
          }

          if (!(Test-Path $trade -PathType Leaf)) {
            throw "Trade.mqh is still missing: $trade"
          }

          Write-Host "Verified standard library: $trade"

      - name: Compile V4
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'GoldHunterAI_V4.mq5'
          $experts = Join-Path $env:MT5_ROOT 'MQL5\Experts'
          $expertSource = Join-Path $experts 'GoldHunterAI_V4.mq5'
          $log = Join-Path $env:RUNNER_TEMP 'GoldHunterAI_V4_compile.log'
          $out = Join-Path $env:GITHUB_WORKSPACE 'build-output'

          New-Item -ItemType Directory -Path $experts -Force | Out-Null
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Copy-Item $source $expertSource -Force

          # Remove any prior output before compiling so a stale EX5 cannot pass validation.
          $ex5 = Join-Path $experts 'GoldHunterAI_V4.ex5'
          if (Test-Path $ex5) { Remove-Item $ex5 -Force }
          if (Test-Path $log) { Remove-Item $log -Force }

          $arguments = "/compile:`"$expertSource`" /log:`"$log`""
          $process = Start-Process `
            -FilePath $env:METAEDITOR_PATH `
            -ArgumentList $arguments `
            -Wait `
            -PassThru

          if (!(Test-Path $log -PathType Leaf)) {
            throw "Compiler log missing. MetaEditor exit code: $($process.ExitCode)"
          }

          $logText = Get-Content $log -Raw
          Write-Host $logText
          Copy-Item $log (Join-Path $out 'GoldHunterAI_V4_compile.log') -Force

          # Match compiler summaries such as "Result: 2 errors, 1 warnings".
          $errors = [regex]::Match($logText, '(?im)\b(\d+)\s+errors?\b')
          if (!$errors.Success) {
            throw 'Could not verify the error count in the compiler log; failing safely.'
          }
          if ([int]$errors.Groups[1].Value -gt 0) {
            throw "Compiler reported $($errors.Groups[1].Value) error(s). See the uploaded compile log."
          }

          if (!(Test-Path $ex5 -PathType Leaf) -or (Get-Item $ex5).Length -eq 0) {
            throw 'A fresh, non-empty EX5 file was not produced.'
          }

          Copy-Item $ex5 (Join-Path $out 'GoldHunterAI_V4.ex5') -Force
          Write-Host 'Compilation passed and EX5 output was created.'

      - name: Upload build results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GOLD-HUNTER-AI-V4-Build-Results
          path: build-output/
          if-no-files-found: warn
          retention-days: 14
