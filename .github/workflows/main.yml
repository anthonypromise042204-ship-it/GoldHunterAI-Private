name: GOLD HUNTER AI V4 Compiler

on:
  workflow_dispatch:
  push:
    paths:
      - 'GoldHunterAI_V4.mq5'
      - '.github/workflows/gold-hunter-v4.yml'

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'GoldHunterAI_V4.mq5'

          if (!(Test-Path $source -PathType Leaf)) {
            throw 'GoldHunterAI_V4.mq5 source is missing'
          }

          Write-Host 'Source file verified.'

      - name: Download MetaTrader installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $installer `
            -TimeoutSec 180

          if (!(Test-Path $installer -PathType Leaf)) {
            throw 'MetaTrader installer download failed'
          }

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

          Start-Process `
            -FilePath $installer `
            -ArgumentList '/auto' `
            -Wait

          $roots = @(
            'C:\Program Files',
            'C:\Program Files (x86)',
            $env:LOCALAPPDATA,
            $env:APPDATA
          ) | Where-Object {
            $_ -and (Test-Path $_)
          } | Select-Object -Unique

          $editor = Get-ChildItem `
            -Path $roots `
            -Filter 'metaeditor64.exe' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (!$editor) {
            throw 'MetaEditor executable not found'
          }

          "METAEDITOR_PATH=$($editor.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "MT5_ROOT=$($editor.DirectoryName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "MetaEditor found: $($editor.FullName)"

      - name: Prepare MQL5 standard library
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $include = Join-Path $env:MT5_ROOT 'MQL5\Include'
          $trade = Join-Path $include 'Trade\Trade.mqh'

          if (Test-Path $trade -PathType Leaf) {
            Write-Host 'MetaTrader standard Trade library found.'
          }
          else {
            Write-Host 'Standard library missing; retrieving a community mirror.'

            $mirror = Join-Path $env:RUNNER_TEMP 'mt5-library-mirror'

            git clone --depth 1 `
              https://github.com/vmlellis/mt5-docker.git `
              $mirror

            if ($LASTEXITCODE -ne 0) {
              throw 'Could not retrieve the library mirror'
            }

            $mirrorInclude = Join-Path `
              $mirror 'MetaTrader 5\MQL5\Include'

            $mirrorTrade = Join-Path `
              $mirrorInclude 'Trade\Trade.mqh'

            if (!(Test-Path $mirrorTrade -PathType Leaf)) {
              throw 'Trade.mqh was not found in the library mirror'
            }

            New-Item `
              -ItemType Directory `
              -Path $include `
              -Force | Out-Null

            Copy-Item `
              -Path (Join-Path $mirrorInclude '*') `
              -Destination $include `
              -Recurse `
              -Force

            if (!(Test-Path $trade -PathType Leaf)) {
              throw 'Trade.mqh is still missing after library setup'
            }

            Write-Host 'Library files copied successfully.'
          }

      - name: Compile V4
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Join-Path $env:GITHUB_WORKSPACE 'GoldHunterAI_V4.mq5'
          $experts = Join-Path $env:MT5_ROOT 'MQL5\Experts'
          $expertSource = Join-Path $experts 'GoldHunterAI_V4.mq5'
          $log = Join-Path $env:RUNNER_TEMP 'GoldHunterAI_V4_compile.log'
          $out = Join-Path $env:GITHUB_WORKSPACE 'build-output'

          if (!(Test-Path $source -PathType Leaf)) {
            throw 'V4 source file not found'
          }

          New-Item `
            -ItemType Directory `
            -Path $experts `
            -Force | Out-Null

          New-Item `
            -ItemType Directory `
            -Path $out `
            -Force | Out-Null

          Copy-Item $source $expertSource -Force

          $arguments = "/compile:`"$expertSource`" /log:`"$log`""

          $process = Start-Process `
            -FilePath $env:METAEDITOR_PATH `
            -ArgumentList $arguments `
            -Wait `
            -PassThru

          if (!(Test-Path $log -PathType Leaf)) {
            throw "Compiler log missing. Exit code: $($process.ExitCode)"
          }

          $logText = Get-Content $log -Raw
          Write-Host $logText

          Copy-Item `
            $log `
            (Join-Path $out 'GoldHunterAI_V4_compile.log') `
            -Force

          $errors = [regex]::Match(
            $logText,
            '(?im)^\s*(\d+)\s+errors?\b'
          )

          if ($errors.Success -and [int]$errors.Groups[1].Value -gt 0) {
            throw 'Compiler reported errors. Review the uploaded log.'
          }

          $ex5 = Join-Path $experts 'GoldHunterAI_V4.ex5'

          if (!(Test-Path $ex5 -PathType Leaf)) {
            throw 'EX5 file was not produced'
          }

          Copy-Item `
            $ex5 `
            (Join-Path $out 'GoldHunterAI_V4.ex5') `
            -Force

          Write-Host 'Compiled EX5 file created.'

      - name: Upload build results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GOLD-HUNTER-AI-V4-Build-Results
          path: build-output/
          if-no-files-found: warn
          retention-days: 14
