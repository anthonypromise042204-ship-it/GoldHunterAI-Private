name: GOLD HUNTER AI Compiler

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      # 1. Get the source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Verify the EA source
      - name: Verify EA source
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "GoldHunterAI_V3_4.mq5"

          if (!(Test-Path $source -PathType Leaf)) {
            throw "GoldHunterAI_V3_4.mq5 is missing from the repository root."
          }

          if ((Get-Item $source).Length -eq 0) {
            throw "The EA source file is empty."
          }

          Write-Host "Source verified: $source"
          Write-Host "Source size: $((Get-Item $source).Length) bytes"

          "EA_SOURCE=$source" >> $env:GITHUB_ENV

      # 3. Download MetaTrader
      - name: Download MetaTrader 5
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"

          $url = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer `
            -TimeoutSec 180

          if (!(Test-Path $installer -PathType Leaf)) {
            throw "MetaTrader installer download failed."
          }

          if ((Get-Item $installer).Length -lt 100000) {
            throw "The installer file is unexpectedly small."
          }

          Write-Host "MetaTrader installer downloaded."

      # 4. Install MetaTrader and locate MetaEditor
      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"
          $installDir = "C:\MT5"

          New-Item `
            -ItemType Directory `
            -Path $installDir `
            -Force |
            Out-Null

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList @("/auto", "/path:$installDir") `
            -Wait `
            -PassThru

          Write-Host "Installer exit code: $($process.ExitCode)"

          $editor = Get-ChildItem `
            -Path $installDir `
            -Filter "metaeditor64.exe" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          $terminal = Get-ChildItem `
            -Path $installDir `
            -Filter "terminal64.exe" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (!$editor) {
            throw "MetaEditor64.exe was not found after installation."
          }

          if (!$terminal) {
            throw "terminal64.exe was not found after installation."
          }

          Write-Host "MetaEditor: $($editor.FullName)"
          Write-Host "Terminal: $($terminal.FullName)"

          "METAEDITOR_PATH=$($editor.FullName)" >> $env:GITHUB_ENV
          "TERMINAL_PATH=$($terminal.FullName)" >> $env:GITHUB_ENV
          "MT5_INSTALL_DIR=$installDir" >> $env:GITHUB_ENV

      - name: Initialize MetaTrader and find library
        shell: pwsh
        run: |
          $terminal = $env:TERMINAL_PATH
          $installDir = $env:MT5_INSTALL_DIR

          if (!(Test-Path $terminal -PathType Leaf)) {
            throw "MetaTrader terminal executable was not found."
          }

          $terminalDir = Split-Path $terminal -Parent

          Write-Host "Starting MetaTrader in portable mode."

          Start-Process `
            -FilePath $terminal `
            -ArgumentList "/portable" `
            -WorkingDirectory $terminalDir

          Start-Sleep -Seconds 15

          $tradeLibrary = Get-ChildItem `
            -Path $installDir `
            -Filter "Trade.mqh" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -match '[\\/]MQL5[\\/]Include[\\/]Trade[\\/]Trade\.mqh$'
            } |
            Select-Object -First 1

          if (!$tradeLibrary) {
            throw "Trade.mqh was not found. The MQL5 standard library must be available before compilation."
          }

          $mql5Dir = Split-Path `
            (Split-Path `
              (Split-Path $tradeLibrary.FullName -Parent) -Parent) `
            -Parent

          $includeDir = Join-Path $mql5Dir "Include"
          $expertsDir = Join-Path $mql5Dir "Experts"

          New-Item `
            -ItemType Directory `
            -Path $expertsDir `
            -Force |
            Out-Null

          $source = $env:EA_SOURCE
          $compileSource = Join-Path $expertsDir "GoldHunterAI_V3_4.mq5"
          $compileLog = Join-Path $env:RUNNER_TEMP "GoldHunterAI_compile.log"

          Copy-Item `
            -Path $source `
            -Destination $compileSource `
            -Force

          Write-Host "Trading library found: $($tradeLibrary.FullName)"
          Write-Host "MQL5 directory: $mql5Dir"
          Write-Host "EA source: $compileSource"

          "COMPILE_SOURCE=$compileSource" >> $env:GITHUB_ENV
          "COMPILE_LOG=$compileLog" >> $env:GITHUB_ENV
          "EXPERT_DIR=$expertsDir" >> $env:GITHUB_ENV
