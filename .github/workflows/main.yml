name: GOLD HUNTER AI V4 Compiler

on:
  workflow_dispatch:
  push:
    paths:
      - 'GoldHunterAI_V4.mq5'
      - '.github/workflows/gold-hunter-v4.yml'

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'GoldHunterAI_V4.mq5'

          if (!(Test-Path $source -PathType Leaf)) {
            throw 'GoldHunterAI_V4.mq5 source is missing'
          }

          $text = Get-Content $source -Raw

          if ($text -notmatch '#include\s*[<"]Trade[/\\]Trade\.mqh[>"]') {
            throw 'Unexpected Trade.mqh include. Check the source file.'
          }

          Write-Host 'Source file and Trade.mqh include verified.'

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

          if (!(Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "Installer not found: $installer"
          }

          Write-Host 'Launching MetaTrader installer...'

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList '/auto' `
            -Wait `
            -PassThru

          Write-Host "Installer exit code: $($process.ExitCode)"

          $searchRoots = @(
            'C:\Program Files',
            'C:\Program Files (

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

          if (!(Test-Path -LiteralPath $installer)) {
            throw "MetaTrader installer not found: $installer"
          }

          Write-Host 'Starting MetaTrader 5 installation'

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList '/auto' `
            -Wait `
            -PassThru

          Write-Host "Installer exit code: $($process.ExitCode)"

          $roots = @(
            'C:\MT5',
            'C:\Program Files\MetaTrader 5',
            'C:\Program Files (x86)\MetaTrader 5',
            $env:LOCALAPPDATA,
            $env:APPDATA
          ) | Where-Object {
            $_ -and (Test-Path -LiteralPath $_)
          } | Select-Object -Unique

          $editor = $null

          foreach ($root in $roots) {
            Write-Host "Searching: $root"

            $found = Get-ChildItem `
              -LiteralPath $root `
              -Filter 'metaeditor64.exe' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($found) {
              $editor = $found
              break
            }
          }

          if (!$editor) {
            throw 'MetaEditor64.exe was not found after installation.'
          }

          $mt5Root = $editor.DirectoryName

          "METAEDITOR_PATH=$($editor.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "MT5_ROOT=$mt5Root" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "MetaEditor found: $($editor.FullName)"
          Write-Host "MetaTrader root: $mt5Root"

          $tradeFile = Get-ChildItem `
            -LiteralPath $mt5Root `
            -Filter 'Trade.mqh' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -match '[\\/]MQL5[\\/]Include[\\/]Trade[\\/]Trade\.mqh$'
            } |
            Select-Object -First 1

          if ($tradeFile) {
            Write-Host "Trade.mqh found: $($tradeFile.FullName)"
          }
          else {
            Write-Warning 'Trade.mqh was not found. The next diagnostic step must locate the terminal data directory.'
          }

      - name: Locate standard library
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host 'Searching for MetaTrader 5 standard library...'

          $searchRoots = @(
            $env:MT5_ROOT,
            'C:\MT5',
            'C:\Program Files\MetaTrader 5',
            'C:\Program Files (x86)\MetaTrader 5',
            "$env:APPDATA\MetaQuotes\Terminal",
            "$env:LOCALAPPDATA\Programs"
          ) | Where-Object {
            $_ -and (Test-Path -LiteralPath $_)
          } | Select-Object -Unique

          $tradeFile = $null

          foreach ($root in $searchRoots) {
            Write-Host "Searching: $root"

            $candidate = Get-ChildItem `
              -LiteralPath $root `
              -Filter 'Trade.mqh' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.FullName -match '[\\/]MQL5[\\/]Include[\\/]Trade[\\/]Trade\.mqh$'
              } |
              Select-Object -First 1

            if ($candidate) {
              $tradeFile = $candidate
              break
            }
          }

          if (!$tradeFile) {
            Write-Host 'MetaTrader installation folders:'
            Get-ChildItem 'C:\' -Directory -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName

            throw 'Trade.mqh not found. Check the MetaTrader installation and terminal data folders.'
          }

          $includeRoot = $tradeFile.FullName -replace '[\\/]Trade[\\/]Trade\.mqh$', ''

          Write-Host "Found library: $($tradeFile.FullName)"
          Write-Host "Include root: $includeRoot"

          "MT5_INCLUDE_ROOT=$includeRoot" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compile V4
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Join-Path $env:GITHUB_WORKSPACE 'GoldHunterAI_V4.mq5'
          $experts = Join-Path $env:MT5_ROOT 'MQL5\Experts'
          $expertSource = Join-Path $experts 'GoldHunterAI_V4.mq5'
          $include = $env:MT5_INCLUDE_ROOT
          $log = Join-Path $env:RUNNER_TEMP 'GoldHunterAI_V4_compile.log'
          $out = Join-Path $env:GITHUB_WORKSPACE 'build-output'

          New-Item -ItemType Directory -Path $experts -Force |
            Out-Null
          New-Item -ItemType Directory -Path $out -Force |
            Out-Null

          Copy-Item $source $expertSource -Force

          $arguments = "/compile:`"$expertSource`" /include:`"$include`" /log:`"$log`""

          $process = Start-Process `
            -FilePath $env:METAEDITOR_PATH `
            -ArgumentList $arguments `
            -Wait `
            -PassThru

          Start-Sleep -Seconds 2

          if (!(Test-Path $log -PathType Leaf)) {
            throw "Compiler log missing. Exit code: $($process.ExitCode)"
          }

          $logText = Get-Content $log -Raw
          Write-Host $logText

          Copy-Item $log `
            (Join-Path $out 'GoldHunterAI_V4_compile.log') -Force

          if ($logText -match '(?im)\berror\s+\d+\s*:') {
            throw 'Compiler reported an error. Review the compile log.'
          }

          if ($logText -match '(?im)^\s*[1-9]\d*\s+errors?\b') {
            throw 'Compiler reported errors. Review the compile log.'
          }

          $ex5 = Join-Path $experts 'GoldHunterAI_V4.ex5'

          if (!(Test-Path $ex5 -PathType Leaf)) {
            throw 'EX5 file was not produced'
          }

          Copy-Item $ex5 `
            (Join-Path $out 'GoldHunterAI_V4.ex5') -Force

          Write-Host 'EX5 file created successfully.'

      - name: Upload build results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GOLD-HUNTER-AI-V4-Build-Results
          path: build-output/
          if-no-files-found: warn
          retention-days: 14
