name: GOLD HUNTER AI V4 Compiler

on:
  workflow_dispatch:
  push:
    paths:
      - 'GoldHunterAI_V4.mq5'
      - '.github/workflows/main.yml'
      - '.github/workflows/gold-hunter-v4.yml'

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      # --------------------------------------------------
      # 1. CHECKOUT
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. CREATE OUTPUT DIRECTORY
      # --------------------------------------------------
      - name: Create build report directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $out = Join-Path $env:GITHUB_WORKSPACE 'build-output'

          New-Item -ItemType Directory -Path $out -Force |
            Out-Null

          Write-Host "Build output: $out"

      # --------------------------------------------------
      # 3. VERIFY EA SOURCE
      # --------------------------------------------------
      - name: Verify EA source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Join-Path $env:GITHUB_WORKSPACE 'GoldHunterAI_V4.mq5'

          if (!(Test-Path $source -PathType Leaf)) {
            throw 'GoldHunterAI_V4.mq5 was not found.'
          }

          $file = Get-Item $source

          if ($file.Length -eq 0) {
            throw 'GoldHunterAI_V4.mq5 is empty.'
          }

          Write-Host "Source: $($file.FullName)"
          Write-Host "Size: $($file.Length) bytes"
          Write-Host "SHA256: $((Get-FileHash $source -Algorithm SHA256).Hash)"

          $lines = Get-Content $source

          Write-Host "Source line count: $($lines.Count)"

          if ($lines.Count -ge 8) {
            Write-Host "Line 8: $($lines[7])"
          }

      # --------------------------------------------------
      # 4. DOWNLOAD, INSTALL AND LOCATE METATRADER 5
      # --------------------------------------------------
      - name: Install MetaTrader 5 and locate MetaEditor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          $installPath = 'C:\MT5'
          $report = Join-Path $env:GITHUB_WORKSPACE 'build-output\environment-diagnostics.txt'

          Write-Host 'Downloading official MetaTrader 5 installer...'

          $uri = 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe'

          Invoke-WebRequest `
            -Uri $uri `
            -OutFile $installer `
            -TimeoutSec 240

          if (!(Test-Path $installer -PathType Leaf)) {
            throw 'MetaTrader 5 installer download failed.'
          }

          $installerFile = Get-Item $installer

          if ($installerFile.Length -lt 1MB) {
            throw 'Installer is unexpectedly small.'
          }

          Write-Host "Installer size: $($installerFile.Length) bytes"

          $signature = Get-AuthenticodeSignature $installer

          Write-Host "Installer signature status: $($signature.Status)"

          if ($signature.Status -ne 'Valid') {
            throw "Installer signature verification failed: $($signature.StatusMessage)"
          }

          New-Item -ItemType Directory -Path $installPath -Force |
            Out-Null

          Write-Host "Installing MetaTrader 5 into $installPath..."

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList '/auto /path:"C:\MT5"' `
            -Wait `
            -PassThru

          Write-Host "Installer exit code: $($process.ExitCode)"

          $searchRoots = @(
            'C:\MT5',
            'C:\Program Files\MetaTrader 5',
            'C:\Program Files (x86)\MetaTrader 5',
            "$env:APPDATA\MetaQuotes\Terminal",
            "$env:LOCALAPPDATA\Programs"
          )

          $metaEditor = $null

          Write-Host 'Searching for MetaEditor...'

          for ($attempt = 1; $attempt -le 24; $attempt++) {
            foreach ($root in $searchRoots) {
              if (!(Test-Path $root -PathType Container)) {
                continue
              }

              foreach ($editorName in @('MetaEditor64.exe', 'metaeditor.exe')) {
                $found = Get-ChildItem `
                  -Path $root `
                  -Filter $editorName `
                  -File `
                  -Recurse `
                  -ErrorAction SilentlyContinue |
                  Select-Object -First 1

                if ($found) {
                  $metaEditor = $found
                  break
                }
              }

              if ($metaEditor) {
                break
              }
            }

            if ($metaEditor) {
              break
            }

            Write-Host "MetaEditor not found yet; attempt $attempt of 24."
            Start-Sleep -Seconds 5
          }

          if (!$metaEditor) {
            @(
              "Installer exit code: $($process.ExitCode)"
              "Installer path: $installer"
              "Installation path: $installPath"
              "Installer signature: $($signature.Status)"
              'MetaEditor: NOT FOUND'
            ) | Set-Content $report

            throw 'MetaEditor was not installed or could not be located. Review the installer diagnostics.'
          }

          $metaEditorPath = $metaEditor.FullName
          $mt5Root = Split-Path $metaEditorPath -Parent

          Write-Host "MetaEditor: $metaEditorPath"
          Write-Host "MT5 installation root: $mt5Root"

          @(
            "Installer exit code: $($process.ExitCode)"
            "Installer signature: $($signature.Status)"
            "MetaEditor: $metaEditorPath"
            "MT5 installation root: $mt5Root"
          ) | Set-Content $report

          "METAEDITOR_PATH=$metaEditorPath" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          "MT5_ROOT=$mt5Root" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host 'MetaEditor discovery completed.'

      # --------------------------------------------------
      # 5. LOCATE AND PREPARE THE STANDARD LIBRARY
      # --------------------------------------------------
      - name: Locate and prepare MQL5 Standard Library
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $report = Join-Path $env:GITHUB_WORKSPACE 'build-output\environment-diagnostics.txt'

          $searchRoots = @(
            $env:MT5_ROOT,
            'C:\MT5',
            'C:\Program Files\MetaTrader 5',
            'C:\Program Files (x86)\MetaTrader 5',
            "$env:APPDATA\MetaQuotes\Terminal"
          )
