name: GOLD HUNTER AI V4 Compiler

on:
  workflow_dispatch:
  push:
    paths:
      - 'GoldHunterAI_V4.mq5'
      - '.github/workflows/gold-hunter-v4.yml'

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Verify source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'GoldHunterAI_V4.mq5'
          if (!(Test-Path $source -PathType Leaf)) {
            throw 'V4 source is missing'
          }

      - name: Download MetaTrader installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $installer `
            -TimeoutSec 180

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Process `
            (Join-Path $env:RUNNER_TEMP 'mt5setup.exe') `
            -ArgumentList '/auto' -Wait

          $editor = Get-ChildItem 'C:\Program Files' `
            -Filter 'metaeditor64.exe' -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (!$editor) {
            $editor = Get-ChildItem $env:LOCALAPPDATA `
              -Filter 'metaeditor64.exe' -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }

          if (!$editor) {
            throw 'MetaEditor not found'
          }

          "METAEDITOR_PATH=$($editor.FullName)" |
            Out-File $env:GITHUB_ENV -Append

      - name: Compile V4
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Join-Path $env:GITHUB_WORKSPACE 'GoldHunterAI_V4.mq5'
          $log = Join-Path $env:RUNNER_TEMP 'GoldHunterAI_V4_compile.log'
          $out = Join-Path $env:GITHUB_WORKSPACE 'build-output'

          $terminalRoot = Join-Path $env:APPDATA 'MetaQuotes\Terminal'

          $data = Get-ChildItem $terminalRoot -Directory `
            -ErrorAction SilentlyContinue |
            Where-Object {
              Test-Path (
                Join-Path $_.FullName 'MQL5\Include\Trade\Trade.mqh'
              )
            } |
            Select-Object -First 1

          if (!$data) {
            throw 'MT5 data folder or Trade.mqh library not found'
          }

          $experts = Join-Path $data.FullName 'MQL5\Experts'
          New-Item -ItemType Directory -Path $experts -Force |
            Out-Null

          $expertSource = Join-Path $experts 'GoldHunterAI_V4.mq5'
          Copy-Item $source $expertSource -Force

          New-Item -ItemType Directory -Path $out -Force |
            Out-Null

          $arguments = "/compile:`"$expertSource`" /log:`"$log`""

          Start-Process $env:METAEDITOR_PATH `
            -ArgumentList $arguments -Wait | Out-Null

          if (!(Test-Path $log)) {
            throw 'Compiler log was not produced'
          }

          Get-Content $log

          Copy-Item $log `
            (Join-Path $out 'GoldHunterAI_V4_compile.log') -Force

          $ex5 = Join-Path $experts 'GoldHunterAI_V4.ex5'

          if (Test-Path $ex5) {
            Copy-Item $ex5 `
              (Join-Path $out 'GoldHunterAI_V4.ex5') -Force
          }

          $logText = Get-Content $log -Raw

          if ($logText -match '\b[1-9]\d*\s+errors?\b') {
            throw 'Compiler errors found'
          }

          if (!(Test-Path (Join-Path $out 'GoldHunterAI_V4.ex5'))) {
            throw 'EX5 output missing'
          }

      - name: Upload build results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GOLD-HUNTER-AI-V4-Build-Results
          path: build-output/
          if-no-files-found: warn
          retention-days: 14
