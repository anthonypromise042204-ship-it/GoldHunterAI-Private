name: GOLD HUNTER AI Compiler

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 20

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify EA source
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "GoldHunterAI_V3_4.mq5"

          if (!(Test-Path -LiteralPath $source -PathType Leaf)) {
            throw "GoldHunterAI_V3_4.mq5 is missing from the repository root."
          }

          if ((Get-Item -LiteralPath $source).Length -eq 0) {
            throw "The EA source file is empty."
          }

          "EA_SOURCE=$source" >> $env:GITHUB_ENV
          Write-Host "Verified source: $source"

      - name: Download MetaTrader 5 installer
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"
          $url = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"

          Invoke-WebRequest -Uri $url -OutFile $installer -TimeoutSec 180

          if (!(Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "MetaTrader installer download failed."
          }

          if ((Get-Item -LiteralPath $installer).Length -lt 100000) {
            throw "The downloaded installer is unexpectedly small."
          }

          "MT5_INSTALLER=$installer" >> $env:GITHUB_ENV
          Write-Host "Installer downloaded."

      - name: Install MetaTrader 5
        run: |
          $installDir = "C:\MT5"

          New-Item -ItemType Directory -Path $installDir -Force | Out-Null

          $process = Start-Process `
            -FilePath $env:MT5_INSTALLER `
            -ArgumentList @("/auto", "/path:$installDir") `
            -Wait `
            -PassThru

          Write-Host "Installer exit code: $($process.ExitCode)"

          $editor = Get-ChildItem `
            -Path $installDir `
            -Filter "metaeditor64.exe" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          $terminal = Get-ChildItem `
            -Path $installDir `
            -Filter "terminal64.exe" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (!$editor) {
            throw "MetaEditor64.exe was not found."
          }

          if (!$terminal) {
            throw "terminal64.exe was not found."
          }

          "METAEDITOR_PATH=$($editor.FullName)" >> $env:GITHUB_ENV
          "TERMINAL_PATH=$($terminal.FullName)" >> $env:GITHUB_ENV
          "MT5_INSTALL_DIR=$installDir" >> $env:GITHUB_ENV

          Write-Host "MetaEditor: $($editor.FullName)"
          Write-Host "Terminal: $($terminal.FullName)"

      - name: Initialize MetaTrader and locate trading library
        run: |
          $terminal = $env:TERMINAL_PATH
          $installDir = $env:MT5_INSTALL_DIR

          $terminalDir = Split-Path -Parent $terminal

          Write-Host "Starting MetaTrader in portable mode."

          $process = Start-Process `
            -FilePath $terminal `
            -ArgumentList "/portable" `
            -WorkingDirectory $terminalDir `
            -PassThru

          Start-Sleep -Seconds 12

          if (!$process.HasExited) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

          $searchRoots = @(
            (Join-Path $installDir "MQL5\Include"),
            (Join-Path $env:APPDATA "MetaQuotes\Terminal")
          )

          $tradeLibrary = $null

          foreach ($root in $searchRoots) {
            if (Test-Path -LiteralPath $root -PathType Container) {
              $tradeLibrary = Get-ChildItem `
                -Path $root `
                -Filter "Trade.mqh" `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.FullName -match '[\\/]MQL5[\\/]Include[\\/]Trade[\\/]Trade\.mqh$'
                } |
                Select-Object -First 1

              if ($tradeLibrary) {
                break
              }
            }
          }

          if (!$tradeLibrary) {
            throw "Trade.mqh was not found. The standard MQL5 trading library is required."
          }

          $includeDir = Split-Path -Parent (Split-Path -Parent $tradeLibrary.FullName)
          $mql5Dir = Split-Path -Parent (Split-Path -Parent $includeDir)
          $expertsDir = Join-Path $mql5Dir "Experts"

          New-Item -ItemType Directory -Path $expertsDir -Force | Out-Null

          $compileSource = Join-Path $expertsDir "GoldHunterAI_V3_4.mq5"
          $compileLog = Join-Path $env:RUNNER_TEMP "GoldHunterAI_compile.log"

          Copy-Item `
            -LiteralPath $env:EA_SOURCE `
            -Destination $compileSource `
            -Force

          "MQL5_DIR=$mql5Dir" >> $env:GITHUB_ENV
          "INCLUDE_DIR=$includeDir" >> $env:GITHUB_ENV
          "EXPERT_DIR=$expertsDir" >> $env:GITHUB_ENV
          "COMPILE_SOURCE=$compileSource" >> $env:GITHUB_ENV
          "COMPILE_LOG=$compileLog" >> $env:GITHUB_ENV

          Write-Host "Trading library: $($tradeLibrary.FullName)"
          Write-Host "MQL5 directory: $mql5Dir"
          Write-Host "EA source: $compileSource"

      - name: Compile GOLD HUNTER AI
        run: |
          $editor = $env:METAEDITOR_PATH
          $source = $env:COMPILE_SOURCE
          $log = $env:COMPILE_LOG
          $ex5 = Join-Path $env:EXPERT_DIR "GoldHunterAI_V3_4.ex5"

          if (!(Test-Path -LiteralPath $editor -PathType Leaf)) {
            throw "MetaEditor executable is missing."
          }

          if (!(Test-Path -LiteralPath $source -PathType Leaf)) {
            throw "The EA source for compilation is missing."
          }

          if (!(Test-Path -LiteralPath (Join-Path $env:INCLUDE_DIR "Trade\Trade.mqh") -PathType Leaf)) {
            throw "Trade.mqh is missing from the selected include directory."
          }

          Remove-Item -LiteralPath $log -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $ex5 -Force -ErrorAction SilentlyContinue

          Write-Host "Compiling: $source"

          $arguments = "/compile:$source /log:$log"

          $process = Start-Process `
            -FilePath $editor `
            -ArgumentList $arguments `
            -Wait `
            -PassThru

          Write-Host "MetaEditor exit code: $($process.ExitCode)"

          Start-Sleep -Seconds 2

          if (!(Test-Path -LiteralPath $log -PathType Leaf)) {
            throw "MetaEditor did not create a compiler log."
          }

          $logText = Get-Content -LiteralPath $log -Raw

          Write-Host "========== COMPILER LOG =========="
          Write-Host $logText
          Write-Host "=================================="

          if ($logText -match '(?i)Result:\s*[1-9]\d*\s+errors?') {
            throw "Compilation failed. See the compiler log."
          }

          if ($logText -match '(?i)\b[1-9]\d*\s+errors?\b') {
            throw "The compiler reported one or more errors."
          }

          if (!(Test-Path -LiteralPath $ex5 -PathType Leaf)) {
            throw "The expected EX5 file was not created."
          }

          if ((Get-Item -LiteralPath $ex5).Length -eq 0) {
            throw "The EX5 file is empty."
          }

          Write-Host "Compilation checks passed."
          Write-Host "EX5 file: $ex5"
          Write-Host "EX5 size: $((Get-Item -LiteralPath $ex5).Length) bytes"

      - name: Upload compiled EA and compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GOLD-HUNTER-AI-V3-4-Build
          path: |
            ${{ runner.temp }}\GoldHunterAI_compile.log
            C:\MT5\MQL5\Experts\GoldHunterAI_V3_4.ex5
            C:\MT5\MQL5\Experts\GoldHunterAI_V3_4.mq5
          if-no-files-found: warn
          retention-days: 14
