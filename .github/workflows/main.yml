name: GOLD HUNTER AI Compiler

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-latest

    steps:
      # STEP 1: Get the private repository source
      - name: Checkout repository
        uses: actions/checkout@v4

      # STEP 2: Confirm the EA source file exists
      - name: Verify EA source
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "GoldHunterAI_V3_4.mq5"

          if (!(Test-Path $source)) {
            throw "GoldHunterAI_V3_4.mq5 was not found in the repository root."
          }

          Write-Host "EA source found: $source"
          "EA_SOURCE=$source" >> $env:GITHUB_ENV

      # STEP 3: Download the official MetaTrader installer
      - name: Download MetaTrader 5 installer
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"

          $url = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"

          Invoke-WebRequest -Uri $url -OutFile $installer

          if (!(Test-Path $installer)) {
            throw "MetaTrader installer download failed."
          }

          if ((Get-Item $installer).Length -lt 100000) {
            throw "The downloaded installer appears incomplete."
          }

          Write-Host "Installer downloaded successfully."
          Write-Host "Installer size: $((Get-Item $installer).Length) bytes"

      # STEP 4: Install MetaTrader and locate MetaEditor
      - name: Install and inspect MetaTrader 5
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"
          $installDir = "C:\MT5"

          New-Item -ItemType Directory -Path $installDir -Force |
            Out-Null

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList @("/auto", "/path:$installDir") `
            -Wait `
            -PassThru

          Write-Host "Installer exit code: $($process.ExitCode)"

          $editor = Get-ChildItem `
            -Path $installDir `
            -Filter "metaeditor64.exe" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          $terminal = Get-ChildItem `
            -Path $installDir `
            -Filter "terminal64.exe" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($editor) {
            Write-Host "MetaEditor found: $($editor.FullName)"
            "METAEDITOR_PATH=$($editor.FullName)" >> $env:GITHUB_ENV
          }
          else {
            Write-Host "MetaEditor was not found under C:\MT5."
          }

          if ($terminal) {
            Write-Host "Terminal found: $($terminal.FullName)"
            "TERMINAL_PATH=$($terminal.FullName)" >> $env:GITHUB_ENV
          }
          else {
            Write-Host "Terminal was not found under C:\MT5."
          }

          Write-Host "===== INSTALL DIRECTORY ====="

          Get-ChildItem `
            -Path $installDir `
            -Force `
            -ErrorAction SilentlyContinue |
            Select-Object Name, FullName

          if (!$editor) {
            throw "MetaEditor was not installed. Review the installer output."
          }

      # STEP 5: Search common locations for the standard MQL5 library
      - name: Locate standard library
        shell: pwsh
        run: |
          $roots = @(
            "C:\MT5",
            "$env:APPDATA\MetaQuotes",
            "$env:LOCALAPPDATA\MetaQuotes",
            "$env:ProgramFiles\MetaTrader 5",
            "${env:ProgramFiles(x86)}\MetaTrader 5"
          )

          $tradeFile = $null

          foreach ($root in $roots) {
            if (!(Test-Path $root)) {
              continue
            }

            Write-Host "Searching: $root"

            $found = Get-ChildItem `
              -Path $root `
              -Filter "Trade.mqh" `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($found) {
              $tradeFile = $found
              break
            }
          }

          if (!$tradeFile) {
            Write-Host "===== DIAGNOSTIC: MQL5 FILES ====="

            foreach ($root in $roots) {
              if (Test-Path $root) {
                Write-Host "Directory contents: $root"

                Get-ChildItem `
                  -Path $root `
                  -Force `
                  -ErrorAction SilentlyContinue |
                  Select-Object Name, FullName
              }
            }

            throw "Trade.mqh was not found. The standard library is missing from the searched installation locations."
          }

          Write-Host "Trade.mqh found: $($tradeFile.FullName)"

          # Trade.mqh is normally located at:
          # <MQL5 root>\Include\Trade\Trade.mqh
          $includeDir = Split-Path `
            (Split-Path $tradeFile.FullName -Parent) `
            -Parent

          if ((Split-Path $includeDir -Leaf) -ne "Include") {
            throw "Unexpected Trade.mqh location: $($tradeFile.FullName)"
          }

          $mql5Root = Split-Path $includeDir -Parent

          Write-Host "MQL5 root: $mql5Root"

          "MQL5_ROOT=$mql5Root" >> $env:GITHUB_ENV

      # STEP 6: Compile the Expert Advisor
      - name: Compile GOLD HUNTER AI V3.4
        shell: pwsh
        run: |
          $source = $env:EA_SOURCE
          $editor = $env:METAEDITOR_PATH
          $mql5Root = $env:MQL5_ROOT
          $log = Join-Path $env:GITHUB_WORKSPACE "GoldHunterAI_V3_4.log"

          if (!(Test-Path $source)) {
            throw "EA source file is missing."
          }

          if (!(Test-Path $editor)) {
            throw "MetaEditor executable is missing."
          }

          if ([string]::IsNullOrWhiteSpace($mql5Root)) {
            throw "MQL5_ROOT is empty."
          }

          $tradeHeader = Join-Path $mql5Root "Include\Trade\Trade.mqh"

          if (!(Test-Path $tradeHeader)) {
            throw "Trade.mqh is missing from the expected include directory."
          }

          Write-Host "Source: $source"
          Write-Host "MetaEditor: $editor"
          Write-Host "MQL5 root: $mql5Root"

          Remove-Item $log -Force -ErrorAction SilentlyContinue

          $arguments = "/compile:`"$source`" /include:`"$mql5Root`" /log:`"$log`""

          $process = Start-Process `
            -FilePath $editor `
            -ArgumentList $arguments `
            -Wait `
            -PassThru

          Write-Host "MetaEditor exit code: $($process.ExitCode)"

          Start-Sleep -Seconds 3

          if (Test-Path $log) {
            Write-Host "===== COMPILER LOG ====="
            Get-Content $log
            Write-Host "========================"
          }
          else {
            Write-Host "Compiler log not found at the expected path."
          }

          $ex5 = Join-Path `
            (Split-Path $source -Parent) `
            "GoldHunterAI_V3_4.ex5"

          if (!(Test-Path $ex5)) {
            throw "The EX5 file was not produced. Review the compiler log."
          }

          Write-Host "EX5 file found: $ex5"

          if (!(Test-Path $log)) {
            throw "The compiler log is missing. Compilation cannot yet be verified."
          }

          $logText = Get-Content $log -Raw

          if ($logText -match "(?i)\berrors?\s*:\s*[1-9]\d*") {
            throw "The compiler log reports errors. Review the log before using the EA."
          }

          if ($logText -notmatch "(?i)0\s+errors?") {
            throw "The log does not clearly confirm zero compilation errors."
          }

          Write-Host "The compiler log reports zero errors."

      # STEP 7: Upload diagnostic files and compiled output
      - name: Upload compilation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GOLD-HUNTER-AI-V3-4-Diagnostics
          path: |
            GoldHunterAI_V3_4.mq5
            GoldHunterAI_V3_4.log
            **/GoldHunterAI_V3_4.log
            **/GoldHunterAI_V3_4.ex5
          if-no-files-found: warn
          retention-days: 7
