name: GOLD HUNTER AI V4 Compiler

on:
  workflow_dispatch:
  push:
    paths:
      - 'GoldHunterAI_V4.mq5'
      - '.github/workflows/gold-hunter-v4.yml'

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'GoldHunterAI_V4.mq5'

          if (!(Test-Path $source -PathType Leaf)) {
            throw 'GoldHunterAI_V4.mq5 source is missing. Add the EA source to the repository root.'
          }

          Write-Host "Source verified: $source"
          Write-Host "Source size: $((Get-Item $source).Length) bytes"

      - name: Download MetaTrader installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $installer `
            -TimeoutSec 240

          if (!(Test-Path $installer -PathType Leaf) -or (Get-Item $installer).Length -lt 1MB) {
            throw 'MetaTrader installer download failed or returned an unexpectedly small file.'
          }
      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

          Write-Host "Installer exists: $(Test-Path $installer)"
          if (!(Test-Path $installer -PathType Leaf)) {
            throw "Installer not found: $installer"
          }

          $install = Start-Process `
            -FilePath $installer `
            -ArgumentList '/auto' `
            -Wait `
            -PassThru

          Write-Host "Installer exit code: $($install.ExitCode)"

          $editorPaths = @(
            'C:\Program Files\MetaTrader 5\MetaEditor64.exe',
            'C:\Program Files (x86)\MetaTrader 5\MetaEditor64.exe'
          )

          $editorPath = $editorPaths |
            Where-Object { Test-Path $_ -PathType Leaf } |
            Select-Object -First 1

          if (!$editorPath) {
            $editor = Get-ChildItem `
              -Path 'C:\Program Files','C:\Program Files (x86)' `
              -Filter 'MetaEditor64.exe' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($editor) {
              $editorPath = $editor.FullName
            }
          }

          if (!$editorPath) {
            throw "MetaEditor64.exe was not found."
          }

          $mt5Root = Split-Path $editorPath -Parent
          $include = Join-Path $mt5Root 'MQL5\Include'
          $trade = Join-Path $include 'Trade\Trade.mqh'

          "METAEDITOR_PATH=$editorPath" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "MT5_ROOT=$mt5Root" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "MetaEditor: $editorPath"
          Write-Host "MetaTrader root: $mt5Root"
          Write-Host "Include directory exists: $(Test-Path $include)"
          Write-Host "Trade.mqh exists: $(Test-Path $trade)"
          
      - name: Prepare MQL5 standard library
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $terminalRoot = Join-Path $env:APPDATA 'MetaQuotes\Terminal'
          $targetInclude = Join-Path $env:MT5_ROOT 'MQL5\Include'
          $targetTrade = Join-Path $targetInclude 'Trade\Trade.mqh'

          Write-Host "MetaTrader root: $env:MT5_ROOT"
          Write-Host "Terminal data root: $terminalRoot"
          Write-Host "Target library: $targetTrade"

          if (Test-Path $targetTrade -PathType Leaf) {
            Write-Host "Trade.mqh already exists in the target directory."
          }
          else {
            if (-not (Test-Path $terminalRoot -PathType Container)) {
              throw "MetaTrader terminal data directory was not found: $terminalRoot"
            }

            $matches = @(
              Get-ChildItem `
                -Path $terminalRoot `
                -Filter 'Trade.mqh' `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue
            )

            $sourceInclude = $null

            foreach ($match in $matches) {
              $candidateInclude = Split-Path `
                (Split-Path $match.FullName -Parent) -Parent

              if (
                (Split-Path $candidateInclude -Leaf) -eq 'Include' -and
                (Test-Path (Join-Path $candidateInclude 'Trade\Trade.mqh') -PathType Leaf)
              ) {
                $sourceInclude = $candidateInclude
                break
              }
            }

            if (-not $sourceInclude) {
              throw "Could not find a valid MQL5 Include folder containing Trade\Trade.mqh."
            }

            Write-Host "Source Include folder: $sourceInclude"

            New-Item `
              -ItemType Directory `
              -Path $targetInclude `
              -Force | Out-Null

            Copy-Item `
              -Path (Join-Path $sourceInclude '*') `
              -Destination $targetInclude `
              -Recurse `
              -Force

            Write-Host "Copied the MQL5 Include folder."
          }

          if (-not (Test-Path $targetTrade -PathType Leaf)) {
            throw "Trade.mqh is still missing after preparation: $targetTrade"
          }

          Write-Host "SUCCESS: Trade.mqh is available for compilation."
          Get-Item $targetTrade | Select-Object FullName, Length

      - name: Compile V4
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'GoldHunterAI_V4.mq5'
          $experts = Join-Path $env:MT5_ROOT 'MQL5\Experts'
          $expertSource = Join-Path $experts 'GoldHunterAI_V4.mq5'
          $log = Join-Path $env:RUNNER_TEMP 'GoldHunterAI_V4_compile.log'
          $out = Join-Path $env:GITHUB_WORKSPACE 'build-output'

          New-Item -ItemType Directory -Path $experts -Force | Out-Null
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Copy-Item $source $expertSource -Force

          # Remove any prior output before compiling so a stale EX5 cannot pass validation.
          $ex5 = Join-Path $experts 'GoldHunterAI_V4.ex5'
          if (Test-Path $ex5) { Remove-Item $ex5 -Force }
          if (Test-Path $log) { Remove-Item $log -Force }

          $arguments = "/compile:`"$expertSource`" /log:`"$log`""
          $process = Start-Process `
            -FilePath $env:METAEDITOR_PATH `
            -ArgumentList $arguments `
            -Wait `
            -PassThru

          if (!(Test-Path $log -PathType Leaf)) {
            throw "Compiler log missing. MetaEditor exit code: $($process.ExitCode)"
          }

          $logText = Get-Content $log -Raw
          Write-Host $logText
          Copy-Item $log (Join-Path $out 'GoldHunterAI_V4_compile.log') -Force

          # Match compiler summaries such as "Result: 2 errors, 1 warnings".
          $errors = [regex]::Match($logText, '(?im)\b(\d+)\s+errors?\b')
          if (!$errors.Success) {
            throw 'Could not verify the error count in the compiler log; failing safely.'
          }
          if ([int]$errors.Groups[1].Value -gt 0) {
            throw "Compiler reported $($errors.Groups[1].Value) error(s). See the uploaded compile log."
          }

          if (!(Test-Path $ex5 -PathType Leaf) -or (Get-Item $ex5).Length -eq 0) {
            throw 'A fresh, non-empty EX5 file was not produced.'
          }

          Copy-Item $ex5 (Join-Path $out 'GoldHunterAI_V4.ex5') -Force
          Write-Host 'Compilation passed and EX5 output was created.'

      - name: Upload build results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GOLD-HUNTER-AI-V4-Build-Results
          path: build-output/
          if-no-files-found: warn
          retention-days: 14
