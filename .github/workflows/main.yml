name: GOLD HUNTER AI V4.11 Compiler

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - goldhunter-v4-safety-upgrade
    paths:
      - 'GoldHunterAI_V4_11.mq5'
      - '.github/workflows/main.yml'
      - 'Include/**'
      - 'Libraries/**'

permissions:
  contents: read

jobs:
  compile:
    name: Compile GoldHunterAI V4.11
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source file
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $source = Join-Path $env:GITHUB_WORKSPACE "GoldHunterAI_V4_11.mq5"
          $output = Join-Path $env:GITHUB_WORKSPACE "build-output"

          New-Item -ItemType Directory -Path $output -Force | Out-Null

          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "GoldHunterAI_V4_11.mq5 was not found."
          }

          $hash = (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash

          @(
              "Source: $source"
              "SHA256: $hash"
          ) | Out-File (Join-Path $output "source-diagnostics.txt") -Encoding utf8

          Write-Host "Source file verified: $source"
          Write-Host "SHA256: $hash"

      - name: Download and verify official MT5 installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"
          $url = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"

          Invoke-WebRequest -Uri $url -OutFile $installer

          $file = Get-Item -LiteralPath $installer

          if ($file.Length -lt 1MB) {
              throw "The MT5 installer is unexpectedly small."
          }

          $signature = Get-AuthenticodeSignature -FilePath $installer

          @(
              "Installer URL: $url"
              "Installer size: $($file.Length)"
              "Signature status: $($signature.Status)"
              "Signer: $($signature.SignerCertificate.Subject)"
          ) | Out-File (Join-Path $env:GITHUB_WORKSPACE "build-output\installer-diagnostics.txt") -Encoding utf8

          if ($signature.Status -ne "Valid") {
              throw "The MT5 installer signature is not valid."
          }

          Write-Host "Official installer signature verified."

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"

          $process = Start-Process -FilePath $installer -ArgumentList "/auto" -Wait -PassThru

          Write-Host "Installer exit code: $($process.ExitCode)"

          $searchRoots = @(
              "C:\MT5",
              "C:\Program Files\MetaTrader 5",
              "C:\Program Files (x86)\MetaTrader 5",
              "$env:APPDATA\MetaQuotes\Terminal"
          )

          $editor = $null
          $terminal = $null

          foreach ($root in $searchRoots) {
              if (-not (Test-Path -LiteralPath $root -PathType Container)) {
                  continue
              }

              if (-not $editor) {
                  $match = Get-ChildItem -LiteralPath $root -Filter "MetaEditor64.exe" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1

                  if ($match) {
                      $editor = $match.FullName
                  }
              }

              if (-not $terminal) {
                  $match = Get-ChildItem -LiteralPath $root -Filter "terminal64.exe" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1

                  if ($match) {
                      $terminal = $match.FullName
                  }
              }

              if ($editor -and $terminal) {
                  break
              }
          }

          @(
              "Installer exit code: $($process.ExitCode)"
              "MetaEditor path: $editor"
              "Terminal path: $terminal"
          ) | Out-File (Join-Path $env:GITHUB_WORKSPACE "build-output\installation-diagnostics.txt") -Encoding utf8

          if (-not $editor) {
              throw "MetaEditor64.exe was not found."
          }

          if (-not $terminal) {
              throw "terminal64.exe was not found."
          }

          "METAEDITOR_PATH=$editor" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "MT5_TERMINAL_PATH=$terminal" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Initialize terminal and locate official MQL5 library
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $terminal = $env:MT5_TERMINAL_PATH
          $installDir = Split-Path -Parent $terminal

          $init = Start-Process -FilePath $terminal -ArgumentList "/portable" -PassThru
          Start-Sleep -Seconds 15

          if (-not $init.HasExited) {
              Stop-Process -Id $init.Id -Force -ErrorAction SilentlyContinue
          }

          $searchRoots = @(
              (Join-Path $installDir "MQL5\Include"),
              (Join-Path $env:APPDATA "MetaQuotes\Terminal"),
              (Join-Path $env:LOCALAPPDATA "MetaQuotes\Terminal"),
              "C:\Program Files\MetaTrader 5\MQL5\Include",
              "C:\Program Files (x86)\MetaTrader 5\MQL5\Include"
          )

          $sourceInclude = $null

          foreach ($root in $searchRoots) {
              if (-not (Test-Path -LiteralPath $root -PathType Container)) {
                  continue
              }

              if ((Split-Path $root -Leaf) -eq "Include") {
                  $tradeFile = Join-Path $root "Trade\Trade.mqh"

                  if (Test-Path -LiteralPath $tradeFile -PathType Leaf) {
                      $sourceInclude = $root
                      break
                  }
              }
              else {
                  $match = Get-ChildItem -LiteralPath $root -Filter "Trade.mqh" -File -Recurse -ErrorAction SilentlyContinue |
                      Where-Object {
                          $_.FullName -match '\\MQL5\\Include\\Trade\\Trade\.mqh$'
                      } |
                      Select-Object -First 1

                  if ($match) {
                      $sourceInclude = Split-Path -Parent (Split-Path -Parent $match.FullName)
                      break
                  }
              }
          }

          if (-not $sourceInclude) {
              throw "Official MQL5 Include library containing Trade\Trade.mqh was not found."
          }

          $sourceTrade = Join-Path $sourceInclude "Trade\Trade.mqh"
          $destinationInclude = Join-Path $installDir "MQL5\Include"

          New-Item -ItemType Directory -Path $destinationInclude -Force | Out-Null

          $sourceHash = (Get-FileHash -LiteralPath $sourceTrade -Algorithm SHA256).Hash
          $copyLog = Join-Path $env:GITHUB_WORKSPACE "build-output\include-copy.log"

          & robocopy $sourceInclude $destinationInclude /E /COPY:DAT /R:2 /W:1 /NFL /NDL /NP "/LOG:$copyLog"
          $copyCode = $LASTEXITCODE

          if ($copyCode -ge 8) {
              throw "Official Include library copy failed. Robocopy exit code: $copyCode"
          }

          $destinationTrade = Join-Path $destinationInclude "Trade\Trade.mqh"

          if (-not (Test-Path -LiteralPath $destinationTrade -PathType Leaf)) {
              throw "Trade.mqh is missing from the installation Include directory."
          }

          $destinationHash = (Get-FileHash -LiteralPath $destinationTrade -Algorithm SHA256).Hash

          if ($sourceHash -ne $destinationHash) {
              throw "Trade.mqh hash verification failed."
          }

          @(
              "Terminal: $terminal"
              "Installation directory: $installDir"
              "Source Include: $sourceInclude"
              "Destination Include: $destinationInclude"
              "Trade.mqh SHA256: $destinationHash"
              "Hashes match: True"
          ) | Out-File (Join-Path $env:GITHUB_WORKSPACE "build-output\library-sync-diagnostics.txt") -Encoding utf8

          "MT5_INSTALL_DIR=$installDir" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "MT5_INCLUDE_DIR=$destinationInclude" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Official MQL5 Include library verified."

      - name: Compile GoldHunterAI V4.11
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $workspace = $env:GITHUB_WORKSPACE
          $source = Join-Path $workspace "GoldHunterAI_V4_11.mq5"
          $editor = $env:METAEDITOR_PATH
          $log = Join-Path $workspace "build-output\GoldHunterAI_V4_11_compile.log"

          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "EA source file not found: $source"
          }

          if (-not (Test-Path -LiteralPath $editor -PathType Leaf)) {
              throw "MetaEditor not found: $editor"
          }

          if (-not (Test-Path -LiteralPath $env:MT5_INCLUDE_DIR -PathType Container)) {
              throw "Verified Include directory not found: $env:MT5_INCLUDE_DIR"
          }

          $tradeFile = Join-Path $env:MT5_INCLUDE_DIR "Trade\Trade.mqh"

          if (-not (Test-Path -LiteralPath $tradeFile -PathType Leaf)) {
              throw "Trade.mqh is missing: $tradeFile"
          }

          $dataDirectory = $env:MT5_INSTALL_DIR
          $expertsDirectory = Join-Path $dataDirectory "MQL5\Experts"

          New-Item -ItemType Directory -Path $expertsDirectory -Force | Out-Null

          $compileSource = Join-Path $expertsDirectory "GoldHunterAI_V4_11.mq5"
          $compileOutput = Join-Path $expertsDirectory "GoldHunterAI_V4_11.ex5"

          Copy-Item -LiteralPath $source -Destination $compileSource -Force

          if (Test-Path -LiteralPath $compileOutput -PathType Leaf) {
              Remove-Item -LiteralPath $compileOutput -Force
          }

          @(
              "MetaEditor: $editor"
              "Compile source: $compileSource"
              "Include directory: $env:MT5_INCLUDE_DIR"
              "Trade.mqh: $tradeFile"
          ) | Out-File (Join-Path $workspace "build-output\compile-path-diagnostics.txt") -Encoding utf8

          $arguments = "/compile:`"$compileSource`" /log:`"$log`""

          $process = Start-Process -FilePath $editor -ArgumentList $arguments -Wait -PassThru

          Write-Host "MetaEditor exit code: $($process.ExitCode)"

          if (-not (Test-Path -LiteralPath $log -PathType Leaf)) {
              throw "MetaEditor did not create a compiler log."
          }

          Get-Content -LiteralPath $log
          $logText = Get-Content -LiteralPath $log -Raw

          $result = [regex]::Match(
              $logText,
              'Result:\s*(\d+)\s+errors?,\s*(\d+)\s+warnings?',
              [System.Text.RegularExpressions.RegexOptions]::IgnoreCase
          )

          if (-not $result.Success) {
              throw "Compiler log has no recognizable final Result line."
          }

          $errors = [int]$result.Groups[1].Value
          $warnings = [int]$result.Groups[2].Value

          if ($errors -ne 0) {
              throw "Compilation failed: $errors error(s), $warnings warning(s)."
          }

          if (-not (Test-Path -LiteralPath $compileOutput -PathType Leaf)) {
              throw "Zero compiler errors reported, but EX5 output was not created."
          }

          $size = (Get-Item -LiteralPath $compileOutput).Length

          if ($size -le 0) {
              throw "The EX5 output file is empty."
          }

          Copy-Item -LiteralPath $compileOutput -Destination (Join-Path $workspace "build-output\GoldHunterAI_V4_11.ex5") -Force

          @(
              "Compiler errors: $errors"
              "Compiler warnings: $warnings"
              "EX5 size: $size bytes"
              "Build status: Success"
          ) | Out-File (Join-Path $workspace "build-output\build-summary.txt") -Encoding utf8

      - name: Upload build diagnostics and compiled file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GOLD-HUNTER-AI-V4-11-Build-Results
          path: build-output/
          if-no-files-found: warn
