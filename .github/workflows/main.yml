name: GOLD HUNTER AI V4.11 Compiler

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - goldhunter-v4-safety-upgrade
    paths:
      - 'GoldHunterAI_V4_11.mq5'
      - '.github/workflows/main.yml'
      - 'Include/**'
      - 'Libraries/**'

permissions:
  contents: read

jobs:
  compile:
    name: Compile GoldHunterAI V4.11
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source file
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $source = Join-Path $env:GITHUB_WORKSPACE "GoldHunterAI_V4_11.mq5"

          New-Item -ItemType Directory -Path "build-output" -Force | Out-Null

          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "GoldHunterAI_V4_11.mq5 was not found."
          }

          @(
              "Source: $source"
              "SHA256: $((Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash)"
          ) | Out-File "build-output/source-diagnostics.txt" -Encoding utf8

      - name: Download and verify official MT5 installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"
          $url = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"

          Invoke-WebRequest -Uri $url -OutFile $installer

          if ((Get-Item -LiteralPath $installer).Length -lt 1MB) {
              throw "MT5 installer is unexpectedly small."
          }

          $signature = Get-AuthenticodeSignature -FilePath $installer

          @(
              "Installer: $url"
              "Signature status: $($signature.Status)"
              "Signer: $($signature.SignerCertificate.Subject)"
          ) | Out-File "build-output/installer-diagnostics.txt" -Encoding utf8

          if ($signature.Status -ne "Valid") {
              throw "MT5 installer signature is not valid."
          }

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"

          $process = Start-Process -FilePath $installer -ArgumentList "/auto" -Wait -PassThru
          Write-Host "Installer exit code: $($process.ExitCode)"

          $searchRoots = @(
              "C:\MT5",
              "C:\Program Files\MetaTrader 5",
              "C:\Program Files (x86)\MetaTrader 5",
              "$env:APPDATA\MetaQuotes\Terminal"
          )

          $editor = $null
          $terminal = $null

          foreach ($root in $searchRoots) {
              if (-not (Test-Path -LiteralPath $root -PathType Container)) {
                  continue
              }

              if (-not $editor) {
                  $candidate = Get-ChildItem -LiteralPath $root `
                      -Filter "MetaEditor64.exe" -File -Recurse `
                      -ErrorAction SilentlyContinue |
                      Select-Object -First 1

                  if ($candidate) {
                      $editor = $candidate.FullName
                  }
              }

              if (-not $terminal) {
                  $candidate = Get-ChildItem -LiteralPath $root `
                      -Filter "terminal64.exe" -File -Recurse `
                      -ErrorAction SilentlyContinue |
                      Select-Object -First 1

                  if ($candidate) {
                      $terminal = $candidate.FullName
                  }
              }

              if ($editor -and $terminal) {
                  break
              }
          }

          @(
              "Installer exit code: $($process.ExitCode)"
              "MetaEditor path: $editor"
              "Terminal path: $terminal"
          ) | Out-File "build-output/installation-diagnostics.txt" -Encoding utf8

          if (-not $editor) {
              throw "MetaEditor64.exe was not found."
          }

          if (-not $terminal) {
              throw "terminal64.exe was not found."
          }

          "METAEDITOR_PATH=$editor" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "MT5_TERMINAL_PATH=$terminal" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Initialize terminal and locate official MQL5 library
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $terminal = $env:MT5_TERMINAL_PATH
          $installDir = Split-Path -Parent $terminal

          $terminalProcess = Start-Process -FilePath $terminal `
              -ArgumentList "/portable" -PassThru

          Start-Sleep -Seconds 15

          if (-not $terminalProcess.HasExited) {
              Stop-Process -Id $terminalProcess.Id -Force -ErrorAction SilentlyContinue
          }

          $searchRoots = @(
              (Join-Path $installDir "MQL5\Include"),
              (Join-Path $env:APPDATA "MetaQuotes\Terminal"),
              (Join-Path $env:LOCALAPPDATA "MetaQuotes\Terminal"),
              "C:\Program Files\MetaTrader 5\MQL5\Include",
              "C:\Program Files (x86)\MetaTrader 5\MQL5\Include"
          ) | Select-Object -Unique

          $sourceInclude = $null

          foreach ($root in $searchRoots) {
              if (-not (Test-Path -LiteralPath $root -PathType Container)) {
                  continue
              }

              if ((Split-Path $root -Leaf) -eq "Include") {
                  $tradeFile = Join-Path $root "Trade\Trade.mqh"

                  if (Test-Path -LiteralPath $tradeFile -PathType Leaf) {
                      $sourceInclude = $root
                      break
                  }
              }
              else {
                  $found = Get-ChildItem -LiteralPath $root `
                      -Filter "Trade.mqh" -File -Recurse `
                      -ErrorAction SilentlyContinue |
                      Where-Object {
                          $_.FullName -match '\\MQL5\\Include\\Trade\\Trade\.mqh$'
                      } |
                      Select-Object -First 1

                  if ($found) {
                      $sourceInclude = Split-Path -Parent (
                          Split-Path -Parent $found.FullName
                      )
                      break
                  }
              }
          }

          if (-not $sourceInclude) {
              throw "Official MQL5 Include directory containing Trade\Trade.mqh was not found."
          }

          $sourceTrade = Join-Path $sourceInclude "Trade\Trade.mqh"
          $destinationInclude = Join-Path $installDir "MQL5\Include"

          New-Item -ItemType Directory -Path $destinationInclude -Force | Out-Null

          $sourceHash = (Get-FileHash -LiteralPath $sourceTrade -Algorithm SHA256).Hash

          $copyLog = Join-Path $env:GITHUB_WORKSPACE "build-output\include-copy.log"

          & robocopy $sourceInclude $destinationInclude /E /COPY:DAT /R:2 /W:1 /NFL /NDL /NP "/LOG:$copyLog"
          $copyCode = $LASTEXITCODE

          if ($copyCode -ge 8) {
              throw "Include library copy failed. Robocopy exit code: $copyCode"
          }

          $destinationTrade = Join-Path $destinationInclude "Trade\Trade.mqh"

          if (-not (Test-Path -LiteralPath $destinationTrade -PathType Leaf)) {
              throw "Trade.mqh is missing from the installation Include directory."
          }

          $destinationHash = (Get-FileHash -LiteralPath $destinationTrade -Algorithm SHA256).Hash

          if ($sourceHash -ne $destinationHash) {
              throw "Trade.mqh verification failed: hashes differ."
          }

          @(
              "Terminal: $terminal"
              "Installation directory: $installDir"
              "Source Include directory: $sourceInclude"
              "Destination Include directory: $destinationInclude"
              "Source Trade.mqh SHA256: $sourceHash"
              "Destination Trade.mqh SHA256: $destinationHash"
              "Hashes match: True"
              "Robocopy exit code: $copyCode"
          ) | Out-File "build-output/library-sync-diagnostics.txt" -Encoding utf8

          Write-Host "Trade.mqh found and hash-verified."
      - name: Compile GoldHunterAI V4.11
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $source = Join-Path $env:GITHUB_WORKSPACE "GoldHunterAI_V4_11.mq5"
          $editor = $env:METAEDITOR_PATH
          $log = Join-Path $env:GITHUB_WORKSPACE "build-output\GoldHunterAI_V4_11_compile.log"
          $workspaceOutput = Join-Path $env:GITHUB_WORKSPACE "GoldHunterAI_V4_11.ex5"

          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Source EA file not found: $source"
          }

          if (-not (Test-Path -LiteralPath $editor -PathType Leaf)) {
              throw "MetaEditor was not found: $editor"
          }

          # Find the active terminal data directory containing the synchronized library.
          $terminalRoots = @(
              (Join-Path $env:APPDATA "MetaQuotes\Terminal"),
              (Join-Path $env:LOCALAPPDATA "MetaQuotes\Terminal")
          )

          $dataDirectory = $null

          foreach ($root in $terminalRoots) {
              if (-not (Test-Path -LiteralPath $root -PathType Container)) {
                  continue
              }

              $candidate = Get-ChildItem -LiteralPath $root -Directory `
                  -ErrorAction SilentlyContinue |
                  Where-Object {
                      Test-Path -LiteralPath (
                          Join-Path $_.FullName "MQL5\Include\Trade\Trade.mqh"
                      ) -PathType Leaf
                  } |
                  Select-Object -First 1

              if ($candidate) {
                  $dataDirectory = $candidate.FullName
                  break
              }
          }

          if (-not $dataDirectory) {
              throw "No terminal data directory containing MQL5\Include\Trade\Trade.mqh was found."
          }

          $expertsDirectory = Join-Path $dataDirectory "MQL5\Experts"
          New-Item -ItemType Directory -Path $expertsDirectory -Force | Out-Null

          $compileSource = Join-Path $expertsDirectory "GoldHunterAI_V4_11.mq5"
          $compileOutput = Join-Path $expertsDirectory "GoldHunterAI_V4_11.ex5"

          Copy-Item -LiteralPath $source -Destination $compileSource -Force

          if (Test-Path -LiteralPath $compileOutput) {
              Remove-Item -LiteralPath $compileOutput -Force
          }

          if (Test-Path -LiteralPath $workspaceOutput) {
              Remove-Item -LiteralPath $workspaceOutput -Force
          }

          @(
              "MetaEditor: $editor"
              "Terminal data directory: $dataDirectory"
              "Include library: $(Join-Path $dataDirectory 'MQL5\Include')"
              "Compile source: $compileSource"
          ) | Out-File "build-output/compile-path-diagnostics.txt" -Encoding utf8

          $arguments = "/compile:`"$compileSource`" /log:`"$log`""

          $process = Start-Process -FilePath $editor `
              -ArgumentList $arguments -Wait -PassThru

          Write-Host "MetaEditor exit code: $($process.ExitCode)"

          if (-not (Test-Path -LiteralPath $log -PathType Leaf)) {
              throw "MetaEditor did not create a compile log."
          }

          Get-Content -LiteralPath $log
          $logText = Get-Content -LiteralPath $log -Raw

          $result = [regex]::Match(
              $logText,
              'Result:\s*(\d+)\s+errors?,\s*(\d+)\s+warnings?',
              [System.Text.RegularExpressions.RegexOptions]::IgnoreCase
          )

          if (-not $result.Success) {
              throw "Could not find the compiler's final Result line."
          }

          $errors = [int]$result.Groups[1].Value
          $warnings = [int]$result.Groups[2].Value

          if ($errors -ne 0) {
              throw "Compilation failed: $errors error(s), $warnings warning(s)."
          }

          if (-not (Test-Path -LiteralPath $compileOutput -PathType Leaf)) {
              throw "Compiler reported zero errors but produced no EX5 file."
          }

          $size = (Get-Item -LiteralPath $compileOutput).Length

          if ($size -le 0) {
              throw "The compiled EX5 file is empty."
          }

          Copy-Item -LiteralPath $compileOutput `
              -Destination "build-output\GoldHunterAI_V4_11.ex5" -Force

          Copy-Item -LiteralPath $compileOutput `
              -Destination $workspaceOutput -Force

          @(
              "Compiler errors: $errors"
              "Compiler warnings: $warnings"
              "EX5 size: $size bytes"
              "Compiled source: $compileSource"
              "Build status: Success"
          ) | Out-File "build-output/build-summary.txt" -Encoding utf8
      - name: Upload build diagnostics and compiled file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GOLD-HUNTER-AI-V4-11-Build-Results
          path: build-output/
          if-no-files-found: warn
