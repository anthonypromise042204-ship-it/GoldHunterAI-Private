name: GOLD HUNTER AI V4.11 Compiler

on:
workflow_dispatch:
push:
branches:
- main
- goldhunter-v4-safety-upgrade
paths:
- 'GoldHunterAI_V4_11.mq5'
- '.github/workflows/main.yml'

permissions:
contents: read

jobs:
compile:
name: Install MetaTrader 5 and compile V4.11
runs-on: windows-latest
timeout-minutes: 30

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Verify source file and safety defaults
    shell: pwsh
    run: |
      $source = Join-Path $env:GITHUB_WORKSPACE 'GoldHunterAI_V4_11.mq5'

      if (!(Test-Path $source)) {
        throw "Source file not found: $source"
      }

      $code = Get-Content $source -Raw

      if ($code -notmatch '(?i)\bEnableTrading\s*=\s*false\b') {
        throw "Safety check failed: EnableTrading=false was not found."
      }

      if ($code -notmatch '(?i)\bDemoOnly\s*=\s*true\b') {
        throw "Safety check failed: DemoOnly=true was not found."
      }

      if ($code -notmatch '#include\s*<Trade\\Trade\.mqh>') {
        throw "Expected #include <Trade\Trade.mqh> was not found."
      }

      Write-Host "Source file exists."
      Write-Host "Safety defaults verified."
      Get-FileHash $source -Algorithm SHA256

  - name: Download official MetaTrader 5 installer
    shell: pwsh
    run: |
      $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
      $uri = 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe'

      Invoke-WebRequest -Uri $uri -OutFile $installer

      if (!(Test-Path $installer) -or
          (Get-Item $installer).Length -lt 1MB) {
        throw "The MetaTrader installer download is missing or too small."
      }

      $signature = Get-AuthenticodeSignature $installer

      if ($signature.Status -ne 'Valid') {
        throw "Installer signature verification failed: $($signature.Status)"
      }

      Write-Host "Official installer downloaded and signature verified."

  - name: Install MetaTrader 5
    shell: pwsh
    run: |
      $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

      $process = Start-Process `
        -FilePath $installer `
        -ArgumentList '/auto' `
        -PassThru `
        -Wait

      Write-Host "Installer exit code: $($process.ExitCode)"

      $editor = Get-ChildItem 'C:\Program Files',
                              'C:\Program Files (x86)' `
        -Filter 'MetaEditor64.exe' `
        -File -Recurse -ErrorAction SilentlyContinue |
        Select-Object -First 1

      if (!$editor) {
        throw "MetaEditor64.exe was not found after installation."
      }

      "METAEDITOR_PATH=$($editor.FullName)" |
        Out-File $env:GITHUB_ENV -Append

      "MT5_INSTALL_ROOT=$($editor.Directory.FullName)" |
        Out-File $env:GITHUB_ENV -Append

      Write-Host "MetaEditor found: $($editor.FullName)"

  - name: Locate a compatible MQL5 Standard Library
    shell: pwsh
    run: |
      $roots = @(
        $env:MT5_INSTALL_ROOT,
        (Join-Path $env:MT5_INSTALL_ROOT 'MQL5'),
        (Join-Path $env:APPDATA 'MetaQuotes\Terminal')
      ) | Where-Object { $_ -and (Test-Path $_) }

      $tradeHeaders = foreach ($root in $roots) {
        Get-ChildItem -Path $root `
          -Filter 'Trade.mqh' `
          -File -Recurse `
          -ErrorAction SilentlyContinue
      }

      $tradeHeader = $tradeHeaders |
        Where-Object {
          $_.FullName -match '\\MQL5\\Include\\Trade\\Trade\.mqh$'
        } |
        Select-Object -First 1

      if (!$tradeHeader) {
        New-Item -ItemType Directory `
          -Path build-output -Force | Out-Null

        @"
        Trade.mqh was not found in an expected MQL5\Include\Trade folder.
        No third-party library was substituted.
        MetaEditor: $env:METAEDITOR_PATH
        Installation root: $env:MT5_INSTALL_ROOT
        "@ | Set-Content build-output\library-diagnostic.txt

        throw "Compatible Trade.mqh not found. See the diagnostic artifact."
      }

      $includeRoot = $tradeHeader.FullName.Substring(
        0,
        $tradeHeader.FullName.IndexOf('\Trade\Trade.mqh')
      )

      "MT5_INCLUDE_ROOT=$includeRoot" |
        Out-File $env:GITHUB_ENV -Append

      Write-Host "Standard Library include root: $includeRoot"
      Write-Host "Trade.mqh: $($tradeHeader.FullName)"

  - name: Compile GoldHunterAI V4.11
    shell: pwsh
    run: |
      New-Item -ItemType Directory `
        -Path build-output -Force | Out-Null

      $source = Join-Path $env:GITHUB_WORKSPACE 'GoldHunterAI_V4_11.mq5'
      $log = Join-Path $env:GITHUB_WORKSPACE 'build-output\GoldHunterAI_V4_11_compile.log'
      $ex5 = Join-Path $env:GITHUB_WORKSPACE 'GoldHunterAI_V4_11.ex5'

      if (Test-Path $ex5) {
        Remove-Item $ex5 -Force
      }

      $arguments = @(
        "/compile:`"$source`""
        "/include:`"$env:MT5_INCLUDE_ROOT`""
        "/log:`"$log`""
      ) -join ' '

      Write-Host "Running MetaEditor compiler..."
      $process = Start-Process `
        -FilePath $env:METAEDITOR_PATH `
        -ArgumentList $arguments `
        -PassThru `
        -Wait

      Write-Host "MetaEditor process exit code: $($process.ExitCode)"

      Start-Sleep -Seconds 2

      if (!(Test-Path $log)) {
        throw "Compilation log was not created."
      }

      Copy-Item $log build-output\GoldHunterAI_V4_11_compile.log -Force
      Get-Content $log

      $logText = Get-Content $log -Raw

      if ($logText -match '(?i)\b\d+\s+errors?\b' -and
          $logText -notmatch '(?i)\b0\s+errors?\b') {
        throw "Compiler log reports one or more errors."
      }

      if (!(Test-Path $ex5) -or (Get-Item $ex5).Length -eq 0) {
        throw "A nonempty GoldHunterAI_V4_11.ex5 file was not produced."
      }

      Copy-Item $ex5 build-output\GoldHunterAI_V4_11.ex5 -Force

      Get-FileHash $ex5 -Algorithm SHA256 |
        Format-List |
        Out-File build-output\ex5-sha256.txt

      Write-Host "Compilation output exists and is nonempty."

  - name: Upload build diagnostics and output
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: GoldHunterAI-V4.11-Build-Results
      path: |
        build-output/**
        GoldHunterAI_V4_11.ex5
      if-no-files-found: warn
      retention-days: 14
