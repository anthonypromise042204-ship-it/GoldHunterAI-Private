name: GOLD HUNTER AI V4.11 Compiler

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - goldhunter-v4-safety-upgrade
    paths:
      - 'GoldHunterAI_V4_11.mq5'
      - '.github/workflows/main.yml'
      - 'Include/**'
      - 'Libraries/**'

permissions:
  contents: read

jobs:
  compile:
    name: Compile GoldHunterAI V4.11
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source file
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $source = Join-Path $env:GITHUB_WORKSPACE "GoldHunterAI_V4_11.mq5"

          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "GoldHunterAI_V4_11.mq5 was not found in the repository root."
          }

          $hash = (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash
          New-Item -ItemType Directory -Path "build-output" -Force | Out-Null

          @(
              "Source: $source"
              "SHA256: $hash"
          ) | Out-File "build-output/source-diagnostics.txt" -Encoding utf8

          Write-Host "Source SHA256: $hash"

      - name: Download and verify official MT5 installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"
          $url = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"

          Invoke-WebRequest -Uri $url -OutFile $installer

          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
              throw "The MetaTrader 5 installer was not downloaded."
          }

          if ((Get-Item -LiteralPath $installer).Length -lt 1MB) {
              throw "The installer is unexpectedly small."
          }

          $signature = Get-AuthenticodeSignature -FilePath $installer
          Write-Host "Installer signature: $($signature.Status)"

          if ($signature.Status -ne "Valid") {
              throw "Installer signature is not valid. Refusing to execute it."
          }

          "Installer signature: $($signature.Status)" |
              Out-File "build-output/installer-diagnostics.txt" -Encoding utf8

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"

          $process = Start-Process `
              -FilePath $installer `
              -ArgumentList "/auto" `
              -Wait `
              -PassThru

          Write-Host "Installer exit code: $($process.ExitCode)"

          $editorCandidates = @(
              "C:\MT5\MetaEditor64.exe",
              "C:\Program Files\MetaTrader 5\MetaEditor64.exe",
              "C:\Program Files (x86)\MetaTrader 5\MetaEditor64.exe"
          )

          $terminalCandidates = @(
              "C:\MT5\terminal64.exe",
              "C:\Program Files\MetaTrader 5\terminal64.exe",
              "C:\Program Files (x86)\MetaTrader 5\terminal64.exe"
          )

          $editor = $editorCandidates |
              Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } |
              Select-Object -First 1

          $terminal = $terminalCandidates |
              Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } |
              Select-Object -First 1

          if (-not $editor) {
              throw "MetaEditor64.exe was not found in the checked locations."
          }

          if (-not $terminal) {
              throw "terminal64.exe was not found in the checked locations."
          }

          "METAEDITOR_PATH=$editor" |
              Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "MT5_TERMINAL_PATH=$terminal" |
              Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "MetaEditor: $editor"
          Write-Host "Terminal: $terminal"

      - name: Locate official standard library
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $terminal = $env:MT5_TERMINAL_PATH
          $installDir = Split-Path -Parent $terminal
          $editorDir = Split-Path -Parent $env:METAEDITOR_PATH

          $candidateIncludes = @(
              (Join-Path $installDir "MQL5\Include"),
              (Join-Path $editorDir "MQL5\Include"),
              (Join-Path $env:APPDATA "MetaQuotes\Terminal")
          )

          $tradeFile = $null

          foreach ($candidate in $candidateIncludes) {
              if (-not (Test-Path -LiteralPath $candidate)) {
                  continue
              }

              if ($candidate -like "*\Terminal") {
                  $tradeFile = Get-ChildItem `
                      -Path $candidate `
                      -Filter "Trade.mqh" `
                      -File `
                      -Recurse `
                      -ErrorAction SilentlyContinue |
                      Where-Object { $_.FullName -match "\\MQL5\\Include\\Trade\\Trade\.mqh$" } |
                      Select-Object -First 1
              }
              else {
                  $expected = Join-Path $candidate "Trade\Trade.mqh"
                  if (Test-Path -LiteralPath $expected -PathType Leaf) {
                      $tradeFile = Get-Item -LiteralPath $expected
                  }
              }

              if ($tradeFile) {
                  break
              }
          }

          if (-not $tradeFile) {
              throw "Official Trade.mqh was not found. Stopping without downloading an unverified replacement."
          }

          $includeRoot = Split-Path -Parent (Split-Path -Parent $tradeFile.FullName)

          @(
              "Trade.mqh: $($tradeFile.FullName)"
              "Include root: $includeRoot"
          ) | Out-File "build-output/library-diagnostics.txt" -Encoding utf8

          Write-Host "Verified Trade.mqh: $($tradeFile.FullName)"
          Write-Host "Include root: $includeRoot"

      - name: Compile GoldHunterAI V4.11
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $source = Join-Path $env:GITHUB_WORKSPACE "GoldHunterAI_V4_11.mq5"
          $editor = $env:METAEDITOR_PATH
          $log = Join-Path $env:GITHUB_WORKSPACE "build-output\GoldHunterAI_V4_11_compile.log"
          $output = Join-Path $env:GITHUB_WORKSPACE "GoldHunterAI_V4_11.ex5"

          if (Test-Path -LiteralPath $output) {
              Remove-Item -LiteralPath $output -Force
          }

          $arguments = "/compile:`"$source`" /log:`"$log`""
          $process = Start-Process `
              -FilePath $editor `
              -ArgumentList $arguments `
              -Wait `
              -PassThru

          Write-Host "MetaEditor exit code: $($process.ExitCode)"

          if (Test-Path -LiteralPath $log -PathType Leaf) {
              Get-Content -LiteralPath $log
          }
          else {
              throw "MetaEditor did not create a compile log."
          }

          $logText = Get-Content -LiteralPath $log -Raw
          $result = [regex]::Match(
              $logText,
              'Result:\s*(\d+)\s+errors?,\s*(\d+)\s+warnings?',
              [System.Text.RegularExpressions.RegexOptions]::IgnoreCase
          )

          if (-not $result.Success) {
              throw "Could not find the compiler's final Result line."
          }

          $errors = [int]$result.Groups[1].Value
          $warnings = [int]$result.Groups[2].Value

          if ($errors -ne 0) {
              throw "Compilation failed with $errors error(s) and $warnings warning(s)."
          }

          if (-not (Test-Path -LiteralPath $output -PathType Leaf)) {
              throw "Compilation reported zero errors, but the EX5 file was not created."
          }

          if ((Get-Item -LiteralPath $output).Length -le 0) {
              throw "The generated EX5 file is empty."
          }

          Copy-Item -LiteralPath $log -Destination "build-output\GoldHunterAI_V4_11_compile.log" -Force
          Copy-Item -LiteralPath $output -Destination "build-output\GoldHunterAI_V4_11.ex5" -Force

          @(
              "Compiler errors: $errors"
              "Compiler warnings: $warnings"
              "EX5 size: $((Get-Item -LiteralPath $output).Length) bytes"
          ) | Out-File "build-output\build-summary.txt" -Encoding utf8

      - name: Upload build diagnostics and compiled file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GOLD-HUNTER-AI-V4-11-Build-Results
          path: build-output/
          if-no-files-found: warn
