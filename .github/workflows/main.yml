name: GOLD HUNTER AI Compiler

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify EA Source
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "GoldHunterAI_V3_4.mq5"
          if (!(Test-Path $source)) {
            throw "GoldHunterAI_V3_4.mq5 is missing from the repository root."
          }
          Write-Host "EA source found."
