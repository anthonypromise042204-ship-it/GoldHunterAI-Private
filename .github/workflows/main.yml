name: GOLD HUNTER AI V4 Compiler

on:
  push:
    branches: [main, master]
    paths:
      - '**.mq5'
      - '**.mqh'
      - '.github/workflows/main.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gold-hunter-ai-v4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile GoldHunterAI V4
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate EA source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $ea = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter 'GoldHunterAI_V4.mq5' `
            -File -Recurse |
            Where-Object {
              $_.FullName -notmatch '[\\/]\.git[\\/]'
            } |
            Select-Object -First 1

          if (-not $ea) {
            throw 'GoldHunterAI_V4.mq5 was not found in the repository.'
          }

          "EA_SOURCE=$($ea.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "EA source: $($ea.FullName)"

      - name: Install or locate MetaEditor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $searchRoots = @(
            'C:\MT5',
            'C:\Program Files\MetaTrader 5',
            'C:\Program Files (x86)\MetaTrader 5'
          )

          $editor = $null

          foreach ($root in $searchRoots) {
            foreach ($name in @('metaeditor64.exe', 'metaeditor.exe')) {
              $candidate = Join-Path $root $name

              if (Test-Path -LiteralPath $candidate) {
                $editor = $candidate
                break
              }
            }

            if ($editor) { break }
          }

          if (-not $editor) {
            $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

            $url = 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe'

            Invoke-WebRequest -Uri $url -OutFile $installer

            $process = Start-Process `
              -FilePath $installer `
              -ArgumentList @('/auto', '/path:C:\MT5') `
              -Wait -PassThru

            Write-Host "Installer exit code: $($process.ExitCode)"

            foreach ($name in @('metaeditor64.exe', 'metaeditor.exe')) {
              $candidate = Join-Path 'C:\MT5' $name

              if (Test-Path -LiteralPath $candidate) {
                $editor = $candidate
                break
              }
            }
          }

          if (-not $editor) {
            throw 'MetaEditor could not be found after installation.'
          }

          "METAEDITOR_PATH=$editor" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "MT5_ROOT=$(Split-Path $editor -Parent)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "MetaEditor: $editor"

      - name: Prepare terminal directories and library
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $terminalRoot = Join-Path `
            $env:APPDATA `
            'MetaQuotes\Terminal'

          New-Item -ItemType Directory `
            -Path $terminalRoot -Force | Out-Null

          # Only use actual terminal hash directories.
          # Do not mistake Terminal\Common for a terminal instance.
          $terminals = @(
            Get-ChildItem -Path $terminalRoot -Directory |
            Where-Object {
              $_.Name -match '^[A-Fa-f0-9]{32}$' -and
              (Test-Path (Join-Path $_.FullName 'MQL5'))
            }
          )

          if ($terminals.Count -eq 0) {
            $hash = 'E23367DD11DBEB0EF97D08185EAB7295'
            $fallback = Join-Path $terminalRoot $hash

            New-Item -ItemType Directory `
              -Path (Join-Path $fallback 'MQL5\Include') `
              -Force | Out-Null

            New-Item -ItemType Directory `
              -Path (Join-Path $fallback 'MQL5\Experts') `
              -Force | Out-Null

            $terminals = @(
              Get-Item -LiteralPath $fallback
            )
          }

          Write-Host "Terminal instances found: $($terminals.Count)"

          foreach ($terminal in $terminals) {
            Write-Host "Terminal: $($terminal.FullName)"
          }

          # Download the fallback Include tree.
          $mirror = Join-Path $env:RUNNER_TEMP 'mt5-docker'

          if (Test-Path $mirror) {
            Remove-Item $mirror -Recurse -Force
          }

          git clone --depth 1 `
            https://github.com/vmlellis/mt5-docker.git `
            $mirror

          if ($LASTEXITCODE -ne 0) {
            throw 'Could not download the fallback MQL5 library.'
          }

          $sourceTrade = Get-ChildItem `
            -Path $mirror `
            -Filter 'Trade.mqh' `
            -File -Recurse |
            Select-Object -First 1

          if (-not $sourceTrade) {
            throw 'Trade.mqh was not found in the downloaded repository.'
          }

          $sourceInclude = $sourceTrade.Directory.Parent.FullName

          if (-not (Test-Path (Join-Path $sourceInclude 'Object.mqh'))) {
            throw 'The downloaded Include tree is incomplete.'
          }

          # Install the include tree into each terminal hash directory.
          foreach ($terminal in $terminals) {
            $include = Join-Path $terminal.FullName 'MQL5\Include'

            New-Item -ItemType Directory `
              -Path $include -Force | Out-Null

            Copy-Item `
              -Path (Join-Path $sourceInclude '*') `
              -Destination $include `
              -Recurse -Force

            $trade = Join-Path $include 'Trade\Trade.mqh'

            if (-not (Test-Path -LiteralPath $trade)) {
              throw "Trade.mqh missing from $include"
            }

            Write-Host "Verified library: $trade"
          }

          # Also populate the installation Include folder.
          $installInclude = Join-Path $env:MT5_ROOT 'MQL5\Include'

          New-Item -ItemType Directory `
            -Path $installInclude -Force | Out-Null

          Copy-Item `
            -Path (Join-Path $sourceInclude '*') `
            -Destination $installInclude `
            -Recurse -Force

          # Copy EA and adjacent MQL files into every terminal Experts folder.
          $sourceDir = Split-Path $env:EA_SOURCE -Parent

          foreach ($terminal in $terminals) {
            $experts = Join-Path $terminal.FullName 'MQL5\Experts'

            New-Item -ItemType Directory `
              -Path $experts -Force | Out-Null

            Get-ChildItem -Path $sourceDir -File |
              Where-Object {
                $_.Extension -in '.mq5', '.mqh'
              } |
              ForEach-Object {
                Copy-Item `
                  -LiteralPath $_.FullName `
                  -Destination $experts `
                  -Force
              }

            $target = Join-Path $experts 'GoldHunterAI_V4.mq5'

            if (-not (Test-Path -LiteralPath $target)) {
              throw "EA copy failed: $target"
            }

            Write-Host "EA staged: $target"
          }

          # Compile from the installation tree; MetaEditor can resolve the
          # terminal data Include tree independently.
          $compileDir = Join-Path $env:MT5_ROOT 'MQL5\Experts'
          New-Item -ItemType Directory `
            -Path $compileDir -Force | Out-Null

          Copy-Item -LiteralPath $env:EA_SOURCE `
            -Destination (Join-Path $compileDir 'GoldHunterAI_V4.mq5') `
            -Force

          Get-ChildItem -Path $sourceDir -File |
            Where-Object { $_.Extension -eq '.mqh' } |
            ForEach-Object {
              Copy-Item $_.FullName -Destination $compileDir -Force
            }

          "EA_COMPILE_SOURCE=$(Join-Path $compileDir 'GoldHunterAI_V4.mq5')" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "MT5_TERMINAL_ROOT=$terminalRoot" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host 'Library and EA staging completed.'

      - name: Compile GoldHunterAI V4
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = $env:EA_COMPILE_SOURCE
          $log = Join-Path $env:GITHUB_WORKSPACE 'compile.log'

          if (-not (Test-Path -LiteralPath $source)) {
            throw "EA source not found: $source"
          }

          Write-Host "Compile source: $source"
          Write-Host "MetaEditor: $env:METAEDITOR_PATH"

          $process = Start-Process `
            -FilePath $env:METAEDITOR_PATH `
            -ArgumentList @(
              "/compile:$source",
              "/log:$log"
            ) `
            -Wait -PassThru

          Write-Host "MetaEditor process exit code: $($process.ExitCode)"

          Start-Sleep -Seconds 2

          if (-not (Test-Path -LiteralPath $log)) {
            throw 'MetaEditor did not produce compile.log.'
          }

          Get-Content -LiteralPath $log

          $logText = Get-Content -LiteralPath $log -Raw

          $output = [System.IO.Path]::ChangeExtension($source, '.ex5')

          if ($logText -match '(?im)\bResult:\s*[1-9]\s+errors?\b') {
            throw 'Compilation failed. Review the compiler errors above.'
          }

          if ($logText -notmatch '(?im)\bResult:\s*0\s+errors?\b') {
            throw 'Could not confirm a successful compilation from the compiler log.'
          }

          if (-not (Test-Path -LiteralPath $output)) {
            throw "Compilation reported no errors, but EX5 is missing: $output"
          }

          Write-Host "Compilation successful: $output"

      - name: Upload compiler results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GoldHunterAI-V4-compile-results
          if-no-files-found: warn
          path: |
            compile.log
            C:/MT5/MQL5/Experts/GoldHunterAI_V4.ex5
            C:/Users/runneradmin/AppData/Roaming/MetaQuotes/Terminal/**/MQL5/Experts/GoldHunterAI_V4.ex5
