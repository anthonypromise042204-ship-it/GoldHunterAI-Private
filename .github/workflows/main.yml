name: GOLD HUNTER AI Compiler

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify EA source
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "GoldHunterAI_V3_4.mq5"
          if (!(Test-Path $source -PathType Leaf)) {
            throw "GoldHunterAI_V3_4.mq5 was not found in the repository root."
          }
          if ((Get-Item $source).Length -eq 0) {
            throw "The EA source file is empty."
          }
          "EA_SOURCE=$source" >> $env:GITHUB_ENV
          Write-Host "Verified source: $source"

      - name: Download MetaTrader 5 installer
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"
          $url = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer -TimeoutSec 180
          if (!(Test-Path $installer -PathType Leaf) -or (Get-Item $installer).Length -lt 100000) {
            throw "MetaTrader 5 installer download failed or returned an invalid file."
          }
          "MT5_INSTALLER=$installer" >> $env:GITHUB_ENV
          Write-Host "Installer downloaded."

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "MT5"
          New-Item -ItemType Directory -Path $installDir -Force | Out-Null

          $p = Start-Process -FilePath $env:MT5_INSTALLER `
            -ArgumentList @("/auto", "/path:$installDir") -Wait -PassThru
          Write-Host "Installer exit code: $($p.ExitCode)"

          $editor = Get-ChildItem -Path $installDir -Filter "metaeditor64.exe" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          $terminal = Get-ChildItem -Path $installDir -Filter "terminal64.exe" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1

          if (!$editor -or !$terminal) {
            throw "MetaTrader installation did not produce both MetaEditor64.exe and terminal64.exe."
          }

          "METAEDITOR_PATH=$($editor.FullName)" >> $env:GITHUB_ENV
          "TERMINAL_PATH=$($terminal.FullName)" >> $env:GITHUB_ENV
          "MT5_INSTALL_DIR=$installDir" >> $env:GITHUB_ENV
          Write-Host "MetaEditor: $($editor.FullName)"
          Write-Host "Terminal: $($terminal.FullName)"

      - name: Initialize terminal and locate standard Trade library
        shell: pwsh
        run: |
          $terminal = $env:TERMINAL_PATH
          $installDir = $env:MT5_INSTALL_DIR

          $proc = Start-Process -FilePath $terminal -ArgumentList "/portable" -WorkingDirectory $installDir -PassThru
          Start-Sleep -Seconds 12

          $roots = @(
            $installDir,
            (Join-Path $env:APPDATA "MetaQuotes\Terminal"),
            (Join-Path $env:LOCALAPPDATA "Programs")
          ) | Where-Object { Test-Path $_ }

          $trade = $null
          foreach ($root in $roots) {
            $trade = Get-ChildItem -Path $root -Filter "Trade.mqh" -File -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '[\\/]MQL5[\\/]Include[\\/]Trade[\\/]Trade\.mqh$' } |
              Select-Object -First 1
            if ($trade) { break }
          }

          if (!$trade) {
            if (!$proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
            Start-Process -FilePath $terminal -ArgumentList "/portable" -WorkingDirectory $installDir | Out-Null
            Start-Sleep -Seconds 8
            $trade = Get-ChildItem -Path $installDir -Filter "Trade.mqh" -File -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '[\\/]MQL5[\\/]Include[\\/]Trade[\\/]Trade\.mqh$' } |
              Select-Object -First 1
          }

          if (!$trade) {
            throw "The MetaTrader installation does not contain MQL5\Include\Trade\Trade.mqh. Compilation cannot safely continue."
          }

          $includeDir = Split-Path (Split-Path (Split-Path $trade.FullName -Parent) -Parent) -Parent
          $mql5Dir = Split-Path $includeDir -Parent
          $expertsDir = Join-Path $mql5Dir "Experts"
          New-Item -ItemType Directory -Path $expertsDir -Force | Out-Null

          $compileSource = Join-Path $expertsDir "GoldHunterAI_V3_4.mq5"
          Copy-Item -Path $env:EA_SOURCE -Destination $compileSource -Force

          $compileLog = Join-Path $env:RUNNER_TEMP "GoldHunterAI_compile.log"
          "MQL5_DIR=$mql5Dir" >> $env:GITHUB_ENV
          "EXPERT_DIR=$expertsDir" >> $env:GITHUB_ENV
          "COMPILE_SOURCE=$compileSource" >> $env:GITHUB_ENV
          "COMPILE_LOG=$compileLog" >> $env:GITHUB_ENV

          Write-Host "Trade library: $($trade.FullName)"
          Write-Host "MQL5 directory: $mql5Dir"
          Write-Host "EA source: $compileSource"

          if (!$proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }

      - name: Compile GOLD HUNTER AI
        shell: pwsh
        run: |
          $editor = $env:METAEDITOR_PATH
          $source = $env:COMPILE_SOURCE
          $log = $env:COMPILE_LOG
          $ex5 = Join-Path $env:EXPERT_DIR "GoldHunterAI_V3_4.ex5"

          if (!(Test-Path $editor -PathType Leaf)) { throw "MetaEditor executable is missing: $editor" }
          if (!(Test-Path $source -PathType Leaf)) { throw "EA source is missing: $source" }
          if (!(Test-Path (Join-Path $env:MQL5_DIR "Include\Trade\Trade.mqh") -PathType Leaf)) {
            throw "The standard Trade.mqh include is missing from the selected MQL5 data directory."
          }

          Remove-Item $log -Force -ErrorAction SilentlyContinue
          $arguments = "/compile:`"$source`" /log:`"$log`""
          $p = Start-Process -FilePath $editor -ArgumentList $arguments -Wait -PassThru
          Write-Host "MetaEditor process exit code: $($p.ExitCode)"
          Start-Sleep -Seconds 2

          if (!(Test-Path $log -PathType Leaf)) {
            throw "MetaEditor did not create a compiler log."
          }

          $logText = Get-Content $log -Raw
          Write-Host "========== COMPILER LOG =========="
          Write-Host $logText
          Write-Host "=================================="

          if ($logText -match '(?i)Result:\s*[1-9]\d*\s+errors?') {
            throw "Compilation failed. Review the compiler log above."
          }
          if ($logText -match '(?i)\b[1-9]\d*\s+errors?\b') {
            throw "Compiler reported errors. Review the compiler log above."
          }
          if (!(Test-Path $ex5 -PathType Leaf) -or (Get-Item $ex5).Length -eq 0) {
            throw "Compiler did not produce a non-empty GoldHunterAI_V3_4.ex5 file."
          }

          Write-Host "SUCCESS: EX5 generated: $ex5"
          Write-Host "EX5 size: $((Get-Item $ex5).Length) bytes"

      - name: Collect build logs
        if: always()
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "build-output"
          New-Item -ItemType Directory -Path $dest -Force | Out-Null

          if ($env:COMPILE_LOG -and (Test-Path $env:COMPILE_LOG -PathType Leaf)) {
            Copy-Item $env:COMPILE_LOG (Join-Path $dest "GoldHunterAI_compile.log") -Force
          }

          if ($env:EXPERT_DIR) {
            $ex5 = Join-Path $env:EXPERT_DIR "GoldHunterAI_V3_4.ex5"
            if (Test-Path $ex5 -PathType Leaf) {
              Copy-Item $ex5 (Join-Path $dest "GoldHunterAI_V3_4.ex5") -Force
            }
          }

          if (!(Get-ChildItem $dest -File -ErrorAction SilentlyContinue)) {
            "No compiler output was created. Review earlier workflow steps." |
              Set-Content (Join-Path $dest "build-status.txt")
          }
          Write-Host "Build output directory: $dest"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GOLD-HUNTER-AI-V3-4-Build
          path: ${{ runner.temp }}\build-output\*
          if-no-files-found: warn
          retention-days: 14
