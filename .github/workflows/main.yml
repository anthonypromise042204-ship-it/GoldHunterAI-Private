name: GOLD HUNTER AI V4.11 Compiler

on:
workflow_dispatch:
push:
branches:
- main
- goldhunter-v4-safety-upgrade
paths:
- 'GoldHunterAI_V4_11.mq5'
- '.github/workflows/main.yml'
- 'Include/'
- 'Libraries/'

permissions:
contents: read

jobs:
compile:
name: Initialize MT5 and Compile GoldHunterAI V4.11
runs-on: windows-latest
timeout-minutes: 30

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Verify source file
    shell: pwsh
    run: |
      $ErrorActionPreference = "Stop"
      $source = Join-Path $env:GITHUB_WORKSPACE "GoldHunterAI_V4_11.mq5"

      if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
          throw "GoldHunterAI_V4_11.mq5 was not found in the repository root."
      }

      $hash = (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash
      New-Item -ItemType Directory -Path "build-output" -Force | Out-Null

      @(
          "Source: $source"
          "SHA256: $hash"
      ) | Out-File "build-output/source-diagnostics.txt" -Encoding utf8

      Write-Host "Source SHA256: $hash"

  - name: Download and verify official MT5 installer
    shell: pwsh
    run: |
      $ErrorActionPreference = "Stop"
      $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"
      $url = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"

      Invoke-WebRequest -Uri $url -OutFile $installer

      if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
          throw "The MetaTrader 5 installer was not downloaded."
      }

      $file = Get-Item -LiteralPath $installer
      if ($file.Length -lt 1MB) {
          throw "The installer is unexpectedly small."
      }

      $signature = Get-AuthenticodeSignature -FilePath $installer
      Write-Host "Installer signature: $($signature.Status)"

      if ($signature.Status -ne "Valid") {
          throw "The installer signature is not valid. Refusing to execute it."
      }

      "Installer signature: $($signature.Status)" |
          Out-File "build-output/installer-diagnostics.txt" -Encoding utf8

  - name: Install MetaTrader 5
    shell: pwsh
    run: |
      $ErrorActionPreference = "Stop"
      $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"

      $process = Start-Process `
          -FilePath $installer `
          -ArgumentList "/auto" `
          -Wait `
          -PassThru

      Write-Host "Installer exit code: $($process.ExitCode)"

      $editorCandidates = @(
          "C:\MT5\MetaEditor64.exe",
          "C:\Program Files\MetaTrader 5\MetaEditor64.exe",
          "C:\Program Files (x86)\MetaTrader 5\MetaEditor64.exe"
      )

      $terminalCandidates = @(
          "C:\MT5\terminal64.exe",
          "C:\Program Files\MetaTrader 5\terminal64.exe",
          "C:\Program Files (x86)\MetaTrader 5\terminal64.exe"
      )

      $editor = $editorCandidates |
          Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } |
          Select-Object -First 1

      $terminal = $terminalCandidates |
          Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } |
          Select-Object -First 1

      if (-not $editor) {
          throw "MetaEditor64.exe was not found."
      }

      if (-not $terminal) {
          throw "terminal64.exe was not found."
      }

      "METAEDITOR_PATH=$editor" |
          Out-File $env:GITHUB_ENV -Append -Encoding utf8

      "MT5_TERMINAL_PATH=$terminal" |
          Out-File $env:GITHUB_ENV -Append -Encoding utf8

      Write-Host "MetaEditor: $editor"
      Write-Host "Terminal: $terminal"

  - name: Initialize terminal and locate standard library
    shell: pwsh
    run: |
      $ErrorActionPreference = "Stop"
      $terminal = $env:MT5_TERMINAL_PATH
      $installDir = Split-Path -Parent $terminal
      $sourceInclude = Join-Path $installDir "MQL5\Include"
      $sourceTrade = Join-Path $sourceInclude "Trade\Trade.mqh"

      New-Item -ItemType Directory -Path "build-output" -Force | Out-Null

      if (-not (Test-Path -LiteralPath $sourceTrade -PathType Leaf)) {
          throw "Official Trade.mqh is missing from the installation. No unverified library will be downloaded."
      }

      $terminalProcess = Start-Process `
          -FilePath $terminal `
          -ArgumentList "/portable" `
          -PassThru

      Start-Sleep -Seconds 20

      if (-not $terminalProcess.HasExited) {
          Stop-Process -Id $terminalProcess.Id -Force -ErrorAction SilentlyContinue
      }

      $dataInclude = Join-Path $installDir "MQL5\Include"
      $dataTrade = Join-Path $dataInclude "Trade\Trade.mqh"

      if (-not (Test-Path -LiteralPath $dataTrade -PathType Leaf)) {
          throw "Trade.mqh is missing from the portable Include directory."
      }

      # Copy the complete official Include tree into the repository's
      # Include folder so MetaEditor can resolve the project's relative
      # Include\Trade\Trade.mqh reference.
      $projectInclude = Join-Path $env:GITHUB_WORKSPACE "Include"
      New-Item -ItemType Directory -Path $projectInclude -Force | Out-Null

      Copy-Item `
          -Path (Join-Path $sourceInclude "*") `
          -Destination $projectInclude `
          -Recurse `
          -Force

      $projectTrade = Join-Path $projectInclude "Trade\Trade.mqh"

      if (-not (Test-Path -LiteralPath $projectTrade -PathType Leaf)) {
          throw "Trade.mqh was not found after copying the verified Include tree."
      }

      "MT5_INCLUDE_PATH=$projectInclude" |
          Out-File $env:GITHUB_ENV -Append -Encoding utf8

      @(
          "Terminal: $terminal"
          "Official library: $sourceTrade"
          "Project Include directory: $projectInclude"
          "Copied Trade.mqh: $projectTrade"
      ) | Out-File "build-output/library-diagnostics.txt" -Encoding utf8

      Write-Host "Verified official library: $sourceTrade"
      Write-Host "Project Include directory: $projectInclude"

  - name: Compile GoldHunterAI V4.11
    shell: pwsh
    run: |
      $ErrorActionPreference = "Stop"

      $source = Join-Path $env:GITHUB_WORKSPACE "GoldHunterAI_V4_11.mq5"
      $editor = $env:METAEDITOR_PATH
      $include = $env:MT5_INCLUDE_PATH
      $output = Join-Path $env:GITHUB_WORKSPACE "build-output"
      $log = Join-Path $output "GoldHunterAI_V4_11_compile.log"
      $ex5 = Join-Path $env:GITHUB_WORKSPACE "GoldHunterAI_V4_11.ex5"

      if (-not (Test-Path -LiteralPath $editor -PathType Leaf)) {
          throw "MetaEditor executable is missing."
      }

      if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
          throw "The source file is missing."
      }

      if (-not (Test-Path -LiteralPath (Join-Path $include "Trade\Trade.mqh") -PathType Leaf)) {
          throw "Trade.mqh validation failed. Compilation refused."
      }

      if (Test-Path -LiteralPath $ex5) {
          Remove-Item -LiteralPath $ex5 -Force
      }

      $arguments = "/compile:`"$source`" /log:`"$log`""

      Write-Host "Compiling: $source"
      Write-Host "Using MetaEditor: $editor"
      Write-Host "Using Include directory: $include"

      $compileProcess = Start-Process `
          -FilePath $editor `
          -ArgumentList $arguments `
          -Wait `
          -PassThru

      Write-Host "MetaEditor exit code: $($compileProcess.ExitCode)"
      Start-Sleep -Seconds 2

      if (-not (Test-Path -LiteralPath $log -PathType Leaf)) {
          throw "MetaEditor did not produce a compilation log."
      }

      $logText = Get-Content -LiteralPath $log -Raw
      Write-Host $logText

      $errorMatch = [regex]::Match(
          $logText,
          'Result:\s*(\d+)\s+errors?,\s*(\d+)\s+warnings?',
          [System.Text.RegularExpressions.RegexOptions]::IgnoreCase
      )

      if (-not $errorMatch.Success) {
          throw "The compilation log has no recognizable final summary."
      }

      $errorCount = [int]$errorMatch.Groups[1].Value
      $warningCount = [int]$errorMatch.Groups[2].Value

      if ($errorCount -ne 0) {
          throw "Compilation failed with $errorCount error(s) and $warningCount warning(s)."
      }

      if (-not (Test-Path -LiteralPath $ex5 -PathType Leaf)) {
          throw "No compiled EX5 file was produced."
      }

      $compiledFile = Get-Item -LiteralPath $ex5

      if ($compiledFile.Length -le 0) {
          throw "The compiled EX5 file is empty."
      }

      @(
          "Compilation result: SUCCESS"
          "Errors: $errorCount"
          "Warnings: $warningCount"
          "EX5 size: $($compiledFile.Length) bytes"
      ) | Out-File "build-output/build-summary.txt" -Encoding utf8

      Copy-Item -LiteralPath $ex5 `
          -Destination (Join-Path $output "GoldHunterAI_V4_11.ex5") `
          -Force

      Write-Host "Compilation succeeded with zero errors."
      Write-Host "EX5 size: $($compiledFile.Length) bytes"

  - name: Upload build diagnostics
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: GOLD-HUNTER-AI-V4-11-Build-Results
      path: build-output/
      if-no-files-found: warn
      retention-days: 14
