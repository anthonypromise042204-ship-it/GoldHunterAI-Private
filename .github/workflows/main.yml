name: GOLD HUNTER AI Compiler

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify EA source
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "GoldHunterAI_V3_4.mq5"

          if (!(Test-Path $source -PathType Leaf)) {
            throw "GoldHunterAI_V3_4.mq5 was not found in the repository root."
          }

          if ((Get-Item $source).Length -eq 0) {
            throw "The EA source file is empty."
          }

          Write-Host "Source verified: $source"
          Write-Host "Size: $((Get-Item $source).Length) bytes"

      - name: Download MetaTrader 5
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"
          $url = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer `
            -TimeoutSec 180

          if (!(Test-Path $installer -PathType Leaf)) {
            throw "MetaTrader installer download failed."
          }

          if ((Get-Item $installer).Length -lt 100000) {
            throw "Installer file is unexpectedly small."
          }

          Write-Host "MetaTrader installer downloaded."

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"
          $installDir = "C:\MT5"

          New-Item -ItemType Directory -Path $installDir -Force |
            Out-Null

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList @("/auto", "/path:$installDir") `
            -Wait `
            -PassThru

          Write-Host "Installer exit code: $($process.ExitCode)"

          $editor = Get-ChildItem `
            -Path $installDir `
            -Filter "metaeditor64.exe" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (!$editor) {
            throw "MetaEditor64.exe was not found after installation."
          }

          $terminal = Get-ChildItem `
            -Path $installDir `
            -Filter "terminal64.exe" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (!$terminal) {
            throw "terminal64.exe was not found after installation."
          }

          Write-Host "MetaEditor: $($editor.FullName)"
          Write-Host "Terminal: $($terminal.FullName)"

          "METAEDITOR_PATH=$($editor.FullName)" >> $env:GITHUB_ENV
          "TERMINAL_PATH=$($terminal.FullName)" >> $env:GITHUB_ENV
      - name: Find MetaTrader installation and trading library
        shell: pwsh
        run: |
          Write-Host "Searching for MetaTrader installation..."

          $roots = @(
            "C:\MT5",
            "$env:APPDATA\MetaQuotes",
            "$env:LOCALAPPDATA\Programs",
            "C:\Program Files",
            "C:\Program Files (x86)"
          )

          foreach ($root in $roots) {
            if (Test-Path $root) {
              Write-Host "Checking: $root"

              Get-ChildItem `
                -Path $root `
                -Filter "Trade.mqh" `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 10 -ExpandProperty FullName
            }
          }

          Write-Host "Searching for MetaEditor..."

          Get-ChildItem `
            -Path "C:\MT5" `
            -Filter "metaeditor64.exe" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 5 -ExpandProperty FullName

      - name: Compile GOLD HUNTER AI
        shell: pwsh
        run: |
          $editor = $env:METAEDITOR_PATH
          $source = $env:COMPILE_SOURCE
          $log = $env:COMPILE_LOG

          if (!(Test-Path $editor -PathType Leaf)) {
            throw "MetaEditor executable is missing."
          }

          if (!(Test-Path $source -PathType Leaf)) {
            throw "EA source for compilation is missing."
          }

          Remove-Item $log -Force -ErrorAction SilentlyContinue

          Write-Host "Starting MetaEditor compiler..."
          Write-Host "Source: $source"
          Write-Host "Log: $log"

          $arguments = "/compile:$source /log:$log"

          $process = Start-Process `
            -FilePath $editor `
            -ArgumentList $arguments `
            -Wait `
            -PassThru

          Write-Host "MetaEditor process exit code: $($process.ExitCode)"

          Start-Sleep -Seconds 3

          if (!(Test-Path $log -PathType Leaf)) {
            throw "MetaEditor did not produce a compiler log."
          }

          $logText = Get-Content $log -Raw

          Write-Host "========== COMPILER LOG =========="
          Write-Host $logText
          Write-Host "=================================="

          $ex5 = Join-Path $env:EXPERT_DIR "GoldHunterAI_V3_4.ex5"

          if ($logText -match '(?i)Result:\s*[1-9]\d*\s+errors?') {
            throw "Compilation failed. Review the compiler log."
          }

          if ($logText -match '(?i)\b\d+\s+errors?\b') {
            if ($logText -match '(?i)\b[1-9]\d*\s+errors?\b') {
              throw "Compiler reported errors. Review the compiler log."
            }
          }

          if (!(Test-Path $ex5 -PathType Leaf)) {
            throw "Compilation did not produce GoldHunterAI_V3_4.ex5."
          }

          if ((Get-Item $ex5).Length -eq 0) {
            throw "The generated EX5 file is empty."
          }

          Write-Host "EX5 file created: $ex5"
          Write-Host "EX5 size: $((Get-Item $ex5).Length) bytes"

      - name: Upload compiled EA and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GOLD-HUNTER-AI-V3-4-Build
          path: |
            C:\MT5\MQL5\Experts\GoldHunterAI_V3_4.ex5
            ${{ runner.temp }}\GoldHunterAI_compile.log
          if-no-files-found: warn
          retention-days: 14
