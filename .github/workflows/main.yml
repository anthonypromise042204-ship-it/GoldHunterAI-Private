name: Compile GOLD HUNTER AI

on:
  push:
    paths:
      - "GoldHunterAI_V3_4.mq5"
      - ".github/workflows/main.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Verify source file
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "GoldHunterAI_V3_4.mq5"

          if (!(Test-Path $source)) {
            Write-Host "Files in repository:"
            Get-ChildItem $env:GITHUB_WORKSPACE -Recurse -File |
              Select-Object -ExpandProperty FullName

            throw "GoldHunterAI_V3_4.mq5 was not found."
          }

          Write-Host "Source file found: $source"

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"
          $url = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"

          Invoke-WebRequest -Uri $url -OutFile $installer

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList '/auto', '/path:"C:\MT5"' `
            -Wait `
            -PassThru

          Write-Host "Installer exit code: $($process.ExitCode)"

          $editor = "C:\MT5\metaeditor64.exe"

          if (!(Test-Path $editor)) {
            $found = Get-ChildItem "C:\MT5" `
              -Filter "metaeditor64.exe" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($found) {
              $editor = $found.FullName
            }
          }

          if (!(Test-Path $editor)) {
            throw "MetaEditor was not found after installation."
          }

          "METAEDITOR_PATH=$editor" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "MetaEditor found: $editor"

      - name: Initialize MetaTrader terminal
        shell: pwsh
        run: |
          $terminal = "C:\MT5\terminal64.exe"

          if (!(Test-Path $terminal)) {
            $found = Get-ChildItem "C:\MT5" `
              -Filter "terminal64.exe" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($found) {
              $terminal = $found.FullName
            }
          }

          if (!(Test-Path $terminal)) {
            throw "MetaTrader terminal executable was not found."
          }

          $process = Start-Process `
            -FilePath $terminal `
            -ArgumentList "/portable" `
            -PassThru

          Start-Sleep -Seconds 45

          if (!$process.HasExited) {
            Stop-Process -Id $process.Id -Force
          }

          Write-Host "Terminal initialization step completed."

      - name: Locate MQL5 standard library
        shell: pwsh
        run: |
          $roots = @(
            "C:\MT5",
            "$env:APPDATA\MetaQuotes\Terminal",
            "$env:LOCALAPPDATA\MetaQuotes\Terminal",
            "$env:USERPROFILE\AppData\Roaming\MetaQuotes\Terminal"
          )

          $tradeFile = $null

          foreach ($root in $roots) {
            if (Test-Path $root) {
              Write-Host "Searching: $root"

              $tradeFile = Get-ChildItem `
                -Path $root `
                -Filter "Trade.mqh" `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($tradeFile) {
                break
              }
            }
          }

          if (!$tradeFile) {
            throw "Trade.mqh is missing. The MQL5 standard library was not found."
          }

          Write-Host "Found library: $($tradeFile.FullName)"

          $tradeDirectory = Split-Path $tradeFile.FullName -Parent
          $includeDirectory = Split-Path $tradeDirectory -Parent
          $targetInclude = "C:\MT5\MQL5\Include"

          New-Item `
            -ItemType Directory `
            -Path $targetInclude `
            -Force | Out-Null

          if ($includeDirectory.TrimEnd('\') -ne $targetInclude.TrimEnd('\')) {
            Copy-Item `
              -Path "$includeDirectory\*" `
              -Destination $targetInclude `
              -Recurse `
              -Force
          }

          if (!(Test-Path "$targetInclude\Trade\Trade.mqh")) {
            throw "Trade.mqh is still missing from the destination."
          }

          Write-Host "MQL5 standard library is ready."

      - name: Compile Expert Advisor
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "GoldHunterAI_V3_4.mq5"
          $folder = "C:\MT5\MQL5\Experts"

          New-Item `
            -ItemType Directory `
            -Path $folder `
            -Force | Out-Null

          Copy-Item `
            -Path $source `
            -Destination "$folder\GoldHunterAI_V3_4.mq5" `
            -Force

          $compiled = "$folder\GoldHunterAI_V3_4.ex5"
          $log = "$folder\GoldHunterAI_V3_4.log"

          Remove-Item $compiled, $log `
            -Force `
            -ErrorAction SilentlyContinue

          $arguments = "/compile:`"$folder\GoldHunterAI_V3_4.mq5`" /log"

          $process = Start-Process `
            -FilePath $env:METAEDITOR_PATH `
            -ArgumentList $arguments `
            -Wait `
            -PassThru

          Start-Sleep -Seconds 3

          if (Test-Path $log) {
            Get-Content $log
          }

          if (!(Test-Path $compiled)) {
            throw "Compilation failed. No EX5 file was generated."
          }

          if ((Get-Item $compiled).Length -eq 0) {
            throw "The generated EX5 file is empty."
          }

          Write-Host "Compilation output: $compiled"

      - name: Upload compiled EA
        uses: actions/upload-artifact@v4
        with:
          name: GOLD-HUNTER-AI-EX5
          path: C:\MT5\MQL5\Experts\GoldHunterAI_V3_4.ex5
          if-no-files-found: error
