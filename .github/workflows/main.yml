name: Compile GOLD HUNTER AI

on:
  push:
    paths:
      - 'GoldHunterAI_V3_4.mq5'
      - '.github/workflows/main.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Install and Compile EA
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Download Repository
        uses: actions/checkout@v4

      - name: Verify EA Source
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\GoldHunterAI_V3_4.mq5")) {
            throw "GoldHunterAI_V3_4.mq5 was not found."
          }

          Write-Host "EA source file found."

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installer = "$env:TEMP\mt5setup.exe"
          $installPath = "C:\MT5"

          New-Item -ItemType Directory `
            -Path $installPath -Force | Out-Null

          Invoke-WebRequest `
            -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" `
            -OutFile $installer

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList "/auto", "/path:$installPath" `
            -PassThru -Wait

          Write-Host "Installer exit code: $($process.ExitCode)"

          $terminal = Get-ChildItem `
            -Path $installPath `
            -Filter "terminal64.exe" `
            -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $terminal) {
            throw "terminal64.exe was not found under C:\MT5. Installation needs investigation."
          }

          $platformPath = $terminal.DirectoryName

          $editor = Get-ChildItem `
            -Path $platformPath `
            -Filter "metaeditor64.exe" `
            -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $editor) {
            $editor = Get-ChildItem `
              -Path $installPath `
              -Filter "metaeditor64.exe" `
              -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }

          if (-not $editor) {
            throw "MetaEditor was not found."
          }

          "MT5_PATH=$platformPath" |
            Out-File $env:GITHUB_ENV -Append

          "MT5_EDITOR=$($editor.FullName)" |
            Out-File $env:GITHUB_ENV -Append

          Write-Host "Platform path: $platformPath"
          Write-Host "MetaEditor: $($editor.FullName)"

      - name: Initialize MT5 Platform
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path "$env:MT5_PATH\terminal64.exe")) {
            throw "MetaTrader platform was not found at $env:MT5_PATH"
          }

          $process = Start-Process `
            -FilePath "$env:MT5_PATH\terminal64.exe" `
            -ArgumentList "/portable" `
            -WorkingDirectory "$env:MT5_PATH" `
            -PassThru

          Start-Sleep -Seconds 60

          if (-not $process.HasExited) {
            Stop-Process -Id $process.Id -Force `
              -ErrorAction SilentlyContinue
          }

          $tradeFile = Get-ChildItem `
            -Path $env:MT5_PATH `
            -Filter "Trade.mqh" `
            -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($tradeFile) {
            Write-Host "Trade.mqh found: $($tradeFile.FullName)"
          } else {
            Write-Host "WARNING: Trade.mqh was not found."
          }

      - name: Compile GOLD HUNTER AI
        uses: FX31337/MQL-Compile-Action@v2
        with:
          path: 'GoldHunterAI_V3_4.mq5'
          mt-path: ${{ env.MT5_PATH }}
          init-platform: true
          log-file: 'compile.log'
          verbose: true

      - name: List Build Files
        if: always()
        shell: pwsh
        run: |
          Write-Host "Searching for compiled files and logs..."

          Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Include "*.ex5", "compile.log", "GoldHunterAI_V3_4.log" `
            -File -Recurse -ErrorAction SilentlyContinue |
            ForEach-Object {
              Write-Host $_.FullName
            }

      - name: Upload Build Files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GoldHunterAI-Build-Files
          path: |
            **/*.ex5
            **/compile.log
            **/GoldHunterAI_V3_4.log
          if-no-files-found: warn
          retention-days: 7
