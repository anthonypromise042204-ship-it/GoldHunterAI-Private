name: GOLD HUNTER AI V4.11 Compiler

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - goldhunter-v4-safety-upgrade
    paths:
      - 'GoldHunterAI_V4_11.mq5'
      - '.github/workflows/main.yml'
      - 'Include/**'
      - 'Libraries/**'

permissions:
  contents: read

jobs:
  compile:
    name: Compile GoldHunterAI V4.11
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare build directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $buildDir = Join-Path $env:GITHUB_WORKSPACE 'build-output'
          New-Item -ItemType Directory -Path $buildDir -Force | Out-Null
          "BUILD_OUTPUT=$buildDir" >> $env:GITHUB_ENV

      - name: Verify V4.11 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'GoldHunterAI_V4_11.mq5'

          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
            throw 'GoldHunterAI_V4_11.mq5 was not found.'
          }

          $version = Select-String -LiteralPath $source -Pattern '^\s*#property\s+version\s+"4\.11"\s*$' -ErrorAction SilentlyContinue

          if (-not $version) {
            throw 'Expected version 4.11 was not found.'
          }

          $hash = Get-FileHash -LiteralPath $source -Algorithm SHA256

          @(
            "Source: $source"
            "SHA256: $($hash.Hash)"
            "Version: 4.11"
          ) | Set-Content (Join-Path $env:BUILD_OUTPUT 'source-diagnostics.txt')

          "EA_SOURCE=$source" >> $env:GITHUB_ENV

          Write-Host "Verified source: $source"
          Write-Host "SHA256: $($hash.Hash)"

      - name: Download MetaTrader 5 installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $installer `
            -UseBasicParsing

          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw 'MetaTrader installer download failed.'
          }

          if ((Get-Item -LiteralPath $installer).Length -lt 1MB) {
            throw 'MetaTrader installer is unexpectedly small.'
          }

          $signature = Get-AuthenticodeSignature -FilePath $installer

          if ($signature.Status -ne 'Valid') {
            throw "Installer signature is not valid: $($signature.Status)"
          }

          "MT5_INSTALLER=$installer" >> $env:GITHUB_ENV

          Write-Host "Installer signature: $($signature.Status)"
          Write-Host "Installer signer: $($signature.SignerCertificate.Subject)"

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installDir = 'C:\MT5'

          New-Item -ItemType Directory -Path $installDir -Force | Out-Null

          $process = Start-Process `
            -FilePath $env:MT5_INSTALLER `
            -ArgumentList @('/auto', "/path:$installDir") `
            -PassThru `
            -Wait

          Write-Host "Installer exit code: $($process.ExitCode)"

          $searchRoots = @(
            'C:\MT5',
            'C:\Program Files\MetaTrader 5',
            'C:\Program Files (x86)\MetaTrader 5'
          )

          $editor = $null

          foreach ($root in $searchRoots) {
            $possible = Join-Path $root 'MetaEditor64.exe'

            if (Test-Path -LiteralPath $possible -PathType Leaf) {
              $editor = $possible
              break
            }
          }

          if (-not $editor) {
            foreach ($root in $searchRoots) {
              if (Test-Path -LiteralPath $root -PathType Container) {
                $found = Get-ChildItem `
                  -LiteralPath $root `
                  -Filter 'MetaEditor64.exe' `
                  -File `
                  -Recurse `
                  -ErrorAction SilentlyContinue |
                  Select-Object -First 1

                if ($found) {
                  $editor = $found.FullName
                  break
                }
              }
            }
          }

          if (-not $editor) {
            throw 'MetaEditor64.exe was not found after installation.'
          }

          $mt5Root = Split-Path -Parent $editor
          $terminal = Join-Path $mt5Root 'terminal64.exe'

          $editorInfo = (Get-Item -LiteralPath $editor).VersionInfo
          $editorVersion = "$($editorInfo.ProductVersion) (file $($editorInfo.FileVersion))"
          $terminalVersion = 'Terminal executable not found'

          if (Test-Path -LiteralPath $terminal -PathType Leaf) {
            $terminalInfo = (Get-Item -LiteralPath $terminal).VersionInfo
            $terminalVersion = "$($terminalInfo.ProductVersion) (file $($terminalInfo.FileVersion))"
          }

          "METAEDITOR_PATH=$editor" >> $env:GITHUB_ENV
          "MT5_ROOT=$mt5Root" >> $env:GITHUB_ENV

          @(
            "MetaEditor: $editor"
            "MetaEditor version: $editorVersion"
            "Terminal: $terminal"
            "Terminal version: $terminalVersion"
            "MT5 root: $mt5Root"
            "Installer exit code: $($process.ExitCode)"
          ) | Set-Content (Join-Path $env:BUILD_OUTPUT 'installation-diagnostics.txt')

          Write-Host "MetaEditor: $editor"
          Write-Host "MetaEditor version: $editorVersion"
          Write-Host "Terminal version: $terminalVersion"
          Write-Host "MT5 root: $mt5Root"

      - name: Validate installed MT5 Include library
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installInclude = Join-Path $env:MT5_ROOT 'MQL5\Include'

          $required = @(
            'Trade\Trade.mqh',
            'Trade\PositionInfo.mqh',
            'Trade\SymbolInfo.mqh',
            'Trade\AccountInfo.mqh'
          )

          $missing = @()

          Write-Host "MT5 root: $env:MT5_ROOT"
          Write-Host "Checking installation Include directory: $installInclude"

          if (-not (Test-Path -LiteralPath $installInclude -PathType Container)) {
            @(
              "MT5 root: $env:MT5_ROOT"
              "Include root: $installInclude"
              'Result: Include directory missing'
            ) | Set-Content (Join-Path $env:BUILD_OUTPUT 'include-diagnostics.txt')

            throw "Installed MT5 Include directory does not exist: $installInclude"
          }

          foreach ($relative in $required) {
            $file = Join-Path $installInclude $relative

            if (Test-Path -LiteralPath $file -PathType Leaf) {
              Write-Host "FOUND: $file"
            } else {
              Write-Host "MISSING: $file"
              $missing += $relative
            }
          }

          $tradePath = Join-Path $installInclude 'Trade\Trade.mqh'

          if (Test-Path -LiteralPath $tradePath -PathType Leaf) {
            $tradeText = Get-Content -LiteralPath $tradePath -Raw

            if ($tradeText -notmatch 'SetTypeFillingBySymbol') {
              Write-Host 'INCOMPATIBLE: SetTypeFillingBySymbol was not found.'
              $missing += 'Trade\Trade.mqh: SetTypeFillingBySymbol missing'
            }
          }

          @(
            "MT5 root: $env:MT5_ROOT"
            "MetaEditor: $env:METAEDITOR_PATH"
            "Include root: $installInclude"
            "Missing or incompatible entries: $($missing -join ', ')"
            'Third-party fallback: disabled'
            'Include files overwritten: no'
          ) | Set-Content (Join-Path $env:BUILD_OUTPUT 'include-diagnostics.txt')

          if ($missing.Count -gt 0) {
            throw "Installed MT5 standard library is incomplete or incompatible. See include-diagnostics.txt. No replacement library was downloaded."
          }

          "MQL5_INCLUDE=$installInclude" >> $env:GITHUB_ENV

          Write-Host "Validated installed Include directory: $installInclude"

      - name: Prepare compilation environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $expertDir = Join-Path $env:MT5_ROOT 'MQL5\Experts'
          New-Item -ItemType Directory -Path $expertDir -Force | Out-Null

          $target = Join-Path $expertDir 'GoldHunterAI_V4_11.mq5'
          Copy-Item -LiteralPath $env:EA_SOURCE -Destination $target -Force

          $ex5 = Join-Path $expertDir 'GoldHunterAI_V4_11.ex5'

          if (Test-Path -LiteralPath $ex5) {
            Remove-Item -LiteralPath $ex5 -Force
          }

          if (-not (Test-Path -LiteralPath (Join-Path $env:MQL5_INCLUDE 'Trade\Trade.mqh') -PathType Leaf)) {
            throw 'Trade.mqh is missing immediately before compilation.'
          }

          "EA_TARGET=$target" >> $env:GITHUB_ENV
          "EA_EX5=$ex5" >> $env:GITHUB_ENV

          Write-Host "EA source: $target"
          Write-Host "Include root: $env:MQL5_INCLUDE"

      - name: Compile GoldHunterAI V4.11
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $compileLog = Join-Path $env:BUILD_OUTPUT 'GoldHunterAI_V4_11_compile.log'

          $process = Start-Process `
            -FilePath $env:METAEDITOR_PATH `
            -ArgumentList @(
              "/compile:$($env:EA_TARGET)",
              "/log:$compileLog"
            ) `
            -PassThru `
            -Wait

          Write-Host "MetaEditor exit code: $($process.ExitCode)"
          Start-Sleep -Seconds 2

          if (-not (Test-Path -LiteralPath $compileLog -PathType Leaf)) {
            throw 'MetaEditor did not create a compilation log.'
          }

          $logText = Get-Content -LiteralPath $compileLog -Raw
          Get-Content -LiteralPath $compileLog

          $errorsMatch = [regex]::Match($logText, '(?im)\b(\d+)\s+errors?\b')

          if (-not $errorsMatch.Success) {
            throw 'Could not determine compiler error count.'
          }

          $errorCount = [int]$errorsMatch.Groups[1].Value
          Write-Host "Compiler errors: $errorCount"

          if ($errorCount -ne 0) {
            throw "Compilation failed with $errorCount error(s)."
          }

          if (-not (Test-Path -LiteralPath $env:EA_EX5 -PathType Leaf)) {
            throw 'Compilation log reported no errors, but the EX5 file is missing.'
          }

          $ex5Info = Get-Item -LiteralPath $env:EA_EX5

          if ($ex5Info.Length -le 0) {
            throw 'The generated EX5 file is empty.'
          }

          @(
            "Compiler errors: $errorCount"
            "MetaEditor exit code: $($process.ExitCode)"
            "EX5 file: $($ex5Info.FullName)"
            "EX5 size: $($ex5Info.Length) bytes"
          ) | Set-Content (Join-Path $env:BUILD_OUTPUT 'compile-summary.txt')

      - name: Collect build results
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $resultDir = $env:BUILD_OUTPUT

          if (-not (Test-Path -LiteralPath $resultDir)) {
            New-Item -ItemType Directory -Path $resultDir -Force | Out-Null
          }

          if ($env:MT5_ROOT) {
            $ex5 = Join-Path $env:MT5_ROOT 'MQL5\Experts\GoldHunterAI_V4_11.ex5'
            $artifactEx5 = Join-Path $resultDir 'GoldHunterAI_V4_11.ex5'

            if ((Test-Path -LiteralPath $ex5 -PathType Leaf) -and
                ([IO.Path]::GetFullPath($ex5) -ne [IO.Path]::GetFullPath($artifactEx5))) {
              Copy-Item -LiteralPath $ex5 -Destination $artifactEx5 -Force
            }
          }

          Get-ChildItem -LiteralPath $resultDir -Force |
            Select-Object Name, Length |
            Format-Table -AutoSize

      - name: Upload build results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GoldHunterAI-V4.11-build-results
          path: build-output/
          if-no-files-found: warn
          retention-days: 14
