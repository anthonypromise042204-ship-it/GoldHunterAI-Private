name: GOLD HUNTER AI V4 Compiler

on:
  workflow_dispatch:
  push:
    paths:
      - 'GoldHunterAI_V4.mq5'
      - '.github/workflows/gold-hunter-v4.yml'

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'GoldHunterAI_V4.mq5'

          if (!(Test-Path $source -PathType Leaf)) {
            throw 'GoldHunterAI_V4.mq5 source is missing'
          }

          $text = Get-Content $source -Raw

          if ($text -notmatch '#include\s*[<"]Trade[/\\]Trade\.mqh[>"]') {
            throw 'Unexpected Trade.mqh include. Check the source file.'
          }

          Write-Host 'Source file and Trade.mqh include verified.'

      - name: Download MetaTrader installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $installer `
            -TimeoutSec 180

          if (!(Test-Path $installer -PathType Leaf)) {
            throw 'MetaTrader installer download failed'
          }

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

          Start-Process -FilePath $installer -ArgumentList '/auto' -Wait

          $roots = @(
            'C:\Program Files',
            'C:\Program Files (x86)',
            $env:LOCALAPPDATA,
            $env:APPDATA
          ) | Where-Object { $_ -and (Test-Path $_) } |
            Select-Object -Unique

          $editor = Get-ChildItem `
            -Path $roots `
            -Filter 'metaeditor64.exe' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (!$editor) {
            throw 'MetaEditor executable not found'
          }

          "METAEDITOR_PATH=$($editor.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "MT5_ROOT=$($editor.DirectoryName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "MetaEditor found: $($editor.FullName)"

      - name: Prepare standard library
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $include = Join-Path $env:MT5_ROOT 'MQL5\Include'
          $trade = Join-Path $include 'Trade\Trade.mqh'

          if (!(Test-Path $trade -PathType Leaf)) {
            $mirror = Join-Path $env:RUNNER_TEMP 'mt5-library-mirror'

            git clone --depth 1 `
              https://github.com/vmlellis/mt5-docker.git `
              $mirror

            if ($LASTEXITCODE -ne 0) {
              throw 'Could not retrieve the standard library mirror'
            }

            $mirrorInclude = Join-Path $mirror 'MetaTrader 5\MQL5\Include'
            $mirrorTrade = Join-Path $mirrorInclude 'Trade\Trade.mqh'

            if (!(Test-Path $mirrorTrade -PathType Leaf)) {
              throw 'Trade.mqh missing from library mirror'
            }

            New-Item -ItemType Directory -Path $include -Force |
              Out-Null

            Copy-Item `
              -Path (Join-Path $mirrorInclude '*') `
              -Destination $include `
              -Recurse `
              -Force
          }

          if (!(Test-Path $trade -PathType Leaf)) {
            throw 'Trade.mqh is missing from MetaEditor installation'
          }

          Write-Host "Verified library: $trade"

      - name: Compile V4
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Join-Path $env:GITHUB_WORKSPACE 'GoldHunterAI_V4.mq5'
          $experts = Join-Path $env:MT5_ROOT 'MQL5\Experts'
          $expertSource = Join-Path $experts 'GoldHunterAI_V4.mq5'
          $include = Join-Path $env:MT5_ROOT 'MQL5'
          $log = Join-Path $env:RUNNER_TEMP 'GoldHunterAI_V4_compile.log'
          $out = Join-Path $env:GITHUB_WORKSPACE 'build-output'

          New-Item -ItemType Directory -Path $experts -Force |
            Out-Null
          New-Item -ItemType Directory -Path $out -Force |
            Out-Null

          Copy-Item $source $expertSource -Force

          $arguments = "/compile:`"$expertSource`" /include:`"$include`" /log:`"$log`""

          $process = Start-Process `
            -FilePath $env:METAEDITOR_PATH `
            -ArgumentList $arguments `
            -Wait `
            -PassThru

          Start-Sleep -Seconds 2

          if (!(Test-Path $log -PathType Leaf)) {
            throw "Compiler log missing. Exit code: $($process.ExitCode)"
          }

          $logText = Get-Content $log -Raw
          Write-Host $logText

          Copy-Item $log (Join-Path $out 'GoldHunterAI_V4_compile.log') -Force

          if ($logText -match '(?im)\berror\s+\d+\s*:') {
            throw 'Compiler reported an error. Review the compile log.'
          }

          if ($logText -match '(?im)^\s*[1-9]\d*\s+errors?\b') {
            throw 'Compiler reported errors. Review the compile log.'
          }

          $ex5 = Join-Path $experts 'GoldHunterAI_V4.ex5'

          if (!(Test-Path $ex5 -PathType Leaf)) {
            throw 'EX5 file was not produced'
          }

          Copy-Item $ex5 (Join-Path $out 'GoldHunterAI_V4.ex5') -Force
          Write-Host 'EX5 file created successfully.'

      - name: Upload build results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GOLD-HUNTER-AI-V4-Build-Results
          path: build-output/
          if-no-files-found: warn
          retention-days: 14
