name: Compile GOLD HUNTER AI

on:
workflow_dispatch:

jobs:
compile:
runs-on: windows-latest
steps:
- name: Download Repository
uses: actions/checkout@v4

  - name: Check Source File
    shell: pwsh
    run: |
      $source = "GoldHunterAI_V3_4.mq5"
      if (-not (Test-Path $source)) {
        throw "Source file GoldHunterAI_V3_4.mq5 is missing."
      }
      Write-Host "Source file found."

  - name: Show Runner Information
    shell: pwsh
    run: |
      Write-Host "Windows runner is ready."
      Write-Host "Next step is to configure MetaTrader 5 compilation."
