name: GOLD HUNTER AI V4 Compiler

on:
  workflow_dispatch:
  push:
    paths:
      - "GoldHunterAI_V4.mq5"
      - ".github/workflows/main.yml"
      - ".github/workflows/gold-hunter-v4.yml"

permissions:
  contents: read

jobs:
  compile:
    name: Install MT5 and Compile GoldHunterAI V4
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare build output and verify source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $out = Join-Path $env:GITHUB_WORKSPACE 'build-output'
          New-Item -ItemType Directory -Path $out -Force | Out-Null

          $source = Join-Path $env:GITHUB_WORKSPACE 'GoldHunterAI_V4.mq5'

          if (!(Test-Path -LiteralPath $source -PathType Leaf)) {
            throw "GoldHunterAI_V4.mq5 is missing from the repository root."
          }

          $file = Get-Item -LiteralPath $source
          $hash = (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash

          @(
            "Source: $($file.FullName)"
            "Size: $($file.Length) bytes"
            "SHA256: $hash"
            "Commit: $env:GITHUB_SHA"
            "Run ID: $env:GITHUB_RUN_ID"
            "Runner OS: $env:RUNNER_OS"
          ) | Set-Content (Join-Path $out 'environment-diagnostics.txt')

          Write-Host "Source verified: $($file.FullName)"
          Write-Host "SHA256: $hash"

      - name: Download official MetaTrader 5 installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          $url = 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe'

          Invoke-WebRequest -Uri $url -OutFile $installer -TimeoutSec 240

          if (!(Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw 'MT5 installer download failed.'
          }

          $file = Get-Item -LiteralPath $installer

          if ($file.Length -lt 1MB) {
            throw 'Downloaded MT5 installer is unexpectedly small.'
          }

          $signature = Get-AuthenticodeSignature -FilePath $installer

          Write-Host "Installer size: $($file.Length)"
          Write-Host "Signature status: $($signature.Status)"

          if ($signature.Status -ne 'Valid') {
            throw "MT5 installer signature validation failed: $($signature.Status)"
          }

          "MT5_INSTALLER=$installer" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install MetaTrader 5 and locate executables
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installPath = 'C:\MT5'
          New-Item -ItemType Directory -Path $installPath -Force | Out-Null

          $process = Start-Process `
            -FilePath $env:MT5_INSTALLER `
            -ArgumentList @('/auto', "/path:$installPath") `
            -Wait `
            -PassThru

          Write-Host "Installer exit code: $($process.ExitCode)"

          $searchRoots = @(
            'C:\MT5',
            'C:\Program Files',
            'C:\Program Files (x86)',
            $env:LOCALAPPDATA,
            $env:APPDATA
          ) | Where-Object {
            $_ -and (Test-Path -LiteralPath $_ -PathType Container)
          } | Select-Object -Unique

          $editor = $null
          $terminal = $null

          foreach ($root in $searchRoots) {
            Write-Host "Searching for MetaEditor under: $root"

            $editor = Get-ChildItem `
              -Path $root `
              -Filter 'MetaEditor64.exe' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($editor) {
              break
            }
          }

          if (!$editor) {
            throw 'MetaEditor64.exe was not found after installation.'
          }

          foreach ($root in $searchRoots) {
            $terminal = Get-ChildItem `
              -Path $root `
              -Filter 'terminal64.exe' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($terminal) {
              break
            }
          }

          if (!$terminal) {
            throw 'terminal64.exe was not found after installation.'
          }
